<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 570" role="img" aria-labelledby="title desc">
  <title id="title">Computational graph: log(x1) + x1*x2 - sin(x2)</title>
  <desc id="desc">x1 feeds log and multiply. x2 feeds multiply and sin. log and multiply feed add; add and sin feed subtract, producing y.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#708a96"/></marker></defs>
  <g fill="none" stroke="#708a96" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M130 68V100H90V143"/>
    <path d="M155 68V112H245V143"/>
    <path d="M365 68V112H275V143"/>
    <path d="M390 68V100H430V143"/>
    <path d="M90 217V260H230V293"/>
    <path d="M260 217V293"/>
    <path d="M260 357V403"/>
    <path d="M430 217V435H344"/>
    <path d="M260 467V510"/>
  </g>
  <g stroke-width="1.5" font-family="ui-monospace, Consolas, monospace" font-size="21" text-anchor="middle" fill="#203944">
    <g stroke="#64a494" fill="#e7f5ef"><rect x="70" y="14" width="130" height="54" rx="6"/><rect x="320" y="14" width="130" height="54" rx="6"/></g>
    <text x="135" y="48">x1 = 2</text><text x="385" y="48">x2 = 3</text>
    <g stroke="#92aeba" fill="#eff5f8"><rect x="15" y="143" width="150" height="74" rx="6"/><rect x="185" y="143" width="150" height="74" rx="6"/><rect x="355" y="143" width="150" height="74" rx="6"/><rect x="176" y="293" width="168" height="64" rx="6"/></g>
    <text x="90" y="171">log(x1)</text><text x="90" y="202">v1</text>
    <text x="260" y="171">x1 * x2</text><text x="260" y="202">v2</text>
    <text x="430" y="171">sin(x2)</text><text x="430" y="202">v3</text>
    <text x="260" y="319">v1 + v2</text><text x="260" y="345">v4</text>
    <rect x="176" y="403" width="168" height="64" rx="6" fill="#fcecef" stroke="#c48699"/>
    <text x="260" y="430">v4 - v3</text><text x="260" y="456">subtract</text>
    <rect x="210" y="510" width="100" height="46" rx="6" fill="#e7f5ef" stroke="#64a494"/>
    <text x="260" y="540">y</text>
  </g>
</svg>
