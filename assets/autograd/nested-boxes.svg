<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" role="img" aria-labelledby="title desc">
  <title id="title">Nested ArrayBoxes: trace 2 to trace 1 to trace 0</title>
  <desc id="desc">B2 has trace 2, node R2 and value B1. B1 has trace 1, node R1 and value B0. B0 has trace 0, node R0 and value 2.0, an ordinary float.</desc>
  <g stroke-width="1.5">
    <rect x="10" y="10" width="500" height="420" rx="8" fill="#eff5f8" stroke="#92aeba"/>
    <rect x="40" y="111" width="440" height="290" rx="6" fill="#e7f5ef" stroke="#64a494"/>
    <rect x="70" y="212" width="380" height="160" rx="6" fill="#fcecef" stroke="#c48699"/>
    <rect x="100" y="308" width="320" height="40" rx="4" fill="#fff" stroke="#ad9da5"/>
  </g>
  <g font-family="ui-monospace, Consolas, monospace" font-size="21" fill="#203944">
    <text x="30" y="44">B2: ArrayBox</text><text x="30" y="74">_trace=2   _node=R2</text><text x="30" y="100">_value = B1</text>
    <text x="60" y="144">B1: ArrayBox</text><text x="60" y="174">_trace=1   _node=R1</text><text x="60" y="200">_value = B0</text>
    <text x="90" y="245">B0: ArrayBox</text><text x="90" y="275">_trace=0   _node=R0</text>
    <text x="120" y="335">_value = 2.0 (float)</text>
  </g>
</svg>
