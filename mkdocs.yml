site_name: zdd14990
site_url: https://zdd14990.github.io/
# --- 确保加上这几行 ---
site_description: zdd'blog
site_author: zdd
# --------------------
copyright: copyright © zdd All Rights Reserved

# 仓库信息
repo_name: ""
repo_url: ""

plugins:
  - search # 必须保留搜索插件
  # - git-revision-date-localized:
  #     enable_creation_date: true
  #     type: date
  #     locale: zh
  #     fallback_to_build_date: true
  - macros:
      # 任何 Jinja/Macro 渲染错误都必须让 build 直接失败，
      # 否则错误文本会被渲染进页面而 build 仍成功退出。
      on_error_fail: true
  
  # ❌ 【已注释】Social 插件 (为了解决 Windows cairo 报错，暂时关闭自动生成图片功能)
  # - social:
  #     cards_layout_options:
  #       font_family: Roboto
  #       background_color: "#e67e96"

theme:
  name: material
  custom_dir: overrides
  language: zh
  favicon: assets/favicon.png
  icon:
    logo: material/cat
    repo: fontawesome/brands/github
  
  font: false
  
  # 强制生成 404 页面
  static_templates:
    - 404.html

  palette:
    # 亮色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式

    # 暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式

  features:
    - navigation.top
    - navigation.tracking
    - toc.follow
    - navigation.indexes
    - navigation.expand
    - search.highlight
    - search.suggest
    - content.code.copy

# 社交链接与元数据配置
extra:
  page_assets:
    personal-os:
      styles: [stylesheets/personal-os.css]
      scripts: [javascripts/personal-os-core.js, javascripts/personal-os.js]
    interactive-widgets:
      scripts: [javascripts/interactive-widgets.js]
    diagram:
      scripts: [javascripts/diagram-core.js, javascripts/diagram-editor.js]
    life:
      scripts: [javascripts/lab-life.js]
    tex:
      scripts: [javascripts/lab-tex.js]
    plot:
      scripts: [javascripts/lab-plot.js]
    isaac-dungeon:
      styles: [stylesheets/dungeon-lab.css]
      scripts: [javascripts/isaac-dungeon.js]
  sitemap_exclude:
    - 404/
    - 404.html
    - os/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zdd14990
  
  # Open Graph 元数据 (静态方案)
  meta:
    site_name: zdd'blog
    site_description: zdd'blog
    site_author: zdd
    # 页面分享元数据统一使用此封面。
    site_image: assets/cover.jpg

# CSS 样式
extra_css:
  - stylesheets/theme-tokens.css
  - stylesheets/extra.css
  - stylesheets/solid-background.css
  - stylesheets/site-layout.css
  - stylesheets/article-toc.css
  - stylesheets/knowledge-playground.css
  - stylesheets/reading.css

# JavaScript
extra_javascript:
  - javascripts/funny_title.js
  - javascripts/theme-fade.js
  - javascripts/zdd-content-data.js
  - javascripts/zdd-search-core.js
  - javascripts/zdd-command-search.js
  - javascripts/knowledge-preview.js

# Markdown 扩展
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - footnotes
  - sane_lists
  - pymdownx.arithmatex:
      generic: true
  - tables
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# 导航结构
nav:
  - Home: index.md

  - Blog: blog/index.md
  - Tags: tags/index.md
  - Friends: friends/friends.md

hooks:
  - hooks.py
