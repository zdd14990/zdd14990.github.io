site_name: zdd14990
site_url: https://zdd14990.github.io/
# --- 确保加上这几行 ---
site_description: 数学专业大三学生的数字花园，记录分析、代数与应用数学笔记。
site_author: zdd
# --------------------
copyright: copyright © zdd All Rights Reserved

# 仓库信息
repo_name: zdd14990
repo_url: https://github.com/zdd14990/zdd14990.github.io

plugins:
  - search # 必须保留搜索插件
  - git-revision-date-localized:
      enable_creation_date: true   # 显示“创建日期”
      type: date                   # 格式：2025年11月19日
      locale: zh                   # 强制中文
      fallback_to_build_date: true # 兜底构建时间
  - macros
  
  # ❌ 【已注释】Social 插件 (为了解决 Windows cairo 报错，暂时关闭自动生成图片功能)
  # - social:
  #     cards_layout_options:
  #       font_family: Roboto
  #       background_color: "#e67e96"

theme:
  name: material
  custom_dir: overrides
  language: zh
  favicon: assets/favicon.png
  icon:
    logo: material/cat
    repo: fontawesome/brands/github
  
  font:
    text: Roboto
    code: JetBrains Mono
  
  # 强制生成 404 页面
  static_templates:
    - 404.html

  palette:
    # 亮色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式

    # 暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.expand
    - search.highlight
    - search.suggest
    - content.code.copy

# 社交链接与元数据配置
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zdd14990
  
  # Open Graph 元数据 (静态方案)
  meta:
    site_name: ZDD的数理秘密花园
    site_description: 数学专业大三学生的数字花园，记录分析、代数与应用数学笔记。
    site_author: zdd
    # ✅ 这里指定一张静态图片作为分享封面 (建议找一张好看的图放进 docs/assets/ 命名为 cover.jpg)
    # 如果没有 cover.jpg，暂时用头像 avatar.jpg 代替，总比没有强
    site_image: assets/avatar.jpg 

# CSS 样式
extra_css:
  - stylesheets/extra.css

# JavaScript
extra_javascript:
  - javascripts/mathjax.js
  # - javascripts/click_effect.js
  # ✅ 【已修复】将反斜杠 \ 改为正斜杠 /，消除警告
  - javascripts/vanilla-tilt.min.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/funny_title.js
  # - javascripts/smooth_trail.js

# Markdown 扩展
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.superfences
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - tables
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# 导航结构
nav:
  - 首页: index.md
  
  - 博文:
      - 概览: blog/index.md
      - 分析:
          - 概览: blog/catalog_analysis.md
          - 分析2-H笔记: blog/others/分析2-H笔记.md
          - 实分析: blog/others/实分析.md
          - 微分几何: blog/others/微分几何.md
      
      - 代数:
          - 概览: blog/catalog_algebra.md
          - 代数2-H笔记: blog/others/代数2-H笔记.md
          - 交换代数: blog/交换代数.md
          - 表示论: blog/others/表示论.md
      
      - 应用数学:
          - 概览: blog/catalog_applied.md
          - PDE 数值解:
              - 概览: blog/PDE 数值解/PDE 数值解.md
              - 第零章:基本定义: blog/PDE 数值解/chapter0.md
              - 第一章:椭圆 PDE 的有限差分方法: blog/PDE 数值解/chapter1.md
              - 第二章:抛物 PDE 的有限差分法: blog/PDE 数值解/chapter2.md
              - 第三章:双曲 PDE 的有限差分法: blog/PDE 数值解/chapter3.md
              - 第四章:有限元理论与有限元方法: blog/PDE 数值解/chapter4.md
              - 习题一: blog/PDE 数值解/exercise1.md
              - 习题二: blog/PDE 数值解/exercise2.md
          - 凸优化: 
              - 概览: blog/凸优化/凸优化.md
              - 第一章:凸分析: blog/凸优化/chapter1.md
              - 第二章:凸多面体: blog/凸优化/chapter2.md
              - 第三章:凸优化: blog/凸优化/chapter3.md
              - 第四章:几何对偶框架: blog/凸优化/chapter4.md
              - 课程作业: blog/凸优化/homework.md
              - 大作业: blog/凸优化/大作业.md
          - 渐进分析: blog/渐进分析/渐进分析.md
          - 数据科学专题: 
              - 概览: blog/数据科学专题/数据科学专题.md
              - 大作业: blog/数据科学专题/数据科学专题大作业.md
              - 笔记: blog/数据科学专题/数据科学笔记.md
          - 应用数学博资考: 
              - 概览: blog/应用数学博资考/应用数学博资考.md
              - 数值线性代数: blog/应用数学博资考/数值线性代数.md
              - 练习题集: blog/应用数学博资考/练习题集.md
              - 数值代数练习题: blog/应用数学博资考/数值代数练习题.md
              - 数值线性代数练习题: blog/应用数学博资考/数值线性代数练习题.md
              - 数值ODE练习题: blog/应用数学博资考/数值ODE练习题.md
              - 数值PDE练习题: blog/应用数学博资考/数值PDE练习题.md
              - 数值积分练习题: blog/应用数学博资考/数值积分练习题.md
              - 函数逼近与插值练习题: blog/应用数学博资考/函数逼近与插值练习题.md
              - 渐进分析练习题: blog/应用数学博资考/渐进分析练习题.md
              - 凸优化练习题: blog/应用数学博资考/凸优化练习题.md
      - 物理:
          - 概览: blog/catalog_phy.md
          - 统计力学: blog/统计力学/统计力学.md
      - 经济学:
          - 概览: blog/catalog_econ.md
          - 中级微观经济学: blog/others/中级微观经济学.md

  - 友链:
      - 友链: 友链/友链.md

hooks:
  - hooks.py
  - main.py