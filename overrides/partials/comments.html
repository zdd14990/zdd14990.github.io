{% set zdd_giscus = config.extra.giscus %}
{% if zdd_is_article and zdd_giscus and page.meta.comments is not false %}
<section class="zdd-comments" aria-labelledby="zdd-comments-title">
  <h2 id="zdd-comments-title" class="zdd-comments-title">评论</h2>
  <div class="zdd-comments-frame" data-zdd-giscus></div>
</section>
<script>
  (function () {
    var holder = document.querySelector("[data-zdd-giscus]");
    if (!holder) return;
    function theme() {
      return document.body.getAttribute("data-md-color-scheme") === "slate" ? "dark_dimmed" : "light";
    }
    var config = {{ zdd_giscus | tojson }};
    var script = document.createElement("script");
    script.src = "https://giscus.app/client.js";
    script.async = true;
    script.crossOrigin = "anonymous";
    var attrs = {
      "data-repo": config.repo,
      "data-repo-id": config.repo_id,
      "data-category": config.category,
      "data-category-id": config.category_id,
      "data-mapping": "pathname",
      "data-strict": "1",
      "data-reactions-enabled": "1",
      "data-emit-metadata": "0",
      "data-input-position": "top",
      "data-theme": theme(),
      "data-lang": "zh-CN",
      "data-loading": "lazy"
    };
    Object.keys(attrs).forEach(function (name) { script.setAttribute(name, attrs[name]); });
    holder.appendChild(script);

    // Follow the site light/dark switch without reloading the iframe.
    new MutationObserver(function () {
      var frame = document.querySelector("iframe.giscus-frame");
      if (frame && frame.contentWindow) {
        frame.contentWindow.postMessage({giscus: {setConfig: {theme: theme()}}}, "https://giscus.app");
      }
    }).observe(document.body, {attributes: true, attributeFilter: ["data-md-color-scheme"]});
  })();
</script>
{% endif %}
