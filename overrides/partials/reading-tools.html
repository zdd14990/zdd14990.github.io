{% if page.meta.reading_date %}
<div class="zdd-reading-dates">
  <span>发布于 <time datetime="{{ page.meta.reading_date }}">{{ page.meta.reading_date }}</time></span>
  {% if page.meta.reading_updated %}<span>更新于 <time datetime="{{ page.meta.reading_updated }}">{{ page.meta.reading_updated }}</time></span>{% endif %}
  {% if page.meta.reading_words %}<span>{{ "{:,}".format(page.meta.reading_words) }} 字 · 约 {{ page.meta.reading_minutes }} 分钟</span>{% endif %}
</div>
{% endif %}
