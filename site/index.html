$-field generated by $\\mathcal{A}$ is equal to the monotone class generated by $\\mathcal{A}$.\n\n---\n\nA probability measure $\\mathbb{P}$ satisfies the following axioms:\n\n1.  $\\mathbb{P}[E] \\ge 0$ for all $E \\in \\mathcal{F}$.\n\n2. $\\mathbb{P}[\\Omega] = 1$.\n\n3. If $\\{E_j\\}$ is a countable collection of pairwise disjoint sets in $\\mathcal{F}$, then $\\mathbb{P}[\\cup_j E_j] = \\sum_j \\mathbb{P}[E_j]$.\n\n**Important Consequences**:\n\n* $\\mathbb{P}[E^c] = 1 - \\mathbb{P}[E]$.\n  \n* $\\mathbb{P}[E \\cup F] + \\mathbb{P}[E \\cap F] = \\mathbb{P}[E] + \\mathbb{P}[F]$.\n  \n* **Continuity**: If $E_n \\uparrow E$ or $E_n \\downarrow E$, then $\\mathbb{P}[E_n] \\to \\mathbb{P}[E]$.\n\n* $\\mathbb{P}[\\cup_j E_j] \\le \\sum_j \\mathbb{P}[E_j]$.\n\n**Theorem (Carathéodory's Extension Theorem)**: Let $\\mathcal{F}_0$ be a field and $\\mathcal{F} = \\sigma(\\mathcal{F}_0)$. If $\\mu$ is a probability measure on $\\mathcal{F}_0$, then there exists a unique probability measure on $\\mathcal{F}$ that extends $\\mu$.\n\n---\n\n* Let $\\mathcal{C}$ be the collection of intervals $(a,b]$ with $a<b$.\n\n* Let $\\mathcal{B}_0$ be the field generated by $\\mathcal{C}$: finite union of disjoint sets of $(a,b], (-\\infty, b], (a, \\infty)$.\n\n* Let $\\mathcal{B} = \\sigma(\\mathcal{C})$ .\n\nA function $F: \\mathbb{R} \\to [0,1]$ is a **distribution function** if it is increasing and right-continuous with $F(-\\infty) = 0$ and $F(\\infty) = 1$. \n\n**Proposition**: Each probability measure $\\mu$ on $\\mathbb{R}$ uniquely determines a distribution function $F$ via $F(x) = \\mu((-\\infty, x])$. Conversely, each distribution function $F$ ", "has_pdf": false}, {"title": "概率论part2", "url": "/blog/probability-statistics/probability-theory/part2/", "preview": "参考书：吴昊老师的讲义", "date": "2026-07-05", "words": 1195, "categories": ["概统", "概率论"], "tags": ["probability-statistics", "probability-theory"], "content": "概率论part2 --- 参考书：吴昊老师的讲义 --- Convergences The convergence of a seq  m\\right]=1.\n$$\n\n---\n\n**Definition** The sequence $\\{X_n\\}$ converges in probability to the random variable $X$ if, for every $\\varepsilon>0$,\n\n$$\n\\lim_{n\\to\\infty}\\mathbb{P}\\left[|X_n-X|>\\varepsilon\\right]=0.\n$$\n\nAlmost sure convergence implies convergence in probability. But the converse is false.\n\n---\n\n**Definition** Assume $p\\ge 1$. The sequence $\\{X_n\\}$ converges in $L^p$ to the random variable $X$ if $X_n\\in L^p$, $X\\in L^p$ and\n\n$$\n\\lim_{n\\to\\infty}\\mathbb{E}\\left[|X_n-X|^p\\right]=0.\n$$\n\n**Lemma** Assume $p>0$. If $X_n\\to X$ in $L^p$, then $X_n\\to X$ in probability.\n\n---\n\n**Lemma (L2 weak law)** Let $X_1,X_2,\\ldots$ be independent random variables with $\\mathbb{E}[X_i]=m$ and $\\operatorname{var}(X_i)\\le C<\\infty$. Set\n\n$$\nS_n=\\sum_{j=1}^n X_j.\n$$\n\nThen\n\n$$\n\\frac{S_n}{n}\\to m,\\quad \\text{in }L^2.\n$$\n\n---\n\nLet $f$ be a continuous function on $[0,1]$. Define the polynomial\n\n$$\nf_n(x)=\\sum_{j=0}^n {n\\choose j}x^j(1-x)^{n-j}f(j/n).\n$$\n\nThis is called the **Bernstein polynomial of degree $n$ associated to $f$**. Then\n\n$$\n\\sup_{x\\in[0,1]}|f_n(x)-f(x)|\\to 0,\\quad n\\to\\infty.\n$$\n\n---\n\n**Example (Coupon collecting)** Let $X_1,X_2,\\ldots$ be i.i.d. uniform on $\\{1,2,\\ldots,N\\}$. Let $T_N$ be the first time $n$ that\n\n$$\n\\#\\{X_1,\\ldots,X_n\\}=N.\n$$\n\nThen\n\n$$\n\\frac{T_N}{N\\log N}\\to 1,\\quad \\text{in }L^2.\n$$\n\n---\n\n**Definition** Let $\\{E_n\\}$ be a sequence of subsets in $\\mathcal{F}$. Define\n\n$$\n\\limsup_{n\\to\\infty}E_n=\\bigcap_{m=1}^{\\infty}\\bigcup_{n\\ge m}E_n,\\quad\n\\liminf_{n\\to\\infty}E_n=\\bigcup_{m=1}^{\\infty}\\bigcap_{n\\ge m}E_n.\n$$\n\n**Lemma** A point belongs to $\\limsup_n E_n$ if and only if it belongs to infinitely many terms of the sequence $\\{E_n,n\\ge 1\\}$.\n\nIn more intuitive language: the event $\\limsup_n E_n$ occurs if and only if the events $E_n$ occur infinitely many often, and we write\n\n$$\n\\{\\limsup_{n\\to\\infty}E_n\\}=\\{E_n,\\ i.o.\\}.\n$$\n\n---\n\n**Theorem (Borel Cantelli lemma)**\n\nFor arbitrary sequence $\\{E_n\\}$, we have\n\n$$\n\\sum_n \\mathbb{P}[E_n]<\\infty \\Longrightarrow \\mathbb{P}[E_n\\ i.o.]=0.\n$$\n\nIf the events $\\{E_n\\}$ are independent, we have\n\n$$\n\\sum_n \\mathbb{P}[E_n]=\\infty \\Longrightarrow \\mathbb{P}[E_n\\ i.o.]=1.\n$$\n\n**Corollary** Convergence in probability implies almost sure convergence along subsequence.\n\n---\n\n**Exam", "has_pdf": false}, {"title": "统计part2", "url": "/blog/probability-statistics/statistics/part2/", "preview": "参考书：Statistical Inference", "date": "2026-07-04", "words": 3015, "categories": ["概统", "统计"], "tags": ["probability-statistics", "statistics"], "content": "统计part2 --- 参考书：Statistical Inference --- Principles of Data Reduction --- A sufficient statistic for a parameter $\\theta$ is a statistic that, in a certain sense, captures all the information about $\\theta$ contained in the sample. Any additional information in the sample, besides the value of the sufficient statistic, does not contain any more information about $\\theta$. A statistic $T(\\bm X )$ is a sufficient statistic for $\\theta$ if the conditional distribution of the sample $\\bm X $ given $T(\\bm X )$ does not depend on $\\theta$. We need to show that $\\bm X $ and $\\bm Y $ have the same unconditional distribution, where $\\bm Y $ is a random vector with the same distribution as $\\bm X $, but independent of $T(\\bm X )$. That is $P \\theta(\\bm X =\\bm x ) = P \\theta(\\bm Y =\\bm x )$ for all $\\bm x $ and $\\theta$. Note that the events $\\ \\bm X =\\bm x \\ $ and $\\ \\bm Y =\\bm x \\ $ are both subsets of the event $\\ T(\\bm X )=T(\\bm x )\\ $. Also recall that $$ P \\theta(\\bm X =\\bm x T(\\bm X )=T(\\bm x ))=P \\theta(\\bm Y =\\bm x T(\\bm X )=T(\\bm x )) $$ and these conditional probabilities do not depend on $\\theta$. Therefore, we have $$ \\begin aligned P \\theta(\\bm X =\\bm x ) &= P \\theta(\\bm X =\\bm", "source": "# 统计part2\n\n---\n\n**参考书：Statistical Inference**\n\n---\n\n## Principles of Data Reduction\n\n---\n\nA **sufficient statistic** for a parameter $\\theta$ is a statistic that, in a certain sense, captures all the information about $\\theta$ contained in the sample. Any additional information in the sample, besides the value of the sufficient statistic, does not contain any more information about $\\theta$.\n\nA statistic $T(\\bm{X})$ is a **sufficient statistic for $\\theta$** if the conditional distribution of the sample $\\bm{X}$ given $T(\\bm{X})$ does not depend on $\\theta$. \n\nWe need to show that $\\bm{X}$ and $\\bm{Y}$ have the same unconditional distribution, where $\\bm{Y}$ is a random vector with the same distribution as $\\bm{X}$, but independent of $T(\\bm{X})$. That is $P_\\theta(\\bm{X}=\\bm{x}) = P_\\theta(\\bm{Y}=\\bm{x})$ for all $\\bm{x}$ and $\\theta$. Note that the events $\\{\\bm{X}=\\bm{x}\\}$ and $\\{\\bm{Y}=\\bm{x}\\}$ are both subsets of the event $\\{T(\\bm{X})=T(\\bm{x})\\}$. Also recall that\n\n$$\nP_\\theta(\\bm{X}=\\bm{x}|T(\\bm{X})=T(\\bm{x}))=P_\\theta(\\bm{Y}=\\bm{x}|T(\\bm{X})=T(\\bm{x}))\n$$\n\nand these conditional probabilities do not depend on $\\theta$. Therefore, we have\n\n$$\n\\begin{aligned}\nP_\\theta(\\bm{X}=\\bm{x}) &= P_\\theta(\\bm{X}=\\bm{x} \\text{ and } T(\\bm{X})=T(\\bm{x})) \\\\\n&= P_\\theta(\\bm{X}=\\bm{x}|T(\\bm{X})=T(\\bm{x}))P_\\theta(T(\\bm{X})=T(\\bm{x})) \\\\\n&= P_\\theta(\\bm{Y}=\\bm{x}|T(\\bm{X})=T(\\bm{x}))P_\\theta(T(\\bm{X})=T(\\bm{x})) \\\\\n&= P_\\theta(\\bm{Y}=\\bm{x} \\text{ and } T(\\bm{X})=T(\\bm{x})) \\\\\n&= P_\\theta(\\bm{Y}=\\bm{x})\n\\end{aligned}\n$$\n\nSo we must verify only that $P_\\theta(\\bm{X}=\\bm{x}|T(\\bm{X})=T(\\bm{x}))$ does not depend on $\\theta$.\n\n$$\n\\begin{aligned}\nP_\\theta(\\bm{X}=\\bm{x}|T(\\bm{X})=T(\\bm{x})) &= \\frac{P_\\theta(\\bm{X}=\\bm{x}) \\text{ and } T(\\bm{X})=T(\\bm{x}))}{P_\\theta(T(\\bm{X})=T(\\bm{x})) }\\\\\n&= \\frac{P_\\theta(\\bm{X}=\\bm{x})}{P_\\theta(T(\\bm{X})=T(\\bm{x})) }\\\\\n&= \\frac{p(\\bm{x}|\\theta)}{q(T(\\bm{x})|\\theta)}\n\\end{aligned}\n$$\n\nwhere $p(\\bm{x}|\\theta)$ is the joint pmf of the sample $\\bm{X}$ and $q(t|\\theta)$ is the pmf of $T(\\bm{X})$. \n\n**Theorem 6.2.2** If $p(\\bm{x}|\\theta)$ is the joint pdf or pmf of $\\bm{X}$, and  $q(t|\\theta)$  is the pdf or pmf of $T(\\bm{X})$, then $T(\\bm{X})$ is a sufficient statistic for $\\theta$ if, for every $\\bm{x}$ in the sample space, the ratio $p(\\bm{x}|\\theta)/q(T(\\bm{x})|\\theta)$ is constant as a function of $\\theta$.\n\n**Factorization Theorem** Let $f(\\bm{x}|\\theta)$ denote the joint pdf or pmf of a sample $\\bm{X}$. A statistic $T(\\bm{X})$ is a sufficient statistic for $\\theta$ if and only if there exist functions $g(t|\\theta)$ and $h(\\bm{x})$ such that, for all sample points $\\bm{x}$ and all parameter values $\\theta$,\n\n$$\nf(\\bm{x}|\\theta) = g(T(\\bm{x})|\\theta)h(\\bm{x})\n$$\n\n**Theorem 6.2.10** Let $X_1, X_2, \\cdots, X_n$ be iid observations from a pdf or pmf $f(x|\\theta)$ that belongs to an exponential family given by\n\n$$\nf(x|\\theta)=h(x)c(\\theta)\\exp\\left\\{\\sum_{i=1}^k w_i(\\theta)t_i(x)\\right\\}\n$$\n\nwhere $\\bm{\\theta}=(\\theta_1, \\cdot", "has_pdf": false}, {"title": "统计part1", "url": "/blog/probability-statistics/statistics/part1/", "preview": "参考书：Statistical Inference", "date": "2026-07-01", "words": 3789, "categories": ["概统", "统计"], "tags": ["probability-statistics", "statistics"], "content": "统计part1 --- 参考书：Statistical Inference --- Probability Theory --- 样本空间(sample space) The set $S$ of all possible outcomes of a particular experiment is called the sample space. 事件(event) An event is any collection of possible outcomes of an experiment, that is, any subset of $S$ (including $S$ itself). σ-代数(sigma algebra) A collection of subsets of $S$ is called a sigma algebra (or Borel field), denoted by $\\mathcal B $, if it satisfies the following three properties: 1. $\\emptyset \\in \\ma |a_m-a_n|<\\varepsilon\n$$\n\n则称 $\\{a_n\\}$ 为 Cauchy 列。\n\n**Cauchy 准则** 数列 $\\{a_n\\}$ 收敛当且仅当 $\\{a_n\\}$ 为 Cauchy 列。\n\n---\n\n**区间套** 设 $\\{I_n\\}$ 为一列区间，如果 $I_1\\supset I_2\\supset I_3\\supset \\cdots$，则称 $\\{I_n\\}$ 为区间套，当 $\\{I_n\\}$ 均为闭区间时，称为闭区间套。\n\n**闭区间套定理(Cantor)** 设 $\\{[a_n,b_n]\\}$ 为闭区间套，如果 $\\lim_{n\\to\\infty}(b_n-a_n)=0$，则这些区间有一个唯一的公共点。\n\n---\n\n**开集** 设 $U\\subset \\mathbb{R}$，如果对任意 $x\\in U$，存在 $\\varepsilon=\\varepsilon(x)>0$，使得 $(x-\\varepsilon,x+\\varepsilon)\\subset U$，则称 $U$ 为 $\\mathbb{R}$ 中的开集。\n\n**闭集** 如果一个集合在 $\\mathbb{R}$ 中的补集是开集，则称该集合为 $\\mathbb{R}$ 中的闭集。\n\n**Heine-Borel** 设 $\\left\\{U_\\alpha\\right\\}_{\\alpha \\in \\Gamma}$ 为 $\\mathbb{R}$ 中的开集族，如果 $[a,b]\\subset \\bigcup_{\\alpha \\in \\Gamma} U_\\alpha$，则存在有限子集 $\\left\\{U_{\\alpha_1}, U_{\\alpha_2}, \\ldots, U_{\\alpha_n}\\right\\}$ 使得 $[a,b]\\subset \\bigcup_{i=1}^{n} U_{\\alpha_i}$。\n\n**Bolzano** 有界数列必有收敛子列。\n\n---\n\n**Heine** 设函数 $f$ 在 $x_0$ 的一个空心开邻域内有定义，则 $f$ 在 $x_0$ 处的极限为 $\\alpha$ 当且仅当对空心开邻域中任何收敛于 $x_0$ 的数列 $\\{x_n\\}$，都有 $\\lim_{n\\to\\infty}f(x_n)=\\alpha$。\n\n**Cauchy** 设 $f$ 在 $x_0$ 的空心开邻域中有定义，则 $f$ 在 $x_0$ 处有极限当且仅当任给 $\\varepsilon>0$，存在 $\\delta>0$，使得当 $x,y\\in V(x_0,\\delta)$ 时，有 $|f(x)-f(y)|<\\varepsilon$。\n\n---\n\n**振幅** 设 $f$ 为区间 $I$ 中的有界函数，记\n\n$$\n\\omega(f;I)=\\sup\\left\\{|f(x)-f(y)| \\Big| x,y\\in I\\right\\} \n$$\n\n称为 $f$ 在 $I$ 中的振幅。设 $x_0\\in I$，当 $n$ 为正整数时，记\n\n$$\n\\omega_n(f;x_0)=\\omega\\left(f,\\left(x_0-\\frac{1}{n},x_0+\\frac{1}{n}\\right)\\cap I\\right)\n$$\n\n显然，数列 $\\left\\{\\omega_n(f;x_0)\\right\\}$ 单调递减且有界，其极限记为 $\\omega(f;x_0)$，称为 $f$ 在 $x_0$ 处的振幅。\n\n---\n\n**最值定理** 设 $f\\in C^0[a,b]$，则 $f$ 在 $[a,b]$ 中必定取到最大值和最小值，即存在 $x_*,x^*\\in[a,b]$，使得\n\n$$\nf(x_*)\\le f(x)\\le f(x^*),\\quad \\forall x\\in[a,b]\n$$\n\n**零值定理** 设 $f\\in C^0[a,b]$，如果 $f(a)f(b)\\le 0$，则存在 $\\xi \\in [a,b]$，使得 $f(\\xi)=0$。\n\n**介值定理** 设 $f\\in C^0[a,b]$，如果 $f(a)<\\mu  <f(b)$，则存在 $\\xi \\in (a,b)$，使得 $f(\\xi)=\\mu$。\n\n---\n\n**Cantor** 闭区间中的连续函数是一致连续的。\n\n---\n\n**积分中值 浊辅音前要浊化（в 除外）。 软硬辅音 硬辅音 ： а , о , у , э , ы , ъ 前的辅音是硬辅音。 软辅音 ： я , ё , ю , е , и , ь 前的辅音是软辅音。 永远发硬辅音 ： ц , ш , ж 后面无论跟什么字母，它们永远发硬辅音。 特殊拼写与发音规则 ц, ш, ж 与 ё, е 拼写时 ： 1. ц , ш , ж + ё 时，读作 о ，如 жё о лтый , пошё о л （自带重音！）。 2. ц , ш , ж + е 时： 如果重音在 е 上，则 е 读作 э ，如 це э х 。 如果重音不在 е 上，读音介于 ы 和 э 之间，如 цена , жена , тоже 。 ц, ш, ж 与 и 拼写时 ： и 读作 ы ，如 ци ы рк , ужи ы н （书面上不与 ы 相拼写，即没有 шы, жы）。 г, к, х 的拼写限制 ：不能和 ы 相拼（即没有 гы, кы, хы）。 --- 名词的性与数 --- 动物名词 и 非动物名词 名词 主要分为以下两类： 动物名词 ：表示 人 和 动物 的名词。比如：па́па 爸爸, ма́ма 妈妈, поэ́т 诗人, Анто́н 安东, Анна 安娜, кот 猫, у́тка 鸭子, соба́ка 狗. 非动物名词 ：表示 除人和动物以外 其它各种事物的名称。比如：окно́ 窗户, ко́мната 房间, сок 果汁。需要特别注意的是， 植物 是非动物名词，比如：тома́т 番茄, де́рево 树, цветы́ 花. --- 疑问代词提问规则 ： Кто? （疑问代词 谁？）—— 提问 动物名词 Что? （疑问代词 什么？）—— 提问 非动物名词 --- 名词的性 性 结尾 例词 :--- :--- :--- 阳性 он 硬辅音 + ч, щ дом, го́род, Анто́н -й (-ий) Кита́й, музе́й, санато́рий -ь слова́рь, гость 阴性 она -а ко́мната, кни́га, де́вушка -я (-ия) ку́хня, тётя, аудито́рия -ь тет", "source": "# 俄语1\n\n---\n\n## 字母表与发音\n\n---\n\n| | | | | | | |\n| :---: | :---: | :---: | :---: | :---: | :---: | :---: |\n| Аа | Бб | Вв | Гг | Дд | Ее | Ёё |\n| Жж | Зз | Ии | Йй | Кк | Лл | Мм |\n| Нн | Оо | Пп | Рр | Сс | Тт | Уу |\n| Фф | Хх | Цц | Чч | Шш | Щщ | ъ |\n| ы | ь | Ээ | Юю | Яя | | |\n\n#### 清浊辅音\n* **浊辅音**：б, в, д, з, г, ж\n* **清辅音**：п, ф, т, с, к, ш\n* **清化规则**：浊辅音位于词末和清辅音前要清化。\n* **浊化规则**：清辅音在浊辅音前要浊化（в 除外）。\n\n#### 软硬辅音\n* **硬辅音**：`а`, `о`, `у`, `э`, `ы`, `ъ` 前的辅音是硬辅音。\n* **软辅音**：`я`, `ё`, `ю`, `е`, `и`, `ь` 前的辅音是软辅音。\n* **永远发硬辅音**：`ц`, `ш`, `ж` 后面无论跟什么字母，它们永远发硬辅音。\n\n#### 特殊拼写与发音规则\n* **ц, ш, ж 与 ё, е 拼写时**：\n  1. `ц`, `ш`, `ж` + `ё` 时，读作 `[о]`，如 **жё[о]лтый**, **пошё[о]л**（自带重音！）。\n  2. `ц`, `ш`, `ж` + `е` 时：\n     * 如果重音在 `е` 上，则 `е` 读作 `[э]`，如 **це[э]х**。\n     * 如果重音不在 `е` 上，读音介于 `[ы]` 和 `[э]` 之间，如 **цена**, **жена**, **тоже**。\n* **ц, ш, ж 与 и 拼写时**：`и` 读作 `[ы]`，如 **ци[ы]рк**, **ужи[ы]н**（书面上不与 `ы` 相拼写，即没有 шы, жы）。\n* **г, к, х 的拼写限制**：不能和 `ы` 相拼（即没有 гы, кы, хы）。\n\n---\n\n## 名词的性与数\n\n---\n\n### 动物名词 и 非动物名词\n\n**名词**主要分为以下两类：\n\n*   **动物名词**：表示**人**和**动物**的名词。比如：па́па 爸爸, ма́ма 妈妈, поэ́т 诗人, Анто́н 安东, Анна 安娜, кот 猫, у́тка 鸭子, соба́ка 狗.\n*   **非动物名词**：表示**除人和动物以外**其它各种事物的名称。比如：окно́ 窗户, ко́мната 房间, сок 果汁。需要特别注意的是，**植物**是非动物名词，比如：тома́т 番茄, де́рево 树, цветы́ 花.\n\n---\n\n**疑问代词提问规则**：\n\n*    **Кто?** （疑问代词 谁？）—— 提问**动物名词**\n*    **Что?** （疑问代词 什么？）—— 提问**非动物名词**\n\n---\n\n### 名词的性\n\n| 性 | 结尾 | 例词 |\n| :--- | :--- | :--- |\n| **阳性 он** | 硬辅音 + ч, щ | дом, го́род, Анто́н |\n| | -й (-ий) | Кита́й, музе́й, санато́рий |\n| | -ь | слова́рь, гость |\n| **阴性 она** | -а | ко́мната, кни́га, де́вушка |\n| | -я (-ия) | ку́хня, тётя, аудито́рия |\n| | -ь | тетра́дь, ночь |\n| **中性 оно** | -о | окно́, молоко́, сло́во |\n| | -е (-ие) (-ё) | мо́ре, общежи́тие, бельё |\n| | -мя | и́мя, вре́мя |\n\n---\n\n **Внимание!**\n\n 1. 表示人的名词或人名，按自然属性判断。（阳性：па́па, Воло́дя，阴性：ма́ма, Анна）\n   \n 2. 以 **-ь** 结尾的名词需要查字典确定是阳性还是阴性。\n\n---\n\n**阳性 (он)**\n\n*   **слова́рь**（字典）\n\n*   **гость**（客人）\n\n*   **рубль**（卢布）\n\n**阴性 (она)**\n\n*   **тетра́дь**（笔记本 / 练习本）\n\n*   **ночь**（夜晚）\n\n*   **о́бувь**（鞋子）\n\n**不变形的外来词（单复数同形，各格不变）：**\n\n*   **фо́то**（照片，中性）\n\n*   **кaфе**（咖啡馆，中性）\n\n*   **ра́дио**（广播，中性）\n\n*   **кино́**（电影院 / 电影，中性）\n\n*   **метро́**（地铁，中性）\n\n*   **чac** （钟表 / 小时，阳性）\n\n**无复数形式的名词：**\n\n*   **пи́во**（啤酒，中性）\n\n---\n\n\n### 名词单复数变化规则\n\n| 性 | 单数 | 复数 | 变化规则 |\n| :--- | :--- | :--- | :--- |\n| **阳性<br>он** | тома́т | тома́ты | 硬辅音 + -ы |\n| | музе́й | музе́и | -й 变 -и |\n| | санато́рий | санато́рии | -ий 变 -ии |\n| | слова́рь | словари́ | -ь 变 -и |\n| **阴性<br>она** | ко́мната | ко́мнаты | -а 变 -ы |\n| | ку́хня | ку́хни | -я 变 -и |\n| | аудито́рия | аудито́рии | -ия 变 -ии |\n| | тетра́дь | тетра́ди | -ь 变 -и |\n| **中性<br>оно** | окно́ | о́кна | -о 变 -а |\n| | по́ле | поля́ | -е 变 -я |\n| | общежи́тие | общежи́тия | -ие 变 -ия |\n| | вре́мя | времена́ | -мя 变 -мена |\n\n**某些名词变复数时重音有移动现象：**\n\n* суп - супы́\n\n* кот - коты́\n\n* мост - мосты́\n\n* окно́ - о́кна\n\n* 名字 и́мя - имена́\n\n**名词构成复数形式时，辅音 г, к, х, ж, ш, ч, щ 后面加 -и**\n\n| 性 | 单数 - 复数示例 |\n| :--- | :--- |\n| **阳性** | пиро́г - пир", "has_pdf": false}, {"title": "周期积分方程", "url": "/blog/applied-math/paper-notes/periodic-integral-equations/", "preview": "Consider heat/electrical problem. A single inclusion  \\(\\Omega\\)  per unit cell.  \\(e_1\\)  and  \\(e_2\\)  are the basis of the lattice on  \\(\\mathbb{R}^2\\)  . We working with unit square  \\(e_1 = (1,0)\\)  and  \\(e_2 = (0,1)\\)  for simplicity. Let", "date": "2026-06-01", "words": 651, "categories": ["应用数学", "论文笔记"], "tags": ["applied-math", "paper-notes", "periodic-integral-equations"], "content": "A Unified Integral Equation Scheme for Doubly Periodic Laplace and Stokes Boundary Value Problems in Two Dimensions --- Neumann-Laplace Case --- Consider heat/electrical problem. A single inclusion $\\Omega$ per unit cell. $e 1$ and $e 2$ are the basis of the lattice on $\\mathbb R ^2$. We working with unit square $e 1 = (1,0)$ and $e 2 = (0,1)$ for simplicity. Let $$ \\Omega \\Lambda :=\\left\\ x\\in \\mathbb R ^2: x+m 1 e 1 + m 2 e 2 \\in \\Omega for some m 1, m 2 \\in \\mathbb Z \\right\\ $$ The scalar $u$ satisfies the following BVP: $$ \\begin aligned \\Delta u =0\\quad &\\text in \\mathbb R ^2 \\backslash \\overline \\Omega \\Lambda , \\\\ u n =0 \\quad &\\text on \\partial \\Omega \\Lambda, \\\\ u\\left(x+e 1 \\right) -u(x)=p 1 \\quad &\\text for all x \\in \\mathbb R ^2 \\backslash \\overline \\Omega \\Lambda , \\\\ u(x+e 2 ) -u(x)=p 2 \\quad &\\text for all x \\in \\mathbb R ^2 \\backslash \\overline \\Omega \\Lambda . \\end aligned $$ i.e. $u$ is harmonic, has zero flux on the boundary of the inclusion, and is periodic up to a given pair of constants $p=(p 1, p 2)$. Here $u n=\\frac \\partial u \\partial n =n\\cdot \\nabla u$, where $n$ is the unit normal on the relevant evaluation curve. --- For each $(p 1, p 2)$ the solution t", "source": "# A Unified Integral Equation Scheme for Doubly Periodic Laplace and Stokes Boundary Value Problems in Two Dimensions\n\n---\n\n## Neumann-Laplace Case\n\n---\n\nConsider heat/electrical problem. A single inclusion $\\Omega$ per unit cell. $e_1$ and $e_2$ are the basis of the lattice on $\\mathbb{R}^2$. We working with unit square $e_1 = (1,0)$ and $e_2 = (0,1)$ for simplicity. Let \n\n$$\n\\Omega_\\Lambda :=\\left\\{x\\in \\mathbb{R}^2: x+m_1 e_1 + m_2 e_2 \\in \\Omega for some m_1, m_2 \\in \\mathbb{Z}\\right\\}\n$$\n\nThe scalar $u$ satisfies the following BVP:\n\n$$\n\\begin{aligned}\n\\Delta u  =0\\quad &\\text{ in } \\mathbb{R}^2 \\backslash \\overline{\\Omega_\\Lambda}, \\\\\nu_n  =0 \\quad &\\text{ on } \\partial \\Omega_\\Lambda, \\\\\nu\\left(x+e_{1}\\right) -u(x)=p_1 \\quad &\\text{for all }x \\in \\mathbb{R}^2 \\backslash \\overline{\\Omega_\\Lambda}, \\\\\nu(x+e_{2}) -u(x)=p_2 \\quad &\\text{for all }x \\in \\mathbb{R}^2 \\backslash \\overline{\\Omega_\\Lambda}.\n\\end{aligned}\n$$\n\ni.e. $u$ is harmonic, has zero flux on the boundary of the inclusion, and is periodic up to a given pair of constants $p=(p_1, p_2)$. Here $u_n=\\frac{\\partial u}{\\partial n}=n\\cdot \\nabla u$, where $n$ is the unit normal on the relevant evaluation curve.\n\n---\n\n!!! prop \"2.1\"\n    For each $(p_1, p_2)$ the solution to the above BVP is unique up to an additive constant.\n\n!!! proof \"proof\"\n    Let $\\mathcal{B}$ be any unit cell containing $\\Omega$. Use Green's first identity to get\n\n    $$\n    0=\\int_{\\mathcal{B} \\backslash \\overline{\\Omega}} u \\Delta u =\\int_{\\partial \\mathcal{B}} u u_{n}-\\int_{\\partial \\Omega} u u_{n} -\\int_{\\mathcal{B} \\backslash \\overline{\\Omega}}|\\nabla u|^{2} \n    $$\n\n    The first two integrals vanish by the boundary conditions, so $\\nabla u=0$ in $\\mathcal{B} \\backslash \\overline{\\Omega}$, and thus $u$ is constant.\n\n---\n\nTo solve the BVP, we re-express it on single unit cell $\\mathcal{B}$ with coupled boundary values on the four walls comprising its boundary $\\partial \\mathcal{B}:=L\\cup R\\cup D\\cup U$. Use notation $u_L$ to mean the restriction of $u$ to $L$, and so on, and $u_{nL}$ for its normal derivative using the normal on $L$. Consider the following BVP:\n\n$$\n\\begin{aligned}\n\\Delta u  =0 \\quad &\\text{ in } \\mathcal{B} \\backslash \\overline{\\Omega}, \\\\\nu_n  =0 \\quad &\\text{ on } \\partial \\Omega, \\\\\nu_R-u_L=p_1,\\\\\nu_{nR}-u_{nL}=0,\\\\\nu_U-u_D=p_2,\\\\\nu_{nU}-u_{nD}=0.\n\\end{aligned}\n$$\n\nClearly the two BVPs are equivalent. We define **discrepancy** of a solution $u$ as the stack of the four functions on the left-hand side of last four equations.  \n\n---\n\n### The Empty Unit Cell Discrepancy BVP and Its Numerical Solution\n\n---\n\nA subproblem called \"empty unit cell BVP\". We seek a harmonic function $v$ matching a given discrepancy $g=[g_1; g_2; g_3; g_4]$(i.e. the right-hand side of the last four equations above), That is:\n\n$$\n\\begin{aligned}\n\\Delta v  =0 \\quad &\\text{ in } \\mathcal{B}, \\\\\nv_R-v_L=g_1,\\\\\nv_{nR}-v_{nL}=g_2,\\\\\nv_U-v_D=g_3,\\\\\nv_{nU}-v_{nD}=g_4.\n\\end{aligned}\n$$\n\n!!! prop \"2.2\"\n    A solution $v$ exist ", "has_pdf": false}, {"title": "量子力学", "url": "/blog/physics/quantum-mechanics/", "preview": "一个复向量空间  \\(V\\)  称为 内积空间 ，如果其上定义了一个映射  \\(\\langle \\cdot, \\cdot \\rangle : V \\times V \\rightarrow \\mathbb{C}\\)  ，满足：", "date": "2026-05-10", "words": 4602, "categories": ["物理"], "tags": ["physics", "quantum-mechanics"], "content": "量子力学 --- 一个复向量空间 $V$ 称为 内积空间 ，如果其上定义了一个映射 $\\langle \\cdot, \\cdot \\rangle : V \\times V \\rightarrow \\mathbb C $，满足： 正定性 ：$\\langle v, v \\rangle \\ge 0$，且 $\\langle v, v \\rangle = 0 \\iff v = 0$ 共轭对称性 ：$\\langle u, v \\rangle = \\langle v, u \\rangle^ $ 对第二变元的线性 ：$\\langle u, \\alpha v + \\beta w \\rangle = \\alpha\\langle u, v \\rangle + \\beta\\langle u, w \\rangle$ 推论（反线性） ：对第一变元满足反线性（Sesquilinear Property），即 $\\langle \\alpha u + \\beta v, w \\rangle = \\alpha^ \\langle u, w \\rangle + \\beta^ \\langle v, w \\rangle$。 --- 内积自然诱导了一个 范数 $ v = \\sqrt \\langle v, v \\rangle $，进而诱导了 距离度量 $d(u, v) = u - v $。物理上，归一化条件即要求状态向量满足 $ v = 1$。 海森堡不确定关系 ：对于算符 $A$ 和 $B$，定义它们的对易子为 $ A, B = AB - BA$。我们有 $$ \\Delta \\psi A \\cdot \\Delta \\psi B \\ge \\frac 1 2 \\langle \\psi A, B \\psi \\rangle $$ 这里 $\\Delta \\psi A = \\sqrt \\langle A^2 \\rangle - \\langle A \\rangle^2 $ 是算符 $A$ 在状态 $\\psi$ 下的标准差。 --- 一个内积空间被称为 希尔伯特空间 $\\mathcal H $，如果它在其内积诱导的范数度量下是 完备的 (Complete) 。 --- 右矢 (Ket) $ \\psi \\rangle$ ：代表希尔伯特空间 $\\mathcal H $ 中的一个态向量。 左矢 (Bra) $\\langle \\phi $ ：代表连续对偶空间 $\\mathcal H '$ 中的一个线性泛函。 根据 Riesz 表示定理，在希尔伯特空间中，每一个连续线性泛函都唯一对应 $\\mathcal H $ 中的一个向量。内积 $\\langle \\phi \\psi \\rangle$ 即可视为左矢泛函作用在右矢向量上产生的一个复数（物理上代表概率幅）。 --- 有界算符 (Bounded Operator) ：如果存在常数 $M ", "source": "# 量子力学\n\n---\n\n一个复向量空间 $V$ 称为**内积空间**，如果其上定义了一个映射 $\\langle \\cdot, \\cdot \\rangle : V \\times V \\rightarrow \\mathbb{C}$，满足：\n\n* **正定性**：$\\langle v, v \\rangle \\ge 0$，且 $\\langle v, v \\rangle = 0 \\iff v = 0$\n  \n* **共轭对称性**：$\\langle u, v \\rangle = \\langle v, u \\rangle^*$\n  \n* **对第二变元的线性**：$\\langle u, \\alpha v + \\beta w \\rangle = \\alpha\\langle u, v \\rangle + \\beta\\langle u, w \\rangle$\n  \n* **推论（反线性）**：对第一变元满足反线性（Sesquilinear Property），即 $\\langle \\alpha u + \\beta v, w \\rangle = \\alpha^*\\langle u, w \\rangle + \\beta^*\\langle v, w \\rangle$。\n\n---\n\n内积自然诱导了一个**范数** $||v|| = \\sqrt{\\langle v, v \\rangle}$，进而诱导了**距离度量** $d(u, v) = ||u - v||$。物理上，归一化条件即要求状态向量满足 $||v|| = 1$。\n\n\n**海森堡不确定关系**：对于算符 $A$ 和 $B$，定义它们的对易子为 $[A, B] = AB - BA$。我们有\n\n$$\n\\Delta_\\psi A \\cdot \\Delta_\\psi B \\ge \\frac{1}{2} |\\langle \\psi| [A, B]|\\psi \\rangle|\n$$\n\n这里 $\\Delta_\\psi A = \\sqrt{\\langle A^2 \\rangle - \\langle A \\rangle^2}$ 是算符 $A$ 在状态 $\\psi$ 下的标准差。\n\n---\n\n一个内积空间被称为 **希尔伯特空间** $\\mathcal{H}$，如果它在其内积诱导的范数度量下是**完备的 (Complete)**。\n\n---\n\n* **右矢 (Ket) $| \\psi \\rangle$**：代表希尔伯特空间 $\\mathcal{H}$ 中的一个态向量。\n\n* **左矢 (Bra) $\\langle \\phi |$**：代表连续对偶空间 $\\mathcal{H}'$ 中的一个线性泛函。\n\n根据 Riesz 表示定理，在希尔伯特空间中，每一个连续线性泛函都唯一对应 $\\mathcal{H}$ 中的一个向量。内积 $\\langle \\phi | \\psi \\rangle$ 即可视为左矢泛函作用在右矢向量上产生的一个复数（物理上代表概率幅）。\n\n---\n\n* **有界算符 (Bounded Operator)**：如果存在常数 $M > 0$，使得对所有 $x \\in \\mathcal{H}$ 都有 $||Ax|| \\le M||x||$，则算符 $A$ 是有界的。这里 \n\n$$\n||A|| = \\sup_{||x||=1} ||Ax||\n$$\n  \n* **无界算符 (Unbounded Operator)** ：若不存在这样的 $M$，即 $\\sup_{||x||=1} ||Ax|| = \\infty$，则算符无界。\n\n物理现实：量子力学中最重要的算符（位置 $\\hat{X}$ 和动量 $\\hat{P}$）都是无界算符。\n\n* **Hellinger-Toeplitz 定理**：如果一个对称算符 $A$ 的定义域是整个希尔伯特空间 $\\mathcal{H}$，那么 $A$ 必然是有界算符。\n\n由这个定理我们知道既然位置和动量是无界算符，它们绝对不可能在整个 $\\mathcal{H}$ 上被定义。它们只能在 $\\mathcal{H}$ 的一个稠密子空间 $\\mathcal{D}(A)$ 上起作用。\n\n* **稠密定义 (Densely Defined)**：如果算符 $A$ 的定义域 $\\mathcal{D}(A)$ 在 $\\mathcal{H}$ 中是稠密的，即 $\\overline{\\mathcal{D}(A)} = \\mathcal{H}$，则称 $A$ 是稠密定义的。\n\n* $A$ 的伴随 $A^\\dagger$ 是良定义的当且仅当 $A$ 是稠密定义的。其具体定义为\n\n$$\n\\mathcal{D}(A^\\dagger) = \\{\\phi \\in \\mathcal{H} : \\exists \\eta \\in \\mathcal{H}, \\forall \\psi \\in \\mathcal{D}(A), \\langle A\\psi, \\phi \\rangle = \\langle \\psi, \\eta \\rangle\\}\n$$\n\n---\n\n对于稠密定义的线性算符 $A : \\mathcal{D}(A) \\subset \\mathcal{H} \\rightarrow \\mathcal{H}$：\n\n* **对称 (Symmetric / Hermitian)**：若对于所有 $\\phi, \\psi \\in \\mathcal{D}(A)$，有 $\\langle \\phi, A\\psi \\rangle = \\langle A\\phi, \\psi \\rangle$。\n\n* **伴随算符 (Adjoint) $A^\\dagger$**：其定义域 $\\mathcal{D}(A^\\dagger)$ 包含所有使得泛函 $\\psi \\mapsto \\langle \\phi, A\\psi \\rangle$ 连续的 $\\phi$。\n  \n* **自伴随 (Self-Adjoint)**：若 $A$ 是对称的，并且其定义域与伴随算符的定义域完全相等，即 $\\mathcal{D}(A) = \\mathcal{D}(A^\\dagger)$。物理意义：只有严格的自伴随算符，才能代表物理上的可观测量，并保证时间演化的概率守恒（幺正性）。\n\n---\n\n**幺正算符 (Unitary Operator)**：如果 $U$ 是一个线性算符，满足 $U^\\dagger U = UU^\\dagger = I$，则称 $U$ 是幺正的。幺正算符代表量子系统的对称变换（如时间演化、空间平移、旋转等），它们保持内积不变，即 $\\langle U\\phi, U\\psi \\rangle = \\langle \\phi, \\psi \\rangle$。\n\n---\n\n**算符的图**：设 $A: \\mathcal{D}(A) \\subset \\mathcal{H} \\rightarrow \\mathcal{H}$ 为线性算符。其图 $G(A)$ 定义为直和空间 $\\mathcal{H} \\oplus \\mathcal{H}$ 中的集合：\n\n$$\nG(A) := \\{ (x, Ax) \\in \\mathcal{H} \\oplu", "has_pdf": false}, {"title": "电动力学期中cheatsheet", "url": "/blog/physics/electrodynamics/midterm-cheatsheet/", "preview": "暂无预览", "date": "2026-04-01", "words": 13, "categories": ["物理", "电动力学"], "tags": ["electrodynamics", "physics"], "content": "<div style=\"height: 800px; width: 100%;\" <embed src=\"../../../assets/electrodynamics-midterm-cheatsheet.pdf\" type=\"application/pdf\" width=\"100%\" height=\"100%\" </div 点击下载 PDF 完整版 .md-button", "source": "<div style=\"height: 800px; width: 100%;\">\n    <embed src=\"../../../assets/electrodynamics-midterm-cheatsheet.pdf\" type=\"application/pdf\" width=\"100%\" height=\"100%\">\n</div>\n\n[点击下载 PDF 完整版](../../../assets/electrodynamics-midterm-cheatsheet.pdf){ .md-button }", "has_pdf": true}, {"title": "Deep Learning Crash Course", "url": "/blog/applied-math/ai-exam/deep-learning-crash-course/", "preview": "Transformer 的本质是摒弃了 RNN 的时序递归，用极其暴力的全局矩阵乘法来实现特征交互。 假设输入序列为  \\(X \\in \\mathbb{R}^{n \\times d}\\)  （  \\(n\\)  是序列长度，  \\(d\\)  是词向量维度）。首先，输入  \\(X\\)  会乘上三个不同的权重矩阵  \\(W^Q, W^K \\in \\mathbb{R}^{d \\times d_k}\\)  和  \\(W^V \\in \\mathbb{R}^{d \\times d_v}\\)  ，将特征映射到不同的子空间：", "date": "2026-02-21", "words": 4378, "categories": ["应用数学", "AI 博资考"], "tags": ["ai-exam", "applied-math", "deep-learning-crash-course"], "content": "深度学习速通 --- Transformer 与注意力机制 --- Transformer 的本质是摒弃了 RNN 的时序递归，用极其暴力的全局矩阵乘法来实现特征交互。 假设输入序列为 $X \\in \\mathbb R ^ n \\times d $（$n$ 是序列长度，$d$ 是词向量维度）。首先，输入 $X$ 会乘上三个不同的权重矩阵 $W^Q, W^K \\in \\mathbb R ^ d \\times d k $ 和 $W^V \\in \\mathbb R ^ d \\times d v $，将特征映射到不同的子空间： $$ Q = XW^Q, \\quad K = XW^K, \\quad V = XW^V $$ 定义注意力权重矩阵 Attention： $$ \\text Attention (Q, K, V) = \\text softmax \\left(\\frac QK^T \\sqrt d k \\right)V $$ 这里 softmax 是一个行归一化函数，确保每行的权重和为 1。通过这个机制，Transformer 能够捕捉输入序列中任意位置之间的依赖关系，而不受距离限制。 --- 如果只用一组 $Q,K,V$，模型只能学到一种特征交互模式。为了增加表达能力，我们将特征维度切分成 $h$ 个“头 (heads)”。 $$ \\text head i = \\text Attention (QW i^Q, KW i^K, VW i^V) $$ $$ \\text MultiHead (Q, K, V) = \\text Concat (\\text head 1, \\dots, \\text head h)W^O $$ 这里 Concat 是将多个头的输出拼接起来，$W^O \\in \\mathbb R ^ h d v \\times d $ 是最后的输出投影矩阵。多头注意力机制允许模型在不同的子空间中学习不同的特征交互模式，从而提升了模型的表达能力。 --- 一个重点是 Transformer 和 RNN/CNN 的复杂度对比。计算 $QK^T$ 的复杂度：$Q \\in \\mathbb R ^ n \\times d k $，$K^T \\in \\mathbb R ^ d k \\times n $。矩阵乘法的时间复杂度为 $\\mathcal O (n^2 d k)$。随着序列长度 $n$ 的增加，自注意力的时间和空间复杂度都是 $\\mathcal O (n^2)$。 --- 位置编码 ：自注意力公式本质上是一个集合运算 (Set Operation)。如果你把输入序列 $X$ 的两行打乱，输出的结果也会跟着对应打乱，但内容完全不变。它完全不知道词的先后顺序！必须在输入 $X$ 传入网络之前，硬生生地把位置信息加进去：$X \\text input = X \\text embe", "source": "## 深度学习速通\n\n---\n\n### Transformer 与注意力机制\n\n---\n\nTransformer 的本质是摒弃了 RNN 的时序递归，用极其暴力的全局矩阵乘法来实现特征交互。\n假设输入序列为 $X \\in \\mathbb{R}^{n \\times d}$（$n$ 是序列长度，$d$ 是词向量维度）。首先，输入 $X$ 会乘上三个不同的权重矩阵 $W^Q, W^K \\in \\mathbb{R}^{d \\times d_k}$ 和 $W^V \\in \\mathbb{R}^{d \\times d_v}$，将特征映射到不同的子空间：\n\n$$\nQ = XW^Q, \\quad K = XW^K, \\quad V = XW^V\n$$\n\n定义注意力权重矩阵 Attention：\n\n$$\n\\text{Attention}(Q, K, V) = \\text{softmax}\\left(\\frac{QK^T}{\\sqrt{d_k}}\\right)V\n$$\n\n这里 softmax 是一个行归一化函数，确保每行的权重和为 1。通过这个机制，Transformer 能够捕捉输入序列中任意位置之间的依赖关系，而不受距离限制。\n\n---\n\n如果只用一组 $Q,K,V$，模型只能学到一种特征交互模式。为了增加表达能力，我们将特征维度切分成 $h$ 个“头 (heads)”。\n\n$$\n\\text{head}_i = \\text{Attention}(QW_i^Q, KW_i^K, VW_i^V)\n$$\n\n$$\n\\text{MultiHead}(Q, K, V) = \\text{Concat}(\\text{head}_1, \\dots, \\text{head}_h)W^O\n$$\n\n这里 Concat 是将多个头的输出拼接起来，$W^O \\in \\mathbb{R}^{h d_v \\times d}$ 是最后的输出投影矩阵。多头注意力机制允许模型在不同的子空间中学习不同的特征交互模式，从而提升了模型的表达能力。\n\n---\n\n一个重点是 Transformer 和 RNN/CNN 的复杂度对比。计算 $QK^T$ 的复杂度：$Q \\in \\mathbb{R}^{n \\times d_k}$，$K^T \\in \\mathbb{R}^{d_k \\times n}$。矩阵乘法的时间复杂度为 $\\mathcal{O}(n^2 d_k)$。随着序列长度 $n$ 的增加，自注意力的时间和空间复杂度都是 $\\mathcal{O}(n^2)$。\n\n---\n\n**位置编码**：自注意力公式本质上是一个集合运算 (Set Operation)。如果你把输入序列 $X$ 的两行打乱，输出的结果也会跟着对应打乱，但内容完全不变。它完全不知道词的先后顺序！必须在输入 $X$ 传入网络之前，硬生生地把位置信息加进去：$X_{\\text{input}} = X_{\\text{embed}} + PE$。\n\n经典的正余弦编码：\n\n$$\nPE_{(pos, 2i)} = \\sin(pos / 10000^{2i/d})\n$$\n\n$$\nPE_{(pos, 2i+1)} = \\cos(pos / 10000^{2i/d})\n$$\n\n---\n\n在 Transformer 中，我们统一使用 Layer Normalization，绝对不用 Batch Normalization。\n\n**BatchNorm**：在特征维度 (Channel) 上对整个 Batch 的样本求均值和方差。缺点是极其依赖 Batch Size，且处理变长序列（NLP 任务的常态）时，后面的 token 获取不到足够的统计量，会导致严重崩溃。\n\n**LayerNorm**：在每个样本内部（沿着词向量维度 $d$）独立求均值和方差。它完全不受 Batch Size 影响，是 Transformer 在 NLP 中大杀器的标配。\n\n---\n\n### CNN 基础与深度网络\n\n---\n\n与全连接网络（MLP）相比，**卷积神经网络 (CNN)** 能够极大地减少参数量，其底层的数学逻辑依赖于对现实世界信号（如图像、音频）的两个极强的先验假设：\n\n**局部连接 (Local Connectivity)：**\n\n假设：空间上相近的像素往往具有高度相关性（构成边缘、角点等局部特征），而距离远的像素相关性极弱。\n\n实现：每个神经元不再与上一层的所有神经元相连，而是只与一个极小的局部窗口（感受野）相连。\n\n**权重共享 (Weight Sharing)** 与 **平移等变性 (Translation Equivariance)**：\n\n假设：如果一个特征（比如猫的耳朵）在图像左上角有用，那么它在右下角同样有用。\n\n实现：同一个卷积核（一组固定的权重矩阵）在整个输入特征图上滑动扫过。数学性质：$f(g(x)) = g(f(x))$，即先平移输入再卷积，等于先卷积再平移输出。这赋予了模型极强的平移等变性。\n\n---\n\n**感受野 (Receptive Field)**指的是网络深层的一个神经元，能“看到”原始输入图像上多大范围的区域。这是决定网络能捕捉多大宏观特征的核心指标。递推公式：假设第 $l$ 层的感受野为 $RF_l$，卷积核大小为 $k_l$，步长为 $s_l$。\n\n$$\nRF_l = RF_{l-1} + (k_l - 1) \\times \\prod_{i=1}^{l-1} s_i\n$$\n\n---\n\n**障碍一：梯度消失/爆炸 (Vanishing/Exploding Gradients)**\n\n原因：反向传播基于链式法则，本质是无数个雅可比矩阵的连乘：$\\frac{\\partial L}{\\partial x_1} = \\frac{\\partial L}{\\partial x_n} \\frac{\\partial x_n}{\\partial x_{n-1}} \\dots \\frac{\\partial x_2}{\\partial x_1}$。如果这些矩阵的奇异值普遍小于 1，连乘后梯度趋于 0；如果普遍大于 1，则趋于无穷。\n\n**障碍二：网络退化 (Degradation) —— 深度学习的至暗时刻**\n\n现象：当网络层数不断增加时，训练误差不仅没有下降，反而升高了！\n\n本质：注意！这绝对不是过拟合（过拟合是训练误差低，测试误差高）。这纯粹是一个优化灾难。理论上，一个 50 层的网络，只要把后面 30 层设为恒等映射，它的表现就绝对不会比 20 层的网络差。但普通的非线性层极难学到完美的恒等映射。\n\n---\n\n何恺明提出的 ResNet 用一个极其简单的加法，完美破解了网络退化的死局。残差块核心公式：\n\n$$\nH(x) = \\mathcal{F}(x, W_i) + x\n$$\n\n其中 $x$ 是输入，$H(x)$ 是期望的输出，$\\mathcal{F}$ 是要学习的残差映射。优化视角的降维打击：我们不再强迫网络直接拟合极其复杂的底层映射 $H(x)$，而是让网络去拟合残差 $\\mathcal{F}(x) = H(x) - x$。\n\n对残差公式求导：\n\n$$\n\\frac{\\partial", "has_pdf": false}, {"title": "Machine Learning Crash Course", "url": "/blog/applied-math/ai-exam/machine-learning-crash-course/", "preview": "--- 在监督学习中，我们有一个输入空间  \\(\\mathcal{X}\\)  （比如图片的像素特征）和一个标签空间  \\(\\mathcal{Y}\\)  （比如分类类别）。", "date": "2026-02-21", "words": 6417, "categories": ["应用数学", "AI 博资考"], "tags": ["ai-exam", "applied-math", "machine-learning-crash-course"], "content": "机器学习 --- 监督学习和 PAC 学习 --- 在监督学习中，我们有一个输入空间 $\\mathcal X $（比如图片的像素特征）和一个标签空间 $\\mathcal Y $（比如分类类别）。 自然界中存在一个未知的数据分布 $\\mathcal D $，我们所有的训练数据 $S = \\ (x 1, y 1), \\dots, (x m, y m)\\ $ 都是从这个分布中独立同分布（i.i.d.）采样得到的。 这里存在一个根本的矛盾，也是机器学习理论要解决的核心问题： 真实风险 (True Risk / Generalization Error, $L \\mathcal D (h)$) ：这是我们真正想要最小化的目标。它衡量的是模型 $h$ 在整个未知分布 $\\mathcal D $ 上的预期表现。 $$ L \\mathcal D (h) = \\mathbb P (x,y) \\sim \\mathcal D h(x) \\neq y $$ 因为分布 $\\mathcal D $ 是未知的，真实风险永远无法直接计算。 经验风险 (Empirical Risk / Training Error, $L S(h)$) ： 这是我们实际能算出来的目标。它衡量的是模型在已知的训练集 $S$ 上的平均错误率 。 $$ L S(h) = \\frac 1 m \\sum i=1 ^m \\mathbb I h(x i) \\neq y i $$ 在实际操作中，我们使用的是经验风险最小化 (ERM, Empirical Risk Minimization) 策略，即选出在训练集上表现最好的模型 $h S = \\arg\\min h \\in \\mathcal H L S(h)$ 。但这会带来一个致命陷阱：过拟合（Overfitting）。在训练集上表现完美，并不代表在真实分布上表现好。 --- 为了解决上述矛盾，Leslie Valiant 提出了 PAC 学习框架。既然我们无法保证选出的模型 $h$ 百分之百完美（因为数据是随机抽样的，存在运气极差抽到极端数据的可能），那我们就退而求其次，给出一个概率论意义上的保证。PAC 这个名字包含了两个核心指标： 近似正确 (Approximately Correct, $\\epsilon$) ：我们容忍模型有一定的误差，只要它的真实风险 $L \\mathcal D (h) \\le \\epsilon$（比如误差小于 1%），我们就认为它是个好模型。 极大概率 (Probably, $1-\\delta$) ：由于抽样的随机性，我们无法保证每次训练都能得到好模型。我们只要求，在绝大多数情况下（概率至少为 $1-\\delta$，比如 99% 的情况下），算法都能输出一个“近似正确”的模型。 --- 一个假设空间（模型集合）$\\mathcal H $ 被称为是", "source": "## 机器学习\n\n---\n\n### 监督学习和 PAC 学习\n\n---\n在监督学习中，我们有一个输入空间 $\\mathcal{X}$（比如图片的像素特征）和一个标签空间 $\\mathcal{Y}$（比如分类类别）。\n\n自然界中存在一个未知的数据分布 $\\mathcal{D}$，我们所有的训练数据 $S = \\{(x_1, y_1), \\dots, (x_m, y_m)\\}$ 都是从这个分布中独立同分布（i.i.d.）采样得到的。\n\n这里存在一个根本的矛盾，也是机器学习理论要解决的核心问题：\n\n* **真实风险 (True Risk / Generalization Error, $L_{\\mathcal{D}}(h)$)**：这是我们真正想要最小化的目标。它衡量的是模型 $h$ 在整个未知分布 $\\mathcal{D}$ 上的预期表现。\n\n$$\nL_{\\mathcal{D}}(h) = \\mathbb{P}_{(x,y) \\sim \\mathcal{D}}[h(x) \\neq y]\n$$\n\n因为分布 $\\mathcal{D}$ 是未知的，真实风险永远无法直接计算。\n\n* **经验风险 (Empirical Risk / Training Error, $L_S(h)$)**：\n这是我们实际能算出来的目标。它衡量的是模型在已知的训练集 $S$ 上的平均错误率 。\n\n$$\nL_S(h) = \\frac{1}{m} \\sum_{i=1}^m \\mathbb{I}[h(x_i) \\neq y_i]\n$$\n\n在实际操作中，我们使用的是经验风险最小化 (ERM, Empirical Risk Minimization) 策略，即选出在训练集上表现最好的模型 $h_S = \\arg\\min_{h \\in \\mathcal{H}} L_S(h)$ 。但这会带来一个致命陷阱：过拟合（Overfitting）。在训练集上表现完美，并不代表在真实分布上表现好。\n\n---\n\n为了解决上述矛盾，Leslie Valiant 提出了 PAC 学习框架。既然我们无法保证选出的模型 $h$ 百分之百完美（因为数据是随机抽样的，存在运气极差抽到极端数据的可能），那我们就退而求其次，给出一个概率论意义上的保证。PAC 这个名字包含了两个核心指标：\n\n* **近似正确 (Approximately Correct, $\\epsilon$)**：我们容忍模型有一定的误差，只要它的真实风险 $L_{\\mathcal{D}}(h) \\le \\epsilon$（比如误差小于 1%），我们就认为它是个好模型。\n\n* **极大概率 (Probably, $1-\\delta$)**：由于抽样的随机性，我们无法保证每次训练都能得到好模型。我们只要求，在绝大多数情况下（概率至少为 $1-\\delta$，比如 99% 的情况下），算法都能输出一个“近似正确”的模型。\n\n---\n\n一个假设空间（模型集合）$\\mathcal{H}$ 被称为是 **PAC 可学习** 的，如果存在一个学习算法和一个多项式级别的函数 $m_{\\mathcal{H}}(\\epsilon, \\delta)$，使得对于：\n\n* 任意的数据分布 $\\mathcal{D}$\n* 任意的精度参数 $\\epsilon \\in (0, 1)$\n* 任意的置信度参数 $\\delta \\in (0, 1)$\n\n只要训练样本量 $m \\ge m_{\\mathcal{H}}(\\epsilon, \\delta)$，该算法在独立同分布的样本集 $S$ 上运行后，输出的假设 $h$ 满足以下不等式：\n\n$$\n\\mathbb{P}_{S \\sim \\mathcal{D}^m}[L_{\\mathcal{D}}(h) \\le \\epsilon] \\ge 1 - \\delta\n$$\n\n---\n\n考试中经常会区分这两种 PAC 模型：\n\n* **可实现 PAC (Realizable PAC)**：\n这是一个强假设。它假设自然界中那个产生真实标签的完美函数 $f$，本身就包含在我们选择的假设空间 $\\mathcal{H}$ 里面。因此，算法总能在假设空间中找到一个在训练集上误差为 0 的模型 。\n\n* **不可知 PAC (Agnostic PAC)**：\n这是更符合真实世界的假设。它不假设完美函数存在于 $\\mathcal{H}$ 中（甚至标签可能含有噪声） 。在这种情况下，我们的目标不再是追求绝对误差小于 $\\epsilon$，而是追求与假设空间中最优模型的差距小于 $\\epsilon$ 。\n其数学表达变为：\n\n$$\n\\mathbb{P}_{S \\sim \\mathcal{D}^m} \\left[ L_{\\mathcal{D}}(h) \\le \\min_{h' \\in \\mathcal{H}} L_{\\mathcal{D}}(h') + \\epsilon \\right] \\ge 1 - \\delta\n$$\n\n---\n\n### VC维、Sauer引理与统计学习理论基本定理\n\n---\n\n当假设空间 $\\mathcal{H}$ 是有限的，我们可以简单地用 $\\log|\\mathcal{H}|$ 来衡量它的复杂度。但对于大多数实用模型（如线性分类器、神经网络），参数是连续的，$\\mathcal{H}$ 的大小是无限的。为了在无限空间中建立概率误差界限，我们引入了基于组合数学的测度。\n\n* **对分 (Dichotomy)** 与 **生长函数 (Growth Function, $\\tau_{\\mathcal{H}}(m)$)**：对于包含 $m$ 个样本的数据集 $C = \\{x_1, \\dots, x_m\\}$，空间 $\\mathcal{H}$ 中的模型最多能给这 $m$ 个点打出多少种不同的二值标签组合？这个数量的最大值就是生长函数 $\\tau_{\\mathcal{H}}(m)$ 。显然，它的绝对上限是 $2^m$（即所有的正负组合都被模型实现了） 。\n\n* **打散 (Shattering)**：如果 $\\tau_{\\mathcal{H}}(m) = 2^m$，这就意味着无论这 $m$ 个点被标记成什么样，我们的假设空间 $\\mathcal{H}$ 里总能挑出一个模型把它们完美分类（误差为 0）。一旦模型能打散数据，说明它具备了绝对的“死记硬背”能力，我们在训练集上看到的 0 误差，就无法证明它真的学到了规律，它可能只是把答案背下来了 。\n\n---\n\n为了量化这种死记硬背的极限，我们定义 VC 维度：空间 $\\mathcal{H}$ 的 **VC 维** $d$ 是它能够打散的最大样本集的大小 ：如果对于任意大小的 $m$，$\\mathcal{H}$ 都能打散，那么 $\\text{VCdim}(\\mathcal{H}) = \\infty$ 。\n\n要严格证明 $\\text{VCdim}(\\mathcal{H}) = d$，需完成两步：下界：找到某一个大小为 $d$ 的样本集，证明它可以被 $\\mathcal{H}$ 打散。上界：证明任意大小为 $d+1$ 的样本集，都绝对不能被 $\\mathcal{H}$", "has_pdf": false}, {"title": "Optimization Methods Crash Course", "url": "/blog/applied-math/ai-exam/optimization-methods-crash-course/", "preview": "如果函数  \\(f(x)\\)  是  \\(L\\)  -smoothness 的，意味着它的梯度是  \\(L\\)  -Lipschitz 连续的。对于定义域内的任意  \\(x, y\\)  ，满足：  \\[||\\nabla f(x) - \\nabla f(y)|| \\le L ||x - y||\\]  等价的二阶泰勒展开上限形式：", "date": "2026-02-21", "words": 5188, "categories": ["应用数学", "AI 博资考"], "tags": ["ai-exam", "applied-math", "optimization-methods-crash-course"], "content": "优化方法速通 --- 函数的平滑性和强凸性 --- 如果函数 $f(x)$ 是 $L$-smoothness 的，意味着它的梯度是 $L$-Lipschitz 连续的。对于定义域内的任意 $x, y$，满足：$$ \\nabla f(x) - \\nabla f(y) \\le L x - y $$等价的二阶泰勒展开上限形式： $$ f(y) \\le f(x) + \\langle \\nabla f(x), y-x \\rangle + \\frac L 2 y-x ^2 $$ 还有一个等价条件是 $\\frac L 2 x ^2 - f(x)$ 是凸函数 --- 如果函数 $f(x)$ 是 $\\mu$-strong convexity 的，说明它不仅是一个凸函数，而且至少和一个二次函数一样“凸”。对于任意 $x, y$，满足：$$f(y) \\ge f(x) + \\langle \\nabla f(x), y-x \\rangle + \\frac \\mu 2 y-x ^2$$或者用梯度的单调性表示：$$\\langle \\nabla f(x) - \\nabla f(y), x - y \\rangle \\ge \\mu x - y ^2$$ --- Bregman 散度 是衡量两个点 $x, y$ 之间“距离”的泛化表达： $$ D f(x, y) = f(x) - f(y) - \\langle \\nabla f(y), x - y \\rangle $$ $\\mu$-强凸性 ($\\mu$-Strong Convexity) ：提供下界。 $$ \\frac \\mu 2 x - y ^2 \\le D f(x, y) \\le \\frac 1 2\\mu \\nabla f(x) - \\nabla f(y) ^2 $$ $L$-平滑性 ($L$-Smoothness) ：提供上界。 $$ D f(x, y) \\le \\frac L 2 x - y ^2 $$ 同时具备 凸性 与 $L$-平滑性 (极其常用！) ： $$ \\frac 1 2L \\nabla f(x) - \\nabla f(y) ^2 \\le D f(x, y) $$ --- 如果 $f$ 同时是 $\\mu$-强凸 且 $L$-平滑 的，那么梯度差不仅受限于距离，还会被强制加上一个混合界： $$ \\mu x - y ^2 + \\frac 1 L \\nabla f(x) - \\nabla f(y) ^2 \\le \\left(1 + \\frac \\mu L \\right) \\langle \\nabla f(x) - \\nabla f(y), x - y \\rangle $$ --- 随机梯度下降 (SGD) 与方差分解 --- 当我们处理海量数据时，计算全梯度 $\\nabla f(x)$ 太慢了，只能用一小批数据算出一个“带噪声”的随", "source": "## 优化方法速通\n\n---\n\n### 函数的平滑性和强凸性\n\n---\n\n如果函数 $f(x)$ 是 **$L$-smoothness** 的，意味着它的梯度是 $L$-Lipschitz 连续的。对于定义域内的任意 $x, y$，满足：$$||\\nabla f(x) - \\nabla f(y)|| \\le L ||x - y||$$等价的二阶泰勒展开上限形式：\n\n$$\nf(y) \\le f(x) + \\langle \\nabla f(x), y-x \\rangle + \\frac{L}{2}||y-x||^2\n$$\n\n还有一个等价条件是 $\\frac{L}{2}||x||^2 - f(x)$ 是凸函数\n\n---\n\n如果函数 $f(x)$ 是 **$\\mu$-strong convexity** 的，说明它不仅是一个凸函数，而且至少和一个二次函数一样“凸”。对于任意 $x, y$，满足：$$f(y) \\ge f(x) + \\langle \\nabla f(x), y-x \\rangle + \\frac{\\mu}{2}||y-x||^2$$或者用梯度的单调性表示：$$\\langle \\nabla f(x) - \\nabla f(y), x - y \\rangle \\ge \\mu ||x - y||^2$$\n\n---\n\n**Bregman 散度**是衡量两个点 $x, y$ 之间“距离”的泛化表达：\n\n$$\nD_f(x, y) = f(x) - f(y) - \\langle \\nabla f(y), x - y \\rangle\n$$\n\n$\\mu$-强凸性 ($\\mu$-Strong Convexity) ：提供下界。\n\n$$\n\\frac{\\mu}{2} ||x - y||^2 \\le D_f(x, y) \\le \\frac{1}{2\\mu} ||\\nabla f(x) - \\nabla f(y)||^2\n$$\n\n$L$-平滑性 ($L$-Smoothness) ：提供上界。\n\n$$\nD_f(x, y) \\le \\frac{L}{2} ||x - y||^2\n$$\n\n同时具备 凸性 与 $L$-平滑性 (极其常用！) ：\n\n$$\n\\frac{1}{2L} ||\\nabla f(x) - \\nabla f(y)||^2 \\le D_f(x, y)\n$$\n\n---\n\n如果 $f$ 同时是 $\\mu$-强凸 且 $L$-平滑 的，那么梯度差不仅受限于距离，还会被强制加上一个混合界：\n\n$$\n\\mu ||x - y||^2 + \\frac{1}{L} ||\\nabla f(x) - \\nabla f(y)||^2 \\le \\left(1 + \\frac{\\mu}{L}\\right) \\langle \\nabla f(x) - \\nabla f(y), x - y \\rangle\n$$\n\n---\n\n\n### 随机梯度下降 (SGD) 与方差分解\n\n---\n\n当我们处理海量数据时，计算全梯度 $\\nabla f(x)$ 太慢了，只能用一小批数据算出一个“带噪声”的随机梯度 $g(x, \\xi)$ 。这个梯度需要满足：\n\n* **无偏性 (Unbiasedness)**：$\\mathbb{E}[g^k \\mid x^k] = \\nabla f(x^k)$\n  \n* **有界方差 (Bounded Variance)** ：噪声必须是被控制的：$\\mathbb{E}[||\\xi||^2] \\le \\sigma^2$。\n\n---\n\n把单步距离的平方展开并取条件期望：\n\n$$\n\\mathbb{E}[||x^{k+1} - x^*||^2 \\mid x^k] \\le ||x^k - x^* - \\gamma \\nabla f(x^k)||^2 + \\gamma^2 \\mathbb{E}[||\\xi^k||^2 \\mid x^k]\n$$\n\n---\n\n**The AC Assumption**：\n\n存在常数 $A \\ge 0$ 和 $C \\ge 0$，使得对于所有 $k \\ge 0$：\n\n$$\n\\mathbb{E}[||g^k - \\nabla f(x^*)||^2 \\mid x^k] \\le 2A D_f(x^k, x^*) + C\n$$\n\n**The Convergence Theorem of SGD**：\n\n如果步长满足 $0 < \\gamma \\le 1/A$，那么：\n\n$$\n\\mathbb{E}||x^k - x^*||^2 \\le (1 - \\gamma\\mu)^k ||x^0 - x^*||^2 + \\frac{\\gamma C}{\\mu}\n$$\n\n\n\n\n\n\n\n\n\n---\n\n### 近端算子与非扩张性\n\n---\n\n**近端算子(Proximal Operator)** 是一种用来处理非平滑凸函数的极佳工具。标准数学定义为：对于一个凸函数 $R(x)$ 和一个参数 $\\gamma > 0$，点 $v$ 的近端算子定义为：\n\n$$\n\\text{prox}_{\\gamma R}(v) = \\arg\\min_x \\left( R(x) + \\frac{1}{2\\gamma} ||x - v||^2 \\right)\n$$\n\n近端算子 $\\text{prox}_{\\gamma R}$ 具有 **非扩张性（Non-expansiveness）** ，即对于任意 $u, v$，有 $||\\text{prox}_{\\gamma R}(u) - \\text{prox}_{\\gamma R}(v)|| \\le ||u - v||$。\n\n有一个特殊的性质，若 $z=\\text{prox}_{\\gamma R}(v)$，那么有\n\n$$\n0\\in \\partial R(z) + \\frac{1}{\\gamma}(z - v) \\Longleftrightarrow v\\in  z + \\gamma \\partial R(z) \n$$\n\n反过来若 $v\\in  z - \\gamma \\partial R(z)$，则 $z=\\text{prox}_{\\gamma R}(v)$。\n\n---\n\n解决复合优化问题：$\\min_{x \\in \\mathbb{R}^d} F(x) = f(x) + R(x)$ 。\n\n公式：$x^{k+1} = \\text{prox}_{\\gamma R}(x^k - \\gamma \\nabla f(x^k))$ 。\n\n利用 $L$-平滑和 $\\mu$-强凸的常规性质：\n\n$$\n||x^{k+1} - x^*||^2 \\le (1 - \\gamma\\mu)||x^k - x^*||^2 - 2\\gamma(1 - \\gamma L)D_f(x^k, x^*)\n$$\n\n由 Spring, 2025, C2 有：\n\n$$\n||x^{k+1} - x^*||^2 \\le \\left(1 - \\frac{2\\gamma\\mu L}{L + \\mu}\\right)||x^k - x^*||^2 - \\gamma\\left(\\frac{2L + \\mu}{L} - \\gamma\\right)||\\nabla f(x^k) -", "has_pdf": false}, {"title": "Asymptotic Analysis Exercises", "url": "/blog/applied-math/applied-math-exam/asymptotic-analysis-exercises/", "preview": " \\[u^{\\prime\\prime}+(\\lambda+\\epsilon f(x))u=0, \\quad 0&lt;x&lt;1\\] ", "date": "2026-02-17", "words": 552, "categories": ["应用数学", "应用数学博资考"], "tags": ["applied-math", "applied-math-exam", "asymptotic-analysis-exercises"], "content": "渐进分析 Consider the eigenvalue problem with $0<\\epsilon\\ll1$: $$ u^ \\prime\\prime +(\\lambda+\\epsilon f(x))u=0, \\quad 0<x<1 $$ $$ u(0)=0, \\quad u^ \\prime (1)=0. $$ where $f$ is a given smooth function. Give the asymptotic expansion of $\\lambda$ such that the accuracy is $O(\\epsilon)$. 设 $\\lambda=\\lambda 0+\\epsilon \\lambda 1 + O(\\epsilon^2)$，$u=u 0+\\epsilon u 1 + O(\\epsilon^2)$，代入方程并比较各阶项： $$ u 0'' + \\lambda 0 u 0 = 0, $$ $$ u 1'' + \\lambda 0 u 1 = -\\lambda 1 u 0 - f(x) u 0. $$ 由边界条件 $u(0)=0$ 和 $u'(1)=0$ 可得 $u 0(0)=0$ 和 $u 0'(1)=0$。解第一个方程得到 $\\lambda 0 = \\left( n - \\frac 1 2 \\right)^2 \\pi^2$，其中 $n=1,2,3,\\ldots$，对应取 $u 0(x) = \\sin\\left( \\left( n - \\frac 1 2 \\right) \\pi x \\right)$。 对第二个方程两边乘 $u 0$ 并积分，得到 $$ \\int 0^1 u 0 u 1'' + \\lambda 0 u 0 u 1 dx = -\\lambda 1 \\int 0^1 u 0^2 dx - \\int 0^1 f(x) u 0^2 dx. $$ 上式左边通过分部积分可化简为 $$ \\int 0^1 u 0'' u 1+ \\lambda 0 u 0 u 1 dx = 0. $$ 故 $$ \\lambda 1 = -\\frac \\int 0^1 f(x) u 0^2 dx \\int 0^1 u 0^2 dx = -2 \\int 0^1 f(x) \\sin^2\\left( \\left( n - \\frac 1 2 \\right) \\pi x \\right) dx. $$ 因此 $$ \\lambda n=\\left( n - \\frac 1 2 \\right)^2 \\pi^2 - 2 \\epsilon \\int 0^1 f(x) \\sin^2\\left( \\left( n - \\frac 1 2 \\right) \\pi x \\right) dx + O(\\epsilon^2). $$ Consider the fol", "source": "## 渐进分析\n!!! problem \"Autumn, 2023\"\n    Consider the eigenvalue problem with $0<\\epsilon\\ll1$:\n    \n    $$\n    u^{\\prime\\prime}+(\\lambda+\\epsilon f(x))u=0, \\quad 0<x<1\n    $$\n    \n    $$\n    u(0)=0, \\quad u^{\\prime}(1)=0.\n    $$\n    \n    where $f$ is a given smooth function. Give the asymptotic expansion of $\\lambda$ such that the accuracy is $O(\\epsilon)$.\n!!! proof \"证明\"\n    设 $\\lambda=\\lambda_0+\\epsilon \\lambda_1 + O(\\epsilon^2)$，$u=u_0+\\epsilon u_1 + O(\\epsilon^2)$，代入方程并比较各阶项：\n\n    $$\n    u_0'' + \\lambda_0 u_0 = 0,\n    $$\n\n    $$\n    u_1'' + \\lambda_0 u_1 = -\\lambda_1 u_0 - f(x) u_0.\n    $$\n\n    由边界条件 $u(0)=0$ 和 $u'(1)=0$ 可得 $u_0(0)=0$ 和 $u_0'(1)=0$。解第一个方程得到 $\\lambda_0 = \\left( n - \\frac{1}{2} \\right)^2 \\pi^2$，其中 $n=1,2,3,\\ldots$，对应取 $u_0(x) = \\sin\\left( \\left( n - \\frac{1}{2} \\right) \\pi x \\right)$。\n\n    对第二个方程两边乘 $u_0$ 并积分，得到\n\n    $$\n    \\int_0^1 u_0 u_1''  + \\lambda_0 u_0 u_1 dx = -\\lambda_1 \\int_0^1 u_0^2 dx - \\int_0^1 f(x) u_0^2 dx.\n    $$  \n\n    上式左边通过分部积分可化简为\n\n    $$\n    \\int_0^1 u_0'' u_1+ \\lambda_0 u_0 u_1 dx = 0.\n    $$\n\n    故\n\n    $$\n    \\lambda_1 = -\\frac{\\int_0^1 f(x) u_0^2 dx}{\\int_0^1 u_0^2 dx}= -2 \\int_0^1 f(x) \\sin^2\\left( \\left( n - \\frac{1}{2} \\right) \\pi x \\right) dx.\n    $$\n\n    因此\n\n    $$\n    \\lambda_n=\\left( n - \\frac{1}{2} \\right)^2 \\pi^2 - 2 \\epsilon \\int_0^1 f(x) \\sin^2\\left( \\left( n - \\frac{1}{2} \\right) \\pi x \\right) dx + O(\\epsilon^2).\n    $$\n    \n!!! problem \"Autumn, 2024\"\n    Consider the following boundary value problem for $y=y(x)$ on $[0, 1]$ as $0<\\epsilon\\ll1$:\n    \n    $$\n    \\epsilon y^{\\prime\\prime}+\\epsilon(1+x)^{2}y^{\\prime}-y=x-1, \\quad y(0)=\\alpha, \\quad y(1)=-1.\n    $$\n    \n    (i) Suppose $\\alpha=1$. Construct a composite expansion of the above problem and sketch the solution.\n    \n    (ii) Construct a composite expansion of the above problem for $\\alpha=0$.\n    \n    (iii) What is the accuracy of your solution in $\\epsilon$? Formally explain your conclusion. Consider the first case only.\n\n!!! proof \"证明\"\n    $(i)$：当 $\\epsilon \\to 0$ 时，$y=1-x$ 不满足 $y(1)=-1$ 的边界条件，因此在 $x=1$ 处存在一个边界层。考虑原方程的齐次部分 $\\epsilon \\lambda^2 + \\epsilon(1+x)^2 \\lambda - 1 \\approx 0$。其特征根约为 $\\lambda \\approx \\pm 1/\\sqrt{\\epsilon}$。这说明边界层的厚度尺度为 $\\mathcal{O}(\\sqrt{\\epsilon})$。设 $\\eta = \\frac{1-x}{\\sqrt{\\epsilon}}$，$y(x)=1-x+v(\\eta)$，则 $y_x=-\\frac{1}{\\sqrt{\\epsilon}} v_\\eta$，$y_{xx}=\\frac{1}{\\epsilon} v_{\\eta\\eta}$，代入保留 $O(1)$ 项得到：\n\n    $$\n    v_{\\eta\\eta} - v_\\eta = 0\n    $$\n\n    解得 $v(\\eta)=A e^{\\eta}+B e^{-\\eta}$。由于 $v(\\eta)$ 在 $\\eta \\to \\infty$ 时必须有界，故 $A=0$。边界条件 $y(1)=-1$ 即 $v(0)=-1$，解得 $B=-1$。因此\n\n    $$\n    y(x) \\approx 1-x - e^{-\\frac{1-x}{\\sqrt{\\epsilon}}}.\n    $$ \n\n    $(ii)$：当 $\\epsilon \\to 0$ 时，$y=1-x$ 不满足 $y(0)=0$ 的边界条件，因此在 $x=0$ 处也存在一个边界层。同上考虑 $\\xi = \\frac{x}{\\sqrt{\\epsilon}}$，$y(x)=1-x+u(\\xi)+v(\\eta)$，代入保留 $O(1)$ 项得到：\n\n    $$\n    u_{\\xi\\xi} - u = 0\n    $$\n\n    解得 $u(\\xi)=C e^{\\xi}+D e^{-\\xi}$。进一步有 $D=0,C=-1$，故\n\n    $$\n    y(x) \\approx 1-x - e^{-\\frac{x}{\\sqrt{\\epsilon}}}- e^{-\\frac{1-x}{\\sqrt{\\epsilon}}}.\n    $$\n\n    $(iii", "has_pdf": false}, {"title": "Convex Optimization Exercises", "url": "/blog/applied-math/applied-math-exam/convex-optimization-exercises/", "preview": " \\[\\max_{x}\\langle c,x\\rangle \\quad \\text{s.t.} \\quad Ax=b, \\quad x\\ge0\\] ", "date": "2026-02-17", "words": 2032, "categories": ["应用数学", "应用数学博资考"], "tags": ["applied-math", "applied-math-exam", "convex-optimization-exercises"], "content": "凸优化 Consider the following linear programming problem: $$ \\max x \\langle c,x\\rangle \\quad \\text s.t. \\quad Ax=b, \\quad x\\ge0 $$ where $x\\in\\mathbb R ^ n $, $0\\le b\\in\\mathbb R ^ m $, $A\\in\\mathbb R ^ m\\times n $ and $c\\in\\mathbb R ^ n $. $A$ is a full rank matrix and $m<n$. (1) Prove that the basic feasible solutions are equivalent to the vertices of its feasible region. (2) Write down the dual problem, and prove that when the optimal solution exists, the dual problem must also have an optimal solution, and the optimal objective values of these two problems are equal. $(1)$：对于 $x \\in \\mathcal P $，设其严格正分量的指标集为 $I = \\ i \\mid x i 0\\ $。 $\\text BFS \\implies \\text Vertex $：采用反证法。假设 $x$ 是一个 BFS，但它不是顶点。则存在 $y, z \\in \\mathcal P $ ($y \\ne z$) 且 $\\lambda \\in (0, 1)$，使得 $x = \\lambda y + (1-\\lambda) z$。因为 $y \\ge 0, z \\ge 0$ 且 $\\lambda \\in (0, 1)$，对于任意使得 $x j = 0$ 的指标 $j \\notin I$，必须有 $\\lambda y j + (1-\\lambda) z j = 0$。这蕴含着 $y j = 0$ 且 $z j = 0$ ($\\forall j \\notin I$)。也就是说，$y$ 和 $z$ 的非零分量也只能出现在指标集 $I$ 中。由于 $y, z \\in \\mathcal P $，它们都满足线性约束： $$ Ay = \\sum i \\in I y i A i = b $$ $$ Az = \\sum i \\in I z i A i = b $$ 两式相减得到： $$ \\sum i \\in I (y i - z i) A i = 0 $$ 因为 $x$ 是 BFS，根据定义，列向量组 $\\ A i\\ i \\in I", "source": "## 凸优化\n!!! problem \"Autumn, 2023\"\n    Consider the following linear programming problem:\n    \n    $$\n    \\max_{x}\\langle c,x\\rangle \\quad \\text{s.t.} \\quad Ax=b, \\quad x\\ge0\n    $$\n    \n    where $x\\in\\mathbb{R}^{n}$, $0\\le b\\in\\mathbb{R}^{m}$, $A\\in\\mathbb{R}^{m\\times n}$ and $c\\in\\mathbb{R}^{n}$. $A$ is a full rank matrix and $m<n$.\n    \n    (1) Prove that the basic feasible solutions are equivalent to the vertices of its feasible region.\n    \n    (2) Write down the dual problem, and prove that when the optimal solution exists, the dual problem must also have an optimal solution, and the optimal objective values of these two problems are equal.\n!!! proof \"证明\"\n    $(1)$：对于 $x \\in \\mathcal{P}$，设其严格正分量的指标集为 $I = \\{i \\mid x_i > 0\\}$。\n    \n    $\\text{BFS} \\implies \\text{Vertex}$：采用反证法。假设 $x$ 是一个 BFS，但它不是顶点。则存在 $y, z \\in \\mathcal{P}$ ($y \\ne z$) 且 $\\lambda \\in (0, 1)$，使得 $x = \\lambda y + (1-\\lambda) z$。因为 $y \\ge 0, z \\ge 0$ 且 $\\lambda \\in (0, 1)$，对于任意使得 $x_j = 0$ 的指标 $j \\notin I$，必须有 $\\lambda y_j + (1-\\lambda) z_j = 0$。这蕴含着 $y_j = 0$ 且 $z_j = 0$ ($\\forall j \\notin I$)。也就是说，$y$ 和 $z$ 的非零分量也只能出现在指标集 $I$ 中。由于 $y, z \\in \\mathcal{P}$，它们都满足线性约束：\n    \n    $$\n    Ay = \\sum_{i \\in I} y_i A_i = b\n    $$\n    \n    $$\n    Az = \\sum_{i \\in I} z_i A_i = b\n    $$\n    \n    两式相减得到：\n    \n    $$\n    \\sum_{i \\in I} (y_i - z_i) A_i = 0\n    $$\n    \n    因为 $x$ 是 BFS，根据定义，列向量组 $\\{A_i\\}_{i \\in I}$ 是线性无关的。因此，必须有 $y_i - z_i = 0 \\quad (\\forall i \\in I)$，即 $y = z$。矛盾！\n\n    $\\text{Vertex} \\implies \\text{BFS}$：反证法，假设 $\\{A_i\\}_{i \\in I}$ 是线性相关的。于是存在一组不全为零的标量 $\\{d_i\\}_{i \\in I}$ 使得 $\\sum_{i \\in I} d_i A_i = 0$。\n    \n    构造一个全空间向量 $d \\in \\mathbb{R}^n$，使得其在 $I$ 上的分量为 $d_i$，其余分量 $d_j = 0$ ($\\forall j \\notin I$)。显然 $d \\ne 0$ 且 $Ad = 0$。因为对于 $i \\in I$ 有 $x_i > 0$，我们可以取一个足够小的正数 $\\epsilon > 0$，使得：\n    \n    $$\n    x + \\epsilon d \\ge 0 \\quad \\text{且} \\quad x - \\epsilon d \\ge 0\n    $$\n    \n    令 $y = x + \\epsilon d$，$z = x - \\epsilon d$。显然 $y \\ne z$（因为 $d \\ne 0$）。验证它们是否在可行域 $\\mathcal{P}$ 中：\n    \n    $$\n    Ay = A(x + \\epsilon d) = Ax + \\epsilon Ad = b + 0 = b \\implies y \\in \\mathcal{P}\n    $$\n    \n    $$\n    Az = A(x - \\epsilon d) = Ax - \\epsilon Ad = b - 0 = b \\implies z \\in \\mathcal{P}\n    $$\n    \n    此时我们发现 $x = \\frac{1}{2}y + \\frac{1}{2}z$。这意味着 $x$ 可以表示为 $\\mathcal{P}$ 中两个不同点的严格凸组合，这与 $x$ 是顶点的条件矛盾！\n!!! problem \"Spring, 2024\"\n    Let $S \\subset \\mathbb{R}^{n}$ be a non-empty closed convex set, $f \\in \\mathcal{C}^{2}(S)$ is convex. For any $x^{0} \\in S$, define $L(f(x^{0})) = \\{x \\in S | f(x) \\le f(x^{0})\\}$. If there exists some $m > 0$ such that:\n    \n    $$\n    d^{\\top}\\nabla^{2}f(x)d \\ge m||d||^{2} \\quad \\forall x \\in L(f(x^{0})), d \\in \\mathbb{R}^{n}\n    $$\n    \n    Prove that $L(f(x^{0}))$ is a bounded and closed convex set.\n!!! proof \"证明\"\n    闭：由 $L(f(x^{0}))=f^{-1}((-\\infty, f(x^{0})])\\cap S$ 可知 $L(f(x^{0}))$ 是闭集。\n\n    凸：由于 $f$ 是凸函数，$f(\\lambda x + (1-\\lambda) y) \\le \\lambda f(x) + (1-\\lambda) f(y)$ 对任意 $x, y \\in S$ 和 $\\lambda \\in [0, 1]$ 成立。因此，如果 $x, y \\in L(f(x^{0}))$，则 f(\\lambda x +", "has_pdf": false}, {"title": "Numerical Algebra Exercises", "url": "/blog/applied-math/applied-math-exam/numerical-algebra-exercises/", "preview": "1: find an upper Hessenberg matrix  \\(H_{0}\\)  and a unitary matrix  \\(U_{0}\\)  such that  \\(H_{0}=U_{0}^{H}AU_{0}\\)  .", "date": "2026-02-14", "words": 8602, "categories": ["应用数学", "应用数学博资考"], "tags": ["applied-math", "applied-math-exam", "numerical-algebra-exercises"], "content": "数值代数 Consider the explicit shifted QR method for computing eigenvalues of a matrix $A\\in\\mathbb C ^ n\\times n $. 1: find an upper Hessenberg matrix $H 0 $ and a unitary matrix $U 0 $ such that $H 0 =U 0 ^ H AU 0 $. 2: for $i=0,1,2,\\dots$ do 3: determine a scalar $\\mu k .$ 4: compute QR factorization $Q k R k =H k -\\mu k I$ 5: $H k+1 =R k Q k +\\mu k I$. 6: end for (1). Prove that $H i $, $i=1,2,\\dots$ are all upper Hessenberg matrices. (2). Interpret the purpose to use $H 0 $ rather than $A$ in the iteration. (3). Suppose that $A$ has $n$ distinct eigenvalues and none of the shifts $\\mu i $, $i=1,2,\\dots$ is an eigenvalue of $A$. Prove that $H i $, $i=0,1,2,\\dots$ are unreduced upper Hessenberg matrices. (An upper Hessenberg matrix $H$ is called unreduced, if $H i+1,i \\ne0$ for $i=1,\\dots,n-1.$) (4). Write $H k =\\begin bmatrix G k &u k \\\\ \\epsilon k e^ T &\\alpha k \\end bmatrix $ where $\\alpha k , \\epsilon k \\in\\mathbb C $, $u k , e\\in\\mathbb C ^ n-1 $ and $e=\\begin bmatrix 0\\\\ \\vdots\\\\ 0\\\\ 1\\end bmatrix .$ Suppose $A$ has $n$ distinct eigenvalues. Prove that $$ \\epsilon k+1 \\le\\rho k ^ 2 u k 2 \\epsilon k ^ 2 +\\rho k \\alpha k -\\mu k \\epsilon k , $$ where $\\rho k = (G k -\\mu k I)^ -1 ", "source": "## 数值代数\n!!! problem \"Autumn, 2023\"\n    Consider the explicit shifted QR method for computing eigenvalues of a matrix $A\\in\\mathbb{C}^{n\\times n}$.\n    \n    1: find an upper Hessenberg matrix $H_{0}$ and a unitary matrix $U_{0}$ such that $H_{0}=U_{0}^{H}AU_{0}$.\n    \n    2: for $i=0,1,2,\\dots$ do\n    \n    3: determine a scalar $\\mu_{k}.$\n    \n    4: compute QR factorization $Q_{k}R_{k}=H_{k}-\\mu_{k}I$\n    \n    5: $H_{k+1}=R_{k}Q_{k}+\\mu_{k}I$.\n    \n    6: end for\n    \n    (1). Prove that $H_{i}$, $i=1,2,\\dots$ are all upper Hessenberg matrices.\n    \n    (2). Interpret the purpose to use $H_{0}$ rather than $A$ in the iteration.\n    \n    (3). Suppose that $A$ has $n$ distinct eigenvalues and none of the shifts $\\mu_{i}$, $i=1,2,\\dots$ is an eigenvalue of $A$. Prove that $H_{i}$, $i=0,1,2,\\dots$ are unreduced upper Hessenberg matrices. (An upper Hessenberg matrix $H$ is called unreduced, if $H_{i+1,i}\\ne0$ for $i=1,\\dots,n-1.$)\n    \n    (4). Write $H_{k}=\\begin{bmatrix}G_{k}&u_{k}\\\\ \\epsilon_{k}e^{T}&\\alpha_{k}\\end{bmatrix}$ where $\\alpha_{k}, \\epsilon_{k}\\in\\mathbb{C}$, $u_{k}, e\\in\\mathbb{C}^{n-1}$ and $e=\\begin{bmatrix}0\\\\ \\vdots\\\\ 0\\\\ 1\\end{bmatrix}.$ Suppose $A$ has $n$ distinct eigenvalues. Prove that\n    \n    $$\n    |\\epsilon_{k+1}|\\le\\rho_{k}^{2}||u_{k}||_{2}|\\epsilon_{k}|^{2}+\\rho_{k}|\\alpha_{k}-\\mu_{k}||\\epsilon_{k}|,\n    $$\n    \n    where $\\rho_{k}=||(G_{k}-\\mu_{k}I)^{-1}||_{2}$, provided $\\mu_{k}$ is not an eigenvalue of $G_{k}$.\n!!! proof \"证明\"    \n    $(1)$：归纳。$H_0$ 已经成立。$H_k-\\mu_k I$ 上 Hessenberg，$R_k$ 上三角，$Q_k=(H_k-\\mu_kI)R_k^{-1}$ 上 Hessenberg，因此 $H_{k+1}=R_k Q_k + \\mu_k I$ 上 Hessenberg。\n\n    $(2)$：如果直接对稠密矩阵 $A$ 迭代，对一个 $n \\times n$ 的稠密矩阵进行一次 QR 分解需要 $\\mathcal{O}(n^3)$ 的浮点运算。如果先化为 $H_0$ 再迭代，只需要在初始阶段花费一次 $\\mathcal{O}(n^3)$ 的代价。在此之后的每一次 QR 迭代单步迭代的代价骤降为 $\\mathcal{O}(n^2)$。总复杂度大幅优化为 $\\mathcal{O}(n^3 + N n^2)$。\n\n    $(3)$：假设 $H_0$ 是标准的非退化 Hessenberg 矩阵。我们证明如果在第 $k$ 步 $H_k$ 是非退化的，那么 $H_{k+1}$ 也是非退化的。\n\n    $$\n    H_k - \\mu_k I = Q_k R_k\n    $$\n    \n    因为 $\\mu_k$ 不是 $A$ 的特征值，所以 $H_k - \\mu_k I$ 是非奇异的。因此，其 QR 分解中的上三角矩阵 $R_k$ 必定也是非奇异的，即它的对角线元素全不为零：$(R_k)_{j,j} \\ne 0 \\quad \\forall j$。写出 $Q_k = (H_k - \\mu_k I) R_k^{-1}$。\n    \n    观察 $Q_k$ 的次对角线元素：\n    \n    $$\n    (Q_k)_{j+1, j} = (H_k - \\mu_k I)_{j+1, j} \\cdot (R_k^{-1})_{j,j}\n    $$\n    \n    因为 $H_k$ 是非退化的，且 $(R_k^{-1})_{j,j} = 1 / (R_k)_{j,j} \\ne 0$，所以：\n    \n    $$\n    (Q_k)_{j+1, j} \\ne 0\n    $$\n    \n    接下来观察 $H_{k+1}$ 的次对角线元素，由 $H_{k+1} - \\mu_k I = R_k Q_k$ 得到：\n    \n    $$\n    (H_{k+1})_{j+1, j} = (R_k)_{j+1, j+1} \\cdot (Q_k)_{j+1, j}\n    $$\n    \n    由于 $R_k$ 对角线非零，且刚才证了 $Q_k$ 次对角线非零，两者的乘积必然非零：\n    \n    $$\n    (H_{k+1})_{j+1, j} \\ne 0\n    $$\n    \n    这证明了如果 $H_k$ 的次对角线不包含 0，则 $H_{k+1}$ 的次对角线也绝不会包含 0。因此所有 $H_i$ 都是非退化的。证毕。\n\n    $(4)$：设 $Q_k =\\begin{bmatrix}Q_{11}&q_{12}\\\\ q^T_{21}&q_{22}\\end{bmatrix}$ ，$R_k = \\begin{bmatrix}R_{11}&r_{12}\\\\ 0&r_{22}\\end{bmatrix}$。\n    考虑 $Q_k R_k = H_k - \\mu_k I$，\n\n    $$\n    \\begin{bmatrix}Q_{11}&q_{12}\\\\ q^T_{21}&q_{22}\\end{bmatrix} \\begin{bmatrix}R_{11}&r_{", "has_pdf": false}, {"title": "Numerical Ode Exercises", "url": "/blog/applied-math/applied-math-exam/numerical-ode-exercises/", "preview": " \\[\\begin{array}{c|cc}\n    0 &amp; 0 &amp; \\\\\n    1 &amp; 1 &amp; 0 \\\\\n    \\hline\n    &amp; 1/2 &amp; 1/2\n    \\end{array}\\] ", "date": "2026-02-14", "words": 755, "categories": ["应用数学", "应用数学博资考"], "tags": ["applied-math", "applied-math-exam", "numerical-ode-exercises"], "content": "数值 ODE Consider a Runge-Kutta method for the ODE $y^ \\prime =f(t,y)$ ($f$ is Lipschitz continuous in $y$ and uniform in $t$) with the following Butcher tableau: $$ \\begin array c cc 0 & 0 & \\\\ 1 & 1 & 0 \\\\ \\hline & 1/2 & 1/2 \\end array $$ (1). Rewrite the scheme in the form of $u n+1 =u n +hF(t n ,u n ,h;f)$. (2). Assume that $f$ is sufficiently smooth. Prove that this method is convergent and determine the order of convergence. (3). What is the region of absolute stability of this method? Give a description that is as explicit as possible. $(1)$： $$ \\begin aligned k 1 &= f(t n, u n)\\\\ k 2 &= f(t n + c 2 h, u n + h a 21 k 1) = f(t n + h, u n + h f(t n, u n))\\\\ u n+1 &= u n + h(b 1 k 1 + b 2 k 2) = u n + h \\left( \\frac 1 2 k 1 + \\frac 1 2 k 2 \\right) \\end aligned $$ 代入能得到 $$ u n+1 = u n + h \\underbrace \\left \\frac 1 2 f(t n, u n) + \\frac 1 2 f\\big(t n + h, u n + h f(t n, u n)\\big) \\right F(t n, u n, h; f) $$ $(2)$： $$ y(t n+1 ) = y(t n) + h y'(t n) + \\frac h^2 2 y''(t n) + \\mathcal O (h^3) $$ $$ y(t n+1 ) = y(t n) + h f + \\frac h^2 2 (f t + f y f) + \\mathcal O (h^3) $$ $$ k 2 = f(t n + h, y(t n) + h f) = f + h f t + (hf) f y + \\mathcal O (h^2) = f + h(f t + f y f) + \\mathcal O (h^2)", "source": "## 数值 ODE\n!!! problem \"Autumn, 2023\"\n    Consider a Runge-Kutta method for the ODE $y^{\\prime}=f(t,y)$ ($f$ is Lipschitz continuous in $y$ and uniform in $t$) with the following Butcher tableau:\n    \n    $$\n    \\begin{array}{c|cc}\n    0 & 0 & \\\\\n    1 & 1 & 0 \\\\\n    \\hline\n    & 1/2 & 1/2\n    \\end{array}\n    $$\n    \n    (1). Rewrite the scheme in the form of $u_{n+1}=u_{n}+hF(t_{n},u_{n},h;f)$.\n    \n    (2). Assume that $f$ is sufficiently smooth. Prove that this method is convergent and determine the order of convergence.\n    \n    (3). What is the region of absolute stability of this method? Give a description that is as explicit as possible.\n\n!!! proof \"证明\"\n    $(1)$：\n    $$\n    \\begin{aligned}\n        k_1 &= f(t_n, u_n)\\\\\n        k_2 &= f(t_n + c_2 h, u_n + h a_{21} k_1) = f(t_n + h, u_n + h f(t_n, u_n))\\\\\n        u_{n+1} &= u_n + h(b_1 k_1 + b_2 k_2) = u_n + h \\left( \\frac{1}{2} k_1 + \\frac{1}{2} k_2 \\right)\n    \\end{aligned}\n    $$\n\n    代入能得到\n\n    $$\n    u_{n+1} = u_n + h \\underbrace{\\left[ \\frac{1}{2} f(t_n, u_n) + \\frac{1}{2} f\\big(t_n + h, u_n + h f(t_n, u_n)\\big) \\right]}_{F(t_n, u_n, h; f)}\n    $$\n\n    $(2)$：\n    \n    $$\n    y(t_{n+1}) = y(t_n) + h y'(t_n) + \\frac{h^2}{2} y''(t_n) + \\mathcal{O}(h^3)\n    $$\n\n    $$\n    y(t_{n+1}) = y(t_n) + h f + \\frac{h^2}{2} (f_t + f_y f) + \\mathcal{O}(h^3)\n    $$\n\n    $$\n    k_2 = f(t_n + h, y(t_n) + h f) = f + h f_t + (hf) f_y + \\mathcal{O}(h^2) = f + h(f_t + f_y f) + \\mathcal{O}(h^2)\n    $$\n\n    $$\n    h F = \\frac{h}{2} f + \\frac{h}{2} \\big[ f + h(f_t + f_y f) + \\mathcal{O}(h^2) \\big] = h f + \\frac{h^2}{2} (f_t + f_y f) + \\mathcal{O}(h^3)\n    $$\n\n    $$\n    \\tau_{n+1} = y(t_{n+1}) - y(t_n) - h F = \\mathcal{O}(h^3)\n    $$\n\n    由于局部截断误差（单步误差）为 $\\mathcal{O}(h^3)$，该方法的收敛阶（整体截断误差）为 2 阶。\n\n    由于 $f$ 是 Lipschitz 连续的，容易得到 $F$ 也是 Lipschitz 连续的，因此该方法是收敛的。\n\n    $(3)$：考虑\n    \n    $$\n    y' = \\lambda y \\quad (\\text{其中 } \\lambda \\in \\mathbb{C}, \\text{ 即 } f(t,y) = \\lambda y)\n    $$\n\n    代入公式得到\n\n    $$\n    \\begin{aligned}\n        k_1 &= \\lambda u_n\\\\\n        k_2 &= \\lambda (u_n + h k_1) = \\lambda (u_n + h \\lambda u_n) = \\lambda (1 + h\\lambda) u_n\\\\\n        u_{n+1} &= \\left[ 1 + \\frac{h\\lambda}{2} + \\frac{h\\lambda + (h\\lambda)^2}{2} \\right] u_n = \\left( 1 + h\\lambda + \\frac{1}{2}(h\\lambda)^2 \\right) u_n\n    \\end{aligned}\n    $$\n\n    令复变量 $z = h\\lambda$。我们得到了该方法的稳定函数：\n    \n    $$\n    R(z) = 1 + z + \\frac{1}{2}z^2\n    $$\n    \n    绝对稳定区域 $\\mathcal{D} = \\{ z \\in \\mathbb{C} \\mid |R(z)| < 1 \\}$\n!!! problem \"2017 Individual\"\n    **Problem 1.** Consider the differential equation\n\n    $$\n    -u'' + \\alpha u = f, \\quad x \\in (0,1),\n    $$\n\n    where prime denotes $d/dx$ and $\\alpha$ is a constant. We consider a mixed boundary condition\n\n    $$\n    u(0) = 0, \\quad u'(1) - b u(0) = 0.\n    $$\n\n    This equation is approximated by a standard finite difference method:\n\n    $$\n    \\frac{-U_{j-1} + 2U_j - U_{j+1}}{h^2} + \\alpha U_j = f_j, \\quad j = 1, \\ldots, N-1.\n    $$\n\n    Here, $N$ is the number of grid points, $h = 1/N$ is the", "has_pdf": false}, {"title": "Numerical Pde Exercises", "url": "/blog/applied-math/applied-math-exam/numerical-pde-exercises/", "preview": " \\[u_{m}^{n+1}=\\frac{1}{2}(u_{m+1}^{n}+u_{m-1}^{n})-\\frac{1}{2}akh^{-3}(u_{m+2}^{n}-2u_{m+1}^{n}+2u_{m-1}^{n}-u_{m-2}^{n}),\\] ", "date": "2026-02-07", "words": 3240, "categories": ["应用数学", "应用数学博资考"], "tags": ["applied-math", "applied-math-exam", "numerical-pde-exercises"], "content": "数值 PDE For the equation $u t +au xxx =0$ ($a$ is a constant), applying the idea of the Lax-Friedrichs scheme, one can get the scheme $$ u m ^ n+1 =\\frac 1 2 (u m+1 ^ n +u m-1 ^ n )-\\frac 1 2 akh^ -3 (u m+2 ^ n -2u m+1 ^ n +2u m-1 ^ n -u m-2 ^ n ), $$ where $k$ and $h$ represent the time step and mesh size, respectively. (1). Give the leading order term of local truncation error. (2). Analyze the stability of this scheme. $(1)$：由 Taylor 展  = a^{2}\\frac{u_{j+1}^{n+1}-2u_{j}^{n+1}+u_{j-1}^{n+1}}{h^{2}}\n    $$\n    \n    Give its truncation error and stability. Particularly, give the value of $\\theta$ such that the truncation error attains its highest order.\n!!! proof \"证明\"\n    计算得截断误差\n\n    $$\n    T_j^n = \\left( \\theta -\\frac{1}{2}\\right) k u_{tt}-\\frac{h^2}{12a^2}u_{tt}+O(k^2+h^4).\n    $$\n\n    该格式的截断误差一般情况下为 $O(k + h^2)$。当 $\\theta = \\frac{1}{2}$ 时，截断误差的 $O(k)$ 项被消除，此时截断误差为 $O(k^2 + h^2)$，达到了最高阶。\n\n    对于稳定性分析，设 $u_j^n = G^n e^{i j h \\xi}$，代入差分方程得到：\n\n    $$\n    (1+\\theta-A)G^2-(1+2\\theta)G+\\theta=0\n    $$\n\n    这里 $A = -4 a^2 k \\sin^2\\left(\\frac{h\\xi}{2}\\right)/h^2$。容易证明该二次方程的两个根的模长都不大于 $1$，因此该方法无条件稳定。\n!!! problem \"Spring, 2024\"\n    Denote the grid $I_{h}=\\{x_{j}\\}_{j=0}^{M}$, $x_{0} < x_{1} < ... < x_{M}$. Set $u=\\{u_{j}\\}_{j=0}^{M}$ as a grid function on $I_{h}$. Suppose:\n    \n    $$\n    Lu_{j} = -(a_{j}u_{j-1} - b_{j}u_{j} + c_{j}u_{j+1}) + q_{j}u_{j}, \\quad j=1,...,M-1,\n    $$\n    \n    where $a_{j}, b_{j}, c_{j} > 0$, $q_{j} \\ge 0$ and $a_{j}+c_{j} \\le b_{j}$.\n    \n    (i) Assume $Lu_{j} \\le 0$ for all $1 \\le j \\le M-1$. Show that $u_{j}$ can't attain positive maximum at inner points $(1 \\le j \\le M-1)$ unless $u_{j} \\equiv C$.\n    \n    (ii) Suppose $d_{j} = b_{j}-a_{j}-c_{j}+q_{j} > 0$ $(j=1,...,M-1)$. Show the solution of the difference equation\n    \n    $$\n    Lu_{j} = \\varphi_{j}, \\quad j=1,...,M-1; \\quad u_{0}=u_{M}=0\n    $$\n    \n    satisfies $||u||_{\\infty} = \\max_{j}|u_{j}| \\le \\max_{j}\\frac{|\\varphi_{j}|}{d_{j}}$.\n!!! proof \"证明\"\n    $(i)$：反证法即可。\n    \n    $(ii)$：取 $|u_k|=\\max_j |u_j|$，由绝对值不等式易得 $|u_k|\\le \\frac{|\\varphi_k|}{d_k}\\le \\max_j \\frac{|\\varphi_j|}{d_j}$。\n!!! problem \"Autumn, 2024\"\n    For the system\n    \n    $$\n    u_{t}=v_{x},\n    $$\n    \n    $$\n    v_{t}=u_{x},\n    $$\n    \n    analyze the truncation error and stability of the scheme\n    \n   ", "has_pdf": false}, {"title": "App x_{k})}{f^{\\prime}(x_{k})}$\n    \n    4: end for\n    \n    (1). Prove that if $x_{0}$ is sufficiently close to $x_{*}$ and $f^{\\prime}(x_{*})\\ne0$, then $\\lim_{k\\rightarrow\\infty}x_{k}=x_{*}$ and\n    \n    $$\n    \\lim_{k\\rightarrow\\infty}\\frac{x_{k+1}-x_{*}}{(x_{k}-x_{*})^{2}}=\\frac{f^{\\prime\\prime}(x_{*})}{2f^{\\prime}(x_{*})}.\n    $$\n    \n    (2). In practice sometimes the derivative is not easy to be obtained. As a result, a difference is used instead:\n    \n    $$\n    x_{k+1}=x_{k}-\\frac{x_{k}-x_{k-1}}{f(x_{k})-f(x_{k-1})}f(x_{k}).\n    $$\n    \n    Prove that if $x_{0}$ is sufficiently close to $x_{*}$, then $x_{k}\\rightarrow x_{*}$ and\n    \n    $$\n    \\lim_{k\\rightarrow\\infty}\\frac{x_{k+1}-x_{*}}{(x_{k}-x_{*})(x_{k-1}-x_{*})}=\\frac{f^{\\prime\\prime}(x_{*})}{2f^{\\prime}(x_{*})}.\n    $$\n!!! proof \"证明\"\n    $(i)$：对 $f(x_*)$ 在 $x_k$ 处作 Taylor 展开，得到\n\n    $$\n    0=f(x_*) = f(x_k) + f'(x_k)(x_* - x_k) + \\frac{f''(\\xi_k)}{2}(x_* - x_k)^2=f(x_k)-f'(x_k)e_k+\\frac{f''(\\xi_k)}{2}e_k^2\n    $$\n\n    另一方面我们有\n\n    $$\n    e_{k+1}=e_k-\\frac{f(x_k)}{f'(x_k)}=e_k-\\frac{f'(x_k)e_k-\\frac{f''(\\xi_k)}{2}e_k^2}{f'(x_k)}=\\frac{f''(\\xi_k)}{2f'(x_k)}e_k^2\n    $$\n\n    即\n\n    $$\n    \\frac{e_{k+1}}{e_k^2}=\\frac{f''(\\xi_k)}{2f'(x_k)}\n    $$\n\n    在 $x^*$ 足够小的邻域内，$|\\frac{f''(x)}{2f'(y)}|$ 有上界 $M$。此时只需 $|e_0|<\\frac{1}{M}$ 即可保证 $|e_k|$ 平方收敛到 0，从而 $x_k$ 收敛到 $x^*$。进而\n\n    $$\n    \\lim_{k\\rightarrow\\infty}\\frac{e_{k+1}}{e_k^2}=\\frac{f''(x_*)}{2f'(x_*)}.\n    $$\n\n    $(ii)$：\n    $$\n    e_{k+1}=\\frac{e_{k-1}f(x_k)-e_kf(x_{k-1})}{f(x_k)-f(x_{k-1})}.\n    $$\n\n    考虑 $H(x)=\\frac{f(x)}{x-x_*}$，则\n\n    $$\n    \\text{分子}=e_{k-1}e_k(H(x_k)-H(x_{k-1}))=e_{k-1}e_kH'(\\xi_k)(e_k-e_{k-1}),\n    $$\n\n    其中 $\\xi_k$ 在 $x_{k-1}$ 和 $x_k$ 之间，且\n\n    $$\n    H'(x)=\\frac{f'(x)(x-x_*)-f(x)}{(x-x_*)^2}\n    $$\n\n    对 $f(x_*)$ 在 $x$ 处作 Taylor 展开，得到\n\n    $$\n    0=f(x_*)=f(x)-f'(x)(x-x_*)+\\frac{f''(\\eta)}{2}(x-x_*)^2\n    $$\n\n    故：\n\n    $$\n    H'(x)=\\frac{\\frac{f''(\\eta)}{2}(x-x_*)^2}{(x-x_*)^2}=\\frac{f''(\\eta)}{2}.\n    $$\n\n    因此，在点 $\\xi_k$ 处，我们有：\n    \n    $$\n    H'(\\xi_k) = \\frac{1}{2}f''(\\eta_k)\n    $$\n    \n    此时 $\\eta_k$ 严格介于 $\\xi_k$ 和 $x_*$ 之间。对分母直接应用拉格朗日中值定理：\n    \n    $$\n    f(x_k) - f(x_{k-1}) = f'(\\gamma_k)(x_k - x_{k-1})\n    $$\n    \n    其中 $\\gamma_k$ 严格介于 $x_k$ 和 $x_{k-1}$ 之间。带回原式得到\n\n    $$\n    e_{k+1} = e_k e_{k-1} \\frac{f''(\\eta_k)}{2 f'(\\gamma_k)}\n    $$\n\n    因为 $f \\in C^2$ 且 $f'(x_*) \\ne 0$，在 $x_*$ 的足够小的邻域内，有 $\\left| \\frac{f''(\\eta)}{2f'(\\gamma)} \\right| \\le C$。进而：\n\n    $$\n    |e_{k+1}| \\le C |e_k| |e_{k-1}|\n    $$\n\n    同样取 $|e_0| ,|e_1|<\\frac{1}{C}$ 即可保证 $|e_k|$ 超线性收敛到 0，从而 $x_k$ 收敛到 $x^*$。进而\n\n    $$\n    \\lim_{k\\rightarrow\\infty}\\frac{e_{k+1}}{e_k e_{k-1}}=\\frac{f''(x_*)}{2f'(x_*)}.\n    $$\n\n!!! problem \"Autumn, 2023\"\n    If $p$ is a polynomial of", "has_pdf": false}, {"title": "练习题集", "url": "/blog/applied-math/applied-math-exam/exercise-collection/", "preview": "- 函数逼近与插值练习题", "date": "2026-01-07", "words": 116, "categories": ["应用数学", "应用数学博资考"], "tags": ["applied-math", "applied-math-exam"], "content": "练习题集 --- <div class=\"grid cards\" markdown - 函数逼近与插值练习题 --- :octicons-arrow-right-24: 阅读章节 - 数值代数练习题 --- :octicons-arrow-right-24: 阅读章节 - 数值ODE练习题 --- :octicons-arrow-right-24: 阅读章节 - 数值PDE练习题 --- :octicons-arrow-right-24: 阅读章节 - 数值积分练习题 --- :octicons-arrow-right-24: 阅读章节 - 凸优化练习题 --- :octicons-arrow-right-24: 阅读章节 - 渐进分析练习题 --- :octicons-arrow-right-24: 阅读章节 </div", "source": "# 练习题集\n---\n\n<div class=\"grid cards\" markdown>\n\n-   **函数逼近与插值练习题**\n\n    ---\n    \n\n    [:octicons-arrow-right-24: 阅读章节](approximation-interpolation-exercises.md)\n\n\n-   **数值代数练习题**\n\n    ---\n    \n\n    [:octicons-arrow-right-24: 阅读章节](numerical-algebra-exercises.md)\n\n-   **数值ODE练习题** \n\n    ---\n    \n    [:octicons-arrow-right-24: 阅读章节](numerical-ode-exercises.md)\n\n-   **数值PDE练习题**\n   \n    ---\n    \n
