 the interval $[0, 1]$)? What is the maximum degree of precision expected to be if all coefficients and nodes $x_k$ are allowed to be freely chosen?\n    \n    (ii) Show that for the maximum degree of precision to be achieved, it is necessary that $\\{x_k\\}$ are the zeros of the polynomial $\\pi_n$ of degree $n$ which is orthogonal on $[0, 1]$ with respect to the weight function $w(x) = x^2(1-x)$.\n    \n    (iii) Show that the choice of the $x_k$ in (ii) together with the requirement of the quadrature formula to be Hermite-interpolatory is sufficient for the maximum degree of precision to be attained.\n\n!!! proof \"证明\"\n    $(i)$：$n+3$ 个条件故对任意次数不超过 $n+2$ 的多项式 $f$，公式都能精确计算出积分值，因此精度至少为 $n+2$。再算上 $x_k$ 的 $n$ 个自由度，最高精度为 $2n+2$。\n\n    $(ii)$：设 $\\pi_n=\\prod_{k=1}^n (x-x_k)$，任取不超过 $n-1$ 次的多项式 $q(x)$，构造测试多项式 $f(x)=x^2(1-x)q(x)\\pi_n(x)$，则 $\\deg(f)=n+3+\\deg(q)\\le 2n+2$。我们需要 $\\int_0^1 f(x)dx=Q[f]=a_0f(0)+a_1f'(0)+\\sum_{k=1}^n w_k f(x_k)+b_0f(1)=0$，即 $\\int_0^1 x^2(1-x)q(x)\\pi_n(x)dx=0$ 对任意的次数不超过 $n-1$ 的多项式 $q$ 都成立，因此 $\\pi_n$ 是 $w(x)=x^2(1-x)$ 的正交多项式。\n\n    $(iii)$ 将 $f$ 对 $\\pi_n(x)x^2(1-x)$ 作带余除法即可。\n\n!!! problem \"2012 Individual\"\n    **Problem 1.** An numerical integration formula is given by\n\n    $$\n    \\int_{-1}^{1} f(x) \\, dx \\approx a f(-1) + b f(c),\n    $$\n\n    where $a$, $b$, and $c$ ", "has_pdf": false}, {"title": "统计力学复习笔记", "url": "/blog/physics/statistical-mechanics/", "preview": "微正则系综 (Microcanonical Ensemble, E.V.N) 系统孤立，能量  \\(E\\)  、体积  \\(V\\)  、粒子数  \\(N\\)  固定。 玻尔兹曼熵公式 ：", "date": "2026-01-01", "words": 1707, "categories": ["物理"], "tags": ["physics", "statistical-mechanics"], "content": "统计力学复习笔记 1. 三大系综与基本原理 (Ensembles & Fundamentals) 1.1 系综分类 根据系统与环境的交换量（能量 $E$、粒子数 $N$），定义三种主要系综： 微正则系综 (Microcanonical Ensemble, E.V.N) 系统孤立，能量 $E$、体积 $V$、粒子数 $N$ 固定。 玻尔兹曼熵公式 ： $$S = k B \\ln \\Omega(N, E, V)$$ 其中 $\\Omega$ 为微观状态数。 正则系综 (Canonical Ensemble, T.V.N) 系统与热库交换能量，温度 $T$ 固定。 概率分布：$p n \\propto e^ -\\beta E n $。 巨正则系综 (Grand Canonical Ensemble, T.V. $\\mu$) 系统与环境交换能量和粒子，温度 $T$ 和化学势 $\\mu$ 固定。 巨配分函数 ： $$\\Xi = \\sum N \\sum n e^ -\\beta (E n - \\mu N) $$ 这里 $\\beta \\equiv \\frac 1 k B T $。 1.2 熵与热力学关系 Gibbs 熵公式 ： $$S = -k B \\sum p(n) \\ln p(n)$$ 热力学基本方程 ： $$dE = TdS - p dV + \\mu dN$$ 偏导数关系 （由 $S$ 全微分给出）： $$ \\begin cases \\frac 1 T = \\left(\\frac \\partial S \\partial E \\right) V, N \\\\ \\frac p T = \\left(\\frac \\partial S \\partial V \\right) E, N \\\\ -\\frac \\mu T = \\left(\\frac \\partial S \\partial N \\right) E, V \\end cases $$ --- 2. 正则系综 (Canonical Ensemble) 2.1 配分函数与热力学量 核心在于计算配分函数 $Z$： $$Z = \\sum n e^ -\\beta E n $$ 自由能 (Helmholtz Free Energy) : $$F = E - TS = -k B T \\ln Z = -\\frac 1 \\beta \\ln Z$$ $$dF = -S dT - p dV + \\mu dN$$ 内能 (平均能量) : $$\\langle E \\rangle = -\\frac \\partial \\partial \\beta \\ln Z$$ 热容 : $$C V = \\frac \\partial \\langle E \\rangle \\partial T $$ 能量涨落 : $$\\Delta E^2 = \\langle E^2 \\rangl", "source": "# 统计力学复习笔记\n\n## 1. 三大系综与基本原理 (Ensembles & Fundamentals)\n\n### 1.1 系综分类\n根据系统与环境的交换量（能量 $E$、粒子数 $N$），定义三种主要系综：\n\n* **微正则系综 (Microcanonical Ensemble, E.V.N)**\n    * 系统孤立，能量 $E$、体积 $V$、粒子数 $N$ 固定。\n    * **玻尔兹曼熵公式**：\n  \n        $$S = k_B \\ln \\Omega(N, E, V)$$\n\n        其中 $\\Omega$ 为微观状态数。\n\n* **正则系综 (Canonical Ensemble, T.V.N)**\n    * 系统与热库交换能量，温度 $T$ 固定。\n    * 概率分布：$p_n \\propto e^{-\\beta E_n}$。\n\n* **巨正则系综 (Grand Canonical Ensemble, T.V. $\\mu$)**\n    * 系统与环境交换能量和粒子，温度 $T$ 和化学势 $\\mu$ 固定。\n    * **巨配分函数** ：\n  \n        $$\\Xi = \\sum_{N} \\sum_{n} e^{-\\beta (E_n - \\mu N)}$$\n\n         这里 $\\beta \\equiv \\frac{1}{k_B T}$。\n\n### 1.2 熵与热力学关系\n* **Gibbs 熵公式**：\n    \n    $$S = -k_B \\sum p(n) \\ln p(n)$$\n\n* **热力学基本方程**：\n    \n    $$dE = TdS - p dV + \\mu dN$$\n\n* **偏导数关系**（由 $S$ 全微分给出）：\n    \n    $$\n    \\begin{cases}\n    \\frac{1}{T} = \\left(\\frac{\\partial S}{\\partial E}\\right)_{V, N} \\\\\n    \\frac{p}{T} = \\left(\\frac{\\partial S}{\\partial V}\\right)_{E, N} \\\\\n    -\\frac{\\mu}{T} = \\left(\\frac{\\partial S}{\\partial N}\\right)_{E, V}\n    \\end{cases}\n    $$\n\n---\n\n## 2. 正则系综 (Canonical Ensemble)\n\n### 2.1 配分函数与热力学量\n核心在于计算配分函数 $Z$：\n\n$$Z = \\sum_n e^{-\\beta E_n}$$\n\n* **自由能 (Helmholtz Free Energy)**:\n    \n    $$F = E - TS = -k_B T \\ln Z = -\\frac{1}{\\beta} \\ln Z$$\n    \n    $$dF = -S dT - p dV + \\mu dN$$\n\n* **内能 (平均能量)**:\n    \n    $$\\langle E \\rangle = -\\frac{\\partial}{\\partial \\beta} \\ln Z$$\n\n* **热容**:\n    \n    $$C_V = \\frac{\\partial \\langle E \\rangle}{\\partial T}$$\n\n* **能量涨落**:\n    \n    $$\\Delta E^2 = \\langle E^2 \\rangle - \\langle E \\rangle^2 = \\frac{\\partial^2}{\\partial \\beta^2} \\ln Z$$\n\n    相对涨落 $\\frac{\\Delta E}{E} \\sim \\frac{1}{\\sqrt{N}}$，说明宏观系统能量极其确定。\n\n### 2.2 经典理想气体应用\n对于 $N$ 个不可分辨粒子：\n\n$$Z_{ideal} = \\frac{1}{N!} (Z_1)^N = \\frac{V^N}{N! \\lambda^{3N}}$$\n\n其中热波长 $\\lambda = \\sqrt{\\frac{2\\pi \\hbar^2}{m k_B T}}$。\n\n* **压强**: $p = -\\frac{\\partial F}{\\partial V} = \\frac{N k_B T}{V} \\Rightarrow pV = N k_B T$。\n* **内能**: $\\langle E \\rangle = \\frac{3}{2} N k_B T$。\n* **Sackur-Tetrode 熵公式**:\n    \n    $$S = -\\frac{\\partial F}{\\partial T} = N k_B \\left[ \\ln \\left( \\frac{V}{N \\lambda^3} \\right) + \\frac{5}{2} \\right]$$\n\n---\n\n## 3. 巨正则系综 (Grand Canonical Ensemble)\n\n### 3.1 巨配分函数与巨热力学势\n巨配分函数 $\\Xi$ 将不同粒子数 $N$ 的正则配分函数加权求和：\n\n$$\\Xi(\\mu, V, T) = \\sum_{N=0}^{\\infty} e^{\\beta \\mu N} Z(N, V, T)$$\n\n* **巨热力学势 (Grand Potential, $\\Phi$)**:\n    \n    $$\\Phi = F - \\mu N = -k_B T \\ln \\Xi$$\n    \n    $$d\\Phi = -S dT - p dV - N d\\mu$$\n    \n    由此可得压强关系：$\\Phi = -pV$ (即 $pV = k_B T \\ln \\Xi$)。\n\n### 3.2 理想气体的巨正则处理\n利用理想气体的 $Z_{ideal}$ 代入求和：\n\n$$\\Xi = \\sum_{N=0}^{\\infty} e^{\\beta \\mu N} \\frac{V^N}{N! \\lambda^{3N}} = \\sum_{N=0}^{\\infty} \\frac{1}{N!} \\left( \\frac{e^{\\beta \\mu} V}{\\lambda^3} \\right)^N = \\exp \\left( \\frac{e^{\\beta \\mu} V}{\\lambda^3} \\right)$$\n\n* **推导粒子数**:\n    \n    $$\\langle N \\rangle = -\\frac{\\partial \\Phi}{\\partial \\mu} = \\frac{1}{\\beta} \\frac{\\partial \\ln \\Xi}{\\partial \\mu} = \\frac{e^{\\beta \\mu} V}{\\lambda^3}$$\n\n* **化学势**:\n    \n    $$\\mu = k_B T \\ln \\left( \\frac{\\lambda^3 N}{V} \\right)$$\n\n* **粒子数涨落**:\n    \n    $$\\Delta N^", "has_pdf": false}, {"title": "大作业", "url": "/blog/applied-math/data-science/final-project/", "preview": "暂无预览", "date": "2025-12-30", "words": 25, "categories": ["应用数学", "数据科学专题"], "tags": ["applied-math", "data-science"], "content": "<div style=\"height: 800px; width: 100%;\" <embed src=\"../../../assets/sos-hypercon.pdf\" type=\"application/pdf\" width=\"100%\" height=\"100%\" </div 点击下载 PDF 完整版 .md-button <div style=\"height: 800px; width: 100%;\" <embed src=\"../../../assets/sos-hypercon-tex.pdf\" type=\"application/pdf\" width=\"100%\" height=\"100%\" </div 点击下载 PDF 完整版 .md-button", "source": "<div style=\"height: 800px; width: 100%;\">\n    <embed src=\"../../../assets/sos-hypercon.pdf\" type=\"application/pdf\" width=\"100%\" height=\"100%\">\n</div>\n\n[点击下载 PDF 完整版](../../../assets/sos-hypercon.pdf){ .md-button }\n<div style=\"height: 800px; width: 100%;\">\n    <embed src=\"../../../assets/sos-hypercon-tex.pdf\" type=\"application/pdf\" width=\"100%\" height=\"100%\">\n</div>\n\n[点击下载 PDF 完整版](../../../assets/sos-hypercon-tex.pdf){ .md-button }", "has_pdf": true}, {"title": "大作业", "url": "/blog/applied-math/convex-optimization/final-project/", "preview": "暂无预览", "date": "2025-12-24", "words": 13, "categories": ["应用数学", "凸优化"], "tags": ["applied-math", "convex-optimization"], "content": "<div style=\"height: 800px; width: 100%;\" <embed src=\"../../../assets/numerical-pde-project.pdf\" type=\"application/pdf\" width=\"100%\" height=\"100%\" </div 点击下载 PDF 完整版 .md-button", "source": "<div style=\"height: 800px; width: 100%;\">\n    <embed src=\"../../../assets/numerical-pde-project.pdf\" type=\"application/pdf\" width=\"100%\" height=\"100%\">\n</div>\n\n[点击下载 PDF 完整版](../../../assets/numerical-pde-project.pdf){ .md-button }", "has_pdf": true}, {"title": "习题 2", "url": "/blog/applied-math/numerical-pde/exercise2/", "preview": "试引入适当的无量纲的空间和时间变量，将一维有限区域上均匀介质中无源热流运动在齐次 Dirichlet 边界条件下的初边值问题化为定义在  \\((0,1) \\times \\mathbb{R}_+\\)  上的标准形式的模型问题  \\((2.2.1) \\sim (2.2.3)\\)  。", "date": "2025-12-23", "words": 2229, "categories": ["应用数学", "PDE 数值解"], "tags": ["applied-math", "numerical-pde"], "content": "习题 2 试引入适当的无量纲的空间和时间变量，将一维有限区域上均匀介质中无源热流运动在齐次 Dirichlet 边界条件下的初边值问题化为定义在 $(0,1) \\times \\mathbb R +$ 上的标准形式的模型问题 $(2.2.1) \\sim (2.2.3)$。 控制方程为 $\\frac \\partial U \\partial T = a^2 \\frac \\partial^2 U \\partial X^2 $。边值 $U(0, T) = U(L, T) = 0$ 以及 $U(X, 0) = \\phi(X)$。 设 $x = X/L$，$t = T/T 0$，其中 $T 0$ 待定。令 $u(x, t) = U(X, T)/U 0$，$U 0$ 为特征温度常量。代入得 $$\\frac \\partial u \\partial t = \\left( \\frac a^2 T 0 L^2 \\right) \\frac \\partial^2 u \\partial x^2 = \\frac \\partial^2 u \\partial x^2 $$ 这里取 $T 0 = \\frac L^2 a^2 $。 边值 $u(0, t) = 0$ 和 $u(1, t) = 0$。对于初始条件，当 $T=0$ 时 $t=0$，代入变换关系得 $U 0 u(x, 0) = \\phi(Lx)$，记无量纲初始函数为 $u^0(x) = \\frac 1 U 0 \\phi(Lx)$。原初边值问题被转化为如下标准形式的模型问题： $$ \\begin cases \\frac \\partial u \\partial t = \\frac \\partial^2 u \\partial x^2 , & 0 < x < 1, \\ t 0 \\\\ u(0, t) = 0, \\quad u(1, t) = 0, & t \\geqslant 0 \\\\ u(x, 0) = u^0(x), & 0 \\leqslant x \\leqslant 1 \\end cases $$ 将上题中的无源热流运动换为有源热流运动，并将边界条件换为第三类边界条件，试给出相应的初边值问题，并引入适当的无量纲的空间和时间变量，将其化为定义在 $(0,1) \\times \\mathbb R +$ 上的标准形式的模型问题 $(2.2.1) \\sim (2.2.3)$。 控制方程为 $ \\frac \\partial U \\partial T = a^2 \\frac \\partial^2 U \\partial X^2 + F(X, T)$。边界条件为 $- \\frac \\partial U \\partial X (0, T) + \\sigma 0 U(0, T) = g 0(T)$，$\\frac \\partial U \\partial X (L, T", "source": "# 习题 2\n\n!!! problem \"1.\"\n    试引入适当的无量纲的空间和时间变量，将一维有限区域上均匀介质中无源热流运动在齐次 Dirichlet 边界条件下的初边值问题化为定义在 $(0,1) \\times \\mathbb{R}_+$ 上的标准形式的模型问题 $(2.2.1) \\sim (2.2.3)$。\n\n!!! proof \"证明\"\n    控制方程为 $\\frac{\\partial U}{\\partial T} = a^2 \\frac{\\partial^2 U}{\\partial X^2}$。边值 $U(0, T) = U(L, T) = 0$ 以及 $U(X, 0) = \\phi(X)$。\n\n    设 $x = X/L$，$t = T/T_0$，其中 $T_0$ 待定。令 $u(x, t) = U(X, T)/U_0$，$U_0$ 为特征温度常量。代入得 \n    \n    $$\\frac{\\partial u}{\\partial t} = \\left( \\frac{a^2 T_0}{L^2} \\right) \\frac{\\partial^2 u}{\\partial x^2}=  \\frac{\\partial^2 u}{\\partial x^2}$$\n    \n    这里取 $T_0 = \\frac{L^2}{a^2}$。\n\n    边值 $u(0, t) = 0$ 和 $u(1, t) = 0$。对于初始条件，当 $T=0$ 时 $t=0$，代入变换关系得 $U_0 u(x, 0) = \\phi(Lx)$，记无量纲初始函数为 $u^0(x) = \\frac{1}{U_0}\\phi(Lx)$。原初边值问题被转化为如下标准形式的模型问题：\n    \n    $$\n    \\begin{cases}\n    \\frac{\\partial u}{\\partial t} = \\frac{\\partial^2 u}{\\partial x^2}, & 0 < x < 1, \\ t > 0 \\\\\n    u(0, t) = 0, \\quad u(1, t) = 0, & t \\geqslant 0 \\\\\n    u(x, 0) = u^0(x), & 0 \\leqslant x \\leqslant 1\n    \\end{cases}\n    $$\n\n\n!!! problem \"2.\"\n    将上题中的无源热流运动换为有源热流运动，并将边界条件换为第三类边界条件，试给出相应的初边值问题，并引入适当的无量纲的空间和时间变量，将其化为定义在 $(0,1) \\times \\mathbb{R}_+$ 上的标准形式的模型问题 $(2.2.1) \\sim (2.2.3)$。\n\n!!! proof \"证明\"\n    控制方程为 $ \\frac{\\partial U}{\\partial T} = a^2 \\frac{\\partial^2 U}{\\partial X^2} + F(X, T)$。边界条件为 $- \\frac{\\partial U}{\\partial X}(0, T) + \\sigma_0 U(0, T) = g_0(T)$，$\\frac{\\partial U}{\\partial X}(L, T) + \\sigma_L U(L, T) = g_L(T)$。初始条件为 $U(X, 0) = \\phi(X)$。\n\n    设 $x = X/L$ 和 $t = T/T_0$，令 $u(x, t) = U(X, T)/U_0$，其中 $U_0$ 为特征温度常量，$T_0$ 为待定时间尺度。带入得\n    \n    $$\\frac{\\partial u}{\\partial t} = \\left( \\frac{a^2 T_0}{L^2} \\right) \\frac{\\partial^2 u}{\\partial x^2} + \\frac{T_0}{U_0} F(Lx, T_0 t)=u_{xx} + f(x,t)$$\n    \n    这里取 $T_0 = \\frac{L^2}{a^2}$，$f(x,t) = \\frac{L^2}{a^2 U_0} F(Lx, \\frac{L^2}{a^2}t)$。\n\n    边值 $-\\frac{\\partial u}{\\partial x} + (\\sigma_0 L) u = \\frac{L}{U_0} g_0(T_0 t)$，$\\frac{\\partial u}{\\partial x} + (\\sigma_L L) u = \\frac{L}{U_0} g_L(T_0 t)$。记 $p_0 = \\sigma_0 L, p_1 = \\sigma_L L$，$q_0(t) = \\frac{L}{U_0} g_0(T_0 t), q_1(t) = \\frac{L}{U_0} g_L(T_0 t)$。初始直接代入得 $u(x, 0) = \\frac{1}{U_0}\\phi(Lx)$，记为 $u^0(x)$。原问题被转化为定义在 $(0,1) \\times \\mathbb{R}_+$ 上的标准形式的模型问题：\n\n    $$\n    \\begin{cases}\n    \\frac{\\partial u}{\\partial t} = \\frac{\\partial^2 u}{\\partial x^2} + f(x,t), & 0 < x < 1, \\ t > 0 \\\\\n    -\\frac{\\partial u}{\\partial x} + p_0 u = q_0(t), & x = 0, \\ t \\geqslant 0 \\\\\n    \\frac{\\partial u}{\\partial x} + p_1 u = q_1(t), & x = 1, \\ t \\geqslant 0 \\\\\n    u(x, 0) = u^0(x), & 0 \\leqslant x \\leqslant 1\n    \\end{cases}\n    $$\n\n!!! problem \"3.\"\n    设模型问题的真解 $u$ 是 $[0,1] \\times \\mathbb{R}_+$ 上的连续函数，试证明：对任给的 $t_{\\max} > 0$，差分解在 $\\mathbb{L}^\\infty((0,1) \\times (0, t_{\\max}))$ 范数意义下的收敛性等价于\n\n    $$\n    \\|e\\|_{\\infty, \\Omega_{t_{\\max}}} = \\max_{0 \\leqslant m \\leqslant t_{\\max}/\\tau} \\max_{0 \\leqslant j \\leqslant 1/h} |e_j^m| \\to 0, \\quad \\text{当} \\quad h, \\tau \\to 0,\n    $$\n\n!!! proof \"证明\"\n    我们需要证明 $\\lim_{h,\\tau \\to 0} \\|u - \\tilde{U}_{h,\\tau}\\|_{L^\\infty(\\bar{D})} = 0$ 等价于离散误差范数 $\\|e\\|_{\\infty, \\Omeg", "has_pdf": false}, {"title": "习题 1", "url": "/blog/applied-math/numerical-pde/exercise1/", "preview": "设  \\(\\Omega\\)  是一个  \\(\\mathbb{R}^n\\)  中具有 Lipschitz 连续边界的有界开集，  \\(\\partial \\Omega_D\\)  对应 Dirichlet 边界。在  \\(\\Omega\\)  上定义网格，若最大步长  \\(h_{max}\\)  与最小步长  \\(h_{min}\\)  满足  \\(\\frac{h_{max}}{h_{min}}\\le C\\)  ，则称该网格为拟一致网格。特别的若网格为均匀网格，则称该网格为一致网格。", "date": "2025-12-17", "words": 1313, "categories": ["应用数学", "PDE 数值解"], "tags": ["applied-math", "numerical-pde"], "content": "习题 1 设 $\\Omega$ 是一个 $\\mathbb R ^n$ 中具有 Lipschitz 连续边界的有界开集，$\\partial \\Omega D$ 对应 Dirichlet 边界。在 $\\Omega$ 上定义网格，若最大步长 $h max $ 与最小步长 $h min $ 满足 $\\frac h max h min \\le C$，则称该网格为拟一致网格。特别的若网格为均匀网格，则称该网格为一致网格。 定义多重指标集： $$ J=\\ j=(j 1,j 2,\\cdots,j n) x=x j = (j 1h 1, j 2h 2, \\cdots, j nh n)\\in \\bar \\Omega \\ , $$ 称之为 $\\bar \\Omega $ 上的网格节点指标集。网格函数 $U$ 定义为 $J$ 上的函数族 $\\ U j\\ j\\in J $。令 $$ \\omega j=\\ x\\in \\Omega x=(x 1,x 2,\\cdots,x n), (j k -\\tfrac 1 2 )h k < x k < (j k + \\tfrac 1 2 )h k, k=1,2,\\cdots,n\\ , $$ 称之为网格节点 $j$ 的控制体，其测度记作 $V j$。定义网格函数 $U$ 的 $L^p$ 范数($p\\in 1,\\infty)$) 为 $$ U L^p = \\left(\\sum j\\in J V j U j ^p\\right)^ 1/p , $$ 证明：对最大步长为 $h$ 的拟一致网格序列，定义的网格函数的 $L^p$ 范数($p\\in 1,\\infty)$) 满足 $ \\cdot L^p \\sim h^ n/p \\cdot l^p $，即存在常数 $c,C$ 使得定义在该网格上的任意网格函数 $U$，都有 $$ c h^ n/p \\left(\\sum j\\in J U j ^p\\right)^ 1/p \\le \\left(\\sum j\\in J V j U j ^p\\right)^ 1/p \\le C h^ n/p \\left(\\sum j\\in J U j ^p\\right)^ 1/p , $$ 其中 $V j$ 是网格节点 $j$ 的控制体的测度 ??? proof \"解：\" 由于网格为拟一致网格，存在常数 $C 1,C 2$ 使得对任意 $j\\in J$，都有 $$ C 1 h^n \\le V j \\le C 2 h^n. $$ 因此对任意网格函数 $U$，都有 $$ \\sum j\\in J V j U j ^p \\le C 2 h^n \\sum j\\in J U j ^p, $$ 以及 $$ \\sum j\\in J V j U j ^p \\ge C 1 h^n \\sum j\\in J U j ^p. $$ 取 $p$ 次方根即得所需不等式。 证明：", "source": "# 习题 1\n\n!!! definition \"网格、网格函数及其范数\"\n    设 $\\Omega$ 是一个 $\\mathbb{R}^n$ 中具有 Lipschitz 连续边界的有界开集，$\\partial \\Omega_D$ 对应 Dirichlet 边界。在 $\\Omega$ 上定义网格，若最大步长 $h_{max}$ 与最小步长 $h_{min}$ 满足 $\\frac{h_{max}}{h_{min}}\\le C$，则称该网格为拟一致网格。特别的若网格为均匀网格，则称该网格为一致网格。\n\n    定义多重指标集：\n\n    $$\n    J=\\{j=(j_1,j_2,\\cdots,j_n)| x=x_j = (j_1h_1, j_2h_2, \\cdots, j_nh_n)\\in \\bar{\\Omega}\\},\n    $$\n\n    称之为 $\\bar{\\Omega}$ 上的网格节点指标集。网格函数 $U$ 定义为 $J$ 上的函数族 $\\{U_j\\}_{j\\in J}$。令\n\n    $$\n    \\omega_j=\\{x\\in \\Omega| x=(x_1,x_2,\\cdots,x_n), (j_k -\\tfrac{1}{2})h_k < x_k < (j_k + \\tfrac{1}{2})h_k, k=1,2,\\cdots,n\\},\n    $$\n    \n    称之为网格节点 $j$ 的控制体，其测度记作 $V_j$。定义网格函数 $U$ 的 $L^p$ 范数($p\\in [1,\\infty)$) 为\n\n    $$\n    ||U||_{L^p} = \\left(\\sum_{j\\in J} V_j |U_j|^p\\right)^{1/p},\n    $$\n\n!!! problem \"1.\"\n    证明：对最大步长为 $h$ 的拟一致网格序列，定义的网格函数的 $L^p$ 范数($p\\in [1,\\infty)$) 满足 $||\\cdot ||_{L^p} \\sim h^{n/p}||\\cdot ||_{l^p}$，即存在常数 $c,C$ 使得定义在该网格上的任意网格函数 $U$，都有\n    \n    $$ c h^{n/p} \\left(\\sum_{j\\in J} |U_j|^p\\right)^{1/p}\\le \\left(\\sum_{j\\in J} V_j|U_j|^p\\right)^{1/p} \\le C h^{n/p} \\left(\\sum_{j\\in J} |U_j|^p\\right)^{1/p}, $$\n\n    其中 $V_j$ 是网格节点 $j$ 的控制体的测度\n\n??? proof \"解：\"\n    由于网格为拟一致网格，存在常数 $C_1,C_2$ 使得对任意 $j\\in J$，都有\n\n    $$\n    C_1 h^n \\le V_j \\le C_2 h^n.\n    $$\n\n    因此对任意网格函数 $U$，都有\n\n    $$\n    \\sum_{j\\in J} V_j |U_j|^p \\le C_2 h^n \\sum_{j\\in J} |U_j|^p,\n    $$\n\n    以及\n\n    $$\n    \\sum_{j\\in J} V_j |U_j|^p \\ge C_1 h^n \\sum_{j\\in J} |U_j|^p.\n    $$\n\n    取 $p$ 次方根即得所需不等式。\n\n!!! problem \"2.\"\n    证明：对拟一致网格序列，定义的网格函数的 $L^p$ 范数诱导的相应矩阵范数满足 $||\\cdot ||_{L^p} \\sim ||\\cdot ||_{l^p}$，即存在常数 $c,C$ (其中 $0 < c \\leqslant C$)，使得对定义在该网格序列中任一网格函数空间上的线性变换 $A$，都有\n\n    $$\n    c||A||_{l^p} \\leqslant ||A||_{L^p} \\leqslant C||A||_{l^p},\n    $$\n\n    其中 $||A||_{l^p}$ 是由向量范数 $||\\cdot ||_{l^p}$ 诱导的矩阵范数。\n\n??? proof \"解：\"\n    由习题 1 可知，存在常数 $c_1,C_1$ 使得对定义在该网格上的任意网格函数 $U$，都有\n\n    $$\n    c_1 ||U||_{l^p} \\leqslant ||U||_{L^p} \\leqslant C_1 ||U||_{l^p}.\n    $$\n\n    因此对定义在该网格上的任意线性变换 $A$ 和任意非零网格函数 $U$，都有\n\n    $$\n    \\frac{||AU||_{L^p}}{||U||_{L^p}} \\leqslant \\frac{C_1 ||AU||_{l^p}}{c_1 ||U||_{l^p}}.\n    $$\n\n    对上式左端取上确界，并对右端取下确界，即得\n\n    $$\n    ||A||_{L^p} \\leqslant \\frac{C_1}{c_1} ||A||_{l^p}.\n    $$\n\n    同理可得\n\n    $$\n    ||A||_{L^p} \\geqslant \\frac{c_1}{C_1} ||A||_{l^p}.\n    $$\n\n    综上所述，取 $c = \\frac{c_1}{C_1}, C = \\frac{C_1}{c_1}$ 即得所需不等式。\n\n!!! definition \"一些差分\"\n    考虑 $\\Omega\\subset \\mathbb{R}^2$ 上的定常对流扩散方程\n\n    $$\n    -\\nabla \\cdot (a(x,y) \\nabla u(x,y)) +\\nabla \\cdot (u(x,y)v(x,y)) = f(x,y), \\quad \\forall(x,y)\\in \\Omega,\n    $$\n\n    其中 $v(x,y)=(v^1,v^2)$。在步长为 $h_x=\\Delta x, h_y=\\Delta y$ 的网格上对二阶和一阶微商作以下替换：\n\n    $$\n    \\begin{aligned}\n    [(au_x)_x]_{i,j} &\\approx \\frac{1}{h_x} \\left( a_{i+\\frac{1}{2},j} \\frac{U_{i+1,j}-U_{i,j}}{h_x} - a_{i-\\frac{1}{2},j} \\frac{U_{i,j}-U_{i-1,j}}{h_x} \\right), \\\\\n    [(au_y)_y]_{i,j} &\\approx \\frac{1}{h_y} \\left( a_{i,j+\\frac{1}{2}} \\frac{U_{i,j+1}-U_{i,j}}{h_y} - a_{i,j-\\frac{1}{2}} \\frac{U_{i,j}-U_{i,j-1}}{h_y} \\right), \\\\\n    [2(uv^1)_x]_{i,j} &\\approx \\frac{1}{h_x} \\left((uv^1)_{i+1,j}-(uv^", "has_pdf": false}, {"title": "Numerical Linear Algebra", "url": "/blog/applied-math/applied-math-exam/numerical-linear-algebra/", "preview": "1. Metric (度量)  \\(d(x, y)\\)  : 定义集合上的距离。映射  \\(d: X \\times X \\to \\mathbb{R}_{\\ge 0}\\)  满足：  \\(d(x, y) \\ge 0\\)  且  \\(d(x, y) = 0 \\iff x = y\\)  (非负性 &amp; 唯一性)  \\(d(x, y) = d(y, x)\\)  (对称性)  \\(d(x, z) \\le d(x, y) + d(y, z)\\)  (三角不等式)", "date": "2025-12-11", "words": 1731, "categories": ["应用数学", "应用数学博资考"], "tags": ["applied-math", "applied-math-exam", "numerical-linear-algebra"], "content": "Numerical Linear Algebra --- Chapter 1: Norms & Metrics Theory 1.1 The Hierarchy of Spaces 我们在向量空间 $V$ 上定义以下结构： 1. Metric (度量) $d(x, y)$: 定义集合上的距离。映射 $d: X \\times X \\to \\mathbb R \\ge 0 $ 满足： $d(x, y) \\ge 0$ 且 $d(x, y) = 0 \\iff x = y$ (非负性 & 唯一性) $d(x, y) = d(y, x)$ (对称性) $d(x, z) \\le d(x, y) + d(y, z)$ (三角不等式) 2. Norm (范数) $\\ x\\ $: 定义向量的长度。映射 $\\ \\cdot\\ : V \\to \\mathbb R \\ge 0 $ 满足： $\\ x\\ = 0 \\iff x = 0$ $\\ \\alpha x\\ = \\alpha \\ x\\ $ (齐次性) $\\ x + y\\ \\le \\ x\\ + \\ y\\ $ (三角不等式) 3. Inner Product (内积) $\\langle x, y \\rangle$: 定义角度和正交性。 Logic Reconstruction: Inner product $\\xrightarrow \\text induces $ Norm $\\xrightarrow \\text induces $ Metric 。 由内积导出范数：$\\ x\\ = \\sqrt \\langle x, x \\rangle $ 由范数导出度量：$d(x, y) = \\ x - y\\ $ 1.2 Matrix Norms 对于矩阵 $A \\in \\mathbb C ^ m \\times n $，我们关注两类范数： A. Induced Norms 定义为向量范数的极大值： $$\\ A\\ p = \\sup x \\ne 0 \\frac \\ Ax\\ p \\ x\\ p = \\max \\ x\\ p=1 \\ Ax\\ p$$ $\\ell 1$-norm (Column Sum): $\\ A\\ 1 = \\max j \\sum i=1 ^m a ij $ $\\ell \\infty$-norm (Row Sum): $\\ A\\ \\infty = \\max i \\sum j=1 ^n a ij $ Spectral norm ($\\ell 2$-norm): $\\ A\\ 2 = \\sigma \\max (A) = \\sqrt \\lambda \\max (A^H A) $ B. Entry-wise Norms Frobenius Norm: $$\\ A\\ F = \\left( \\sum i,j a ij ^2 \\right)^ 1/2 = \\sqrt \\", "source": "# Numerical Linear Algebra\n\n---\n\n## Chapter 1: Norms & Metrics Theory\n\n### 1.1 The Hierarchy of Spaces\n我们在向量空间 $V$ 上定义以下结构：\n\n1.  **Metric (度量) $d(x, y)$:**\n    定义集合上的距离。映射 $d: X \\times X \\to \\mathbb{R}_{\\ge 0}$ 满足：\n    * $d(x, y) \\ge 0$ 且 $d(x, y) = 0 \\iff x = y$ (非负性 & 唯一性)\n    * $d(x, y) = d(y, x)$ (对称性)\n    * $d(x, z) \\le d(x, y) + d(y, z)$ (三角不等式)\n\n2.  **Norm (范数) $\\|x\\|$:**\n    定义向量的长度。映射 $\\|\\cdot\\|: V \\to \\mathbb{R}_{\\ge 0}$ 满足：\n    * $\\|x\\| = 0 \\iff x = 0$\n    * $\\|\\alpha x\\| = |\\alpha| \\|x\\|$ (齐次性)\n    * $\\|x + y\\| \\le \\|x\\| + \\|y\\|$ (三角不等式)\n\n3.  **Inner Product (内积) $\\langle x, y \\rangle$:**\n    定义角度和正交性。\n\n> **Logic Reconstruction:**\n> **Inner product $\\xrightarrow{\\text{induces}}$ Norm $\\xrightarrow{\\text{induces}}$ Metric**。\n> \n> * 由内积导出范数：$\\|x\\| = \\sqrt{\\langle x, x \\rangle}$\n> * 由范数导出度量：$d(x, y) = \\|x - y\\|$\n\n### 1.2 Matrix Norms\n\n对于矩阵 $A \\in \\mathbb{C}^{m \\times n}$，我们关注两类范数：\n\n#### A. Induced Norms\n定义为向量范数的极大值：\n\n$$\\|A\\|_p = \\sup_{x \\ne 0} \\frac{\\|Ax\\|_p}{\\|x\\|_p} = \\max_{\\|x\\|_p=1} \\|Ax\\|_p$$\n\n* **$\\ell_1$-norm (Column Sum):** $\\|A\\|_1 = \\max_{j} \\sum_{i=1}^m |a_{ij}|$\n* **$\\ell_\\infty$-norm (Row Sum):** $\\|A\\|_\\infty = \\max_{i} \\sum_{j=1}^n |a_{ij}|$\n* **Spectral norm ($\\ell_2$-norm):** $\\|A\\|_2 = \\sigma_{\\max}(A) = \\sqrt{\\lambda_{\\max}(A^H A)}$\n\n#### B. Entry-wise Norms\n* **Frobenius Norm:**\n  \n    $$\\|A\\|_F = \\left( \\sum_{i,j} |a_{ij}|^2 \\right)^{1/2} = \\sqrt{\\text{tr}(A^H A)}$$\n\n#### C. Schatten $p$-Norms\n基于奇异值 $\\sigma(A) = (\\sigma_1, \\dots, \\sigma_{\\min(m,n)})$ 定义：\n\n$$\\|A\\|_{S_p} = \\|\\sigma(A)\\|_p = \\left( \\sum \\sigma_i^p \\right)^{1/p}$$\n\n* $p=2 \\implies$ Frobenius Norm.\n* $p=\\infty \\implies$ Spectral Norm ($=\\sigma_1$).\n* $p=1 \\implies$ Nuclear Norm (Trace Norm, $\\sum \\sigma_i$).\n\n---\n\n### 1.3 Spectral Radius & Convergence\n\n**Definition:** 矩阵 $A$ 的谱半径为 $\\rho(A) = \\max \\{|\\lambda| : \\lambda \\in \\lambda(A)\\}$。\n\n**Theorem (Gelfand's Formula):**\n\n$$\\lim_{k \\to \\infty} \\|A^k\\|^{1/k} = \\rho(A)$$\n\n**Properties & Proof Supplements:**\n\n1.  **Relation to Norm:** $\\forall \\|\\cdot\\|$ (induced norm), $\\rho(A) \\le \\|A\\|$。\n    * 设 $Ax = \\lambda x$，则 $|\\lambda| \\|x\\| = \\|\\lambda x\\| = \\|Ax\\| \\le \\|A\\| \\|x\\| \\implies |\\lambda| \\le \\|A\\|$。\n2.  **Perturbation Property:** 对任意 $\\epsilon > 0$，存在某种算子范数 $\\|\\cdot\\|_*$ 使得：\n  \n    $$\\|A\\|_* \\le \\rho(A) + \\epsilon$$\n\n3.  **Fundamental Convergence Theorem:**\n  \n    $$\\lim_{k \\to \\infty} A^k = 0 \\iff \\rho(A) < 1$$\n\n    * 这是后续所有不动点迭代法收敛的理论基石。\n\n---\n\n## Chapter 2: Matrix Factorizations\n\n在讨论迭代法之前，理解经典的三大分解是至关重要的。它们是将一般矩阵问题转化为易于求解的形式（对角、三角、正交）的核心手段。\n\n### 2.1 LU Decomposition (Gaussian Elimination)\n**Motivation:**\n求解 $Ax=b$。如果我们需要对同一个 $A$ 求解多个不同的 $b$，每次都进行完整的高斯消元 ($\\frac{2}{3}n^3$) 是极其浪费的。LU 分解将消元过程“存储”起来。\n\n**Theorem:**\n对于方阵 $A$，如果其顺序主子式均非奇异，则存在唯一的单位下三角矩阵 $L$ 和上三角矩阵 $U$，使得 $A = LU$。(若考虑数值稳定性，需引入置换矩阵 $P$，即 $PA = LU$)。\n\n**Derivation (Gaussian Elimination View):**\n高斯消元的每一步是将第 $k$ 列对角线以下的元素消为 0。这等价于左乘一个初等矩阵 $M_k$（Frobenius Matrix）：\n\n$$M_{n-1} \\dots M_2 M_1 A = U$$\n\n其中 $M_k = I - \\alpha_k e_k^T$。\n由于 $M_k$ 是下三角且可逆，其逆 ", "has_pdf": false}, {"title": "第四章：有限元理论与有限元方法", "url": "/blog/applied-math/numerical-pde/chapter4/", "preview": "1950s, 美国与德国 ：航空工程与机械工程领域。代表人物：Plantl 和 Coniant。 1950s, 苏联 ：基础数学与 Sobolev 空间。代表人物：Sobolev。 1965, 中国 ：基于变分原理的差分格式。代表人物：冯康（Kang Feng）。 他的十六字方针： 分整为零、裁弯取直、以简驭繁、化难为易 。", "date": "2025-12-01", "words": 2052, "categories": ["应用数学", "PDE 数值解"], "tags": ["applied-math", "numerical-pde"], "content": "第四章：有限元理论与有限元方法 0. 简介与历史背景 1950s, 美国与德国 ：航空工程与机械工程领域。代表人物：Plantl 和 Coniant。 1950s, 苏联 ：基础数学与 Sobolev 空间。代表人物：Sobolev。 1965, 中国 ：基于变分原理的差分格式。代表人物：冯康（Kang Feng）。 他的十六字方针： 分整为零、裁弯取直、以简驭繁、化难为易 。 1. 有限元理论基础 1.1 两个引例 在引入抽象理论前，先考察三种问题的等价性： 1. 线性系统 (L) 线性方程组：$Ax=b$, $A\\in\\mathbb R ^ n\\times n $； (M) 优化问题：$\\min J(x)=\\frac 1 2 \\langle x,Ax\\rangle-\\langle b,x\\rangle$； (V) 变分问题：$\\langle Ax-b,y\\rangle=0$, $\\forall y\\in\\mathbb R ^ n $。 若 $A$ 对称正定，则 $(L)\\Leftrightarrow(M)\\Leftrightarrow(V)$。 2. 微分方程（1维 Poisson 方程边值问题） (D) 微分方程： $$ \\begin cases -u^ \\prime\\prime (x)=f(x), \\quad 0<x<1 \\\\ u(0)=u(1)=0.\\end cases $$ (M) 泛函极值问题： $$ \\min~J(u)=\\frac 1 2 \\langle u^ \\prime ,u^ \\prime \\rangle-\\langle f,u\\rangle $$ s.t. $u\\in V:=\\ u u(0)=u(1)=0, u \\text 满足光滑条件 \\ $。 (V) 变分问题：$\\langle u^ \\prime ,v^ \\prime \\rangle=\\langle f,v\\rangle$, $\\forall v\\in V$。 通常情况下 $(M)\\Rightarrow(V)$，若 $J$ 正定则 $(V)\\Leftrightarrow(M)$。 这引入了求解 PDE 的三种思路： (D) $\\rightarrow$ 有限差分法 (Finite Difference Method) (M) $\\rightarrow$ Ritz 方法 (V) $\\rightarrow$ Galerkin 方法 (最终) 有限元方法 (FEM) ：(Bubnov-) Galerkin 方法 + 分段多项式空间。 1.2 抽象变分问题与微商 许多物理问题可以通过能量极小化原理求解，相应的变分问题是： $$ \\text 求 u\\in \\mathbb U ,\\quad \\text 使得 J(u) = \\min v\\in \\mathbb U J(v) $$ 其中 $\\mat", "source": "# 第四章：有限元理论与有限元方法\n\n## 0. 简介与历史背景\n\n* **1950s, 美国与德国**：航空工程与机械工程领域。代表人物：Plantl 和 Coniant。\n* **1950s, 苏联**：基础数学与 Sobolev 空间。代表人物：Sobolev。\n* **1965, 中国**：基于变分原理的差分格式。代表人物：冯康（Kang Feng）。\n    * 他的十六字方针：**分整为零、裁弯取直、以简驭繁、化难为易**。\n\n## 1. 有限元理论基础\n\n### 1.1 两个引例\n\n在引入抽象理论前，先考察三种问题的等价性：\n\n1.  **线性系统**\n    * (L) 线性方程组：$Ax=b$, $A\\in\\mathbb{R}^{n\\times n}$；\n    * (M) 优化问题：$\\min J(x)=\\frac{1}{2}\\langle x,Ax\\rangle-\\langle b,x\\rangle$；\n    * (V) 变分问题：$\\langle Ax-b,y\\rangle=0$, $\\forall y\\in\\mathbb{R}^{n}$。\n    * 若 $A$ 对称正定，则 $(L)\\Leftrightarrow(M)\\Leftrightarrow(V)$。\n\n2.  **微分方程（1维 Poisson 方程边值问题）**\n    * (D) 微分方程：\n\n        $$\n        \\begin{cases}-u^{\\prime\\prime}(x)=f(x), \\quad 0<x<1 \\\\ u(0)=u(1)=0.\\end{cases}\n        $$\n\n    * (M) 泛函极值问题：\n        \n        $$\n        \\min~J(u)=\\frac{1}{2}\\langle u^{\\prime},u^{\\prime}\\rangle-\\langle f,u\\rangle\n        $$\n        \n        s.t. $u\\in V:=\\{u|u(0)=u(1)=0, u \\text{ 满足光滑条件}\\}$。\n    \n    * (V) 变分问题：$\\langle u^{\\prime},v^{\\prime}\\rangle=\\langle f,v\\rangle$, $\\forall v\\in V$。\n    * 通常情况下 $(M)\\Rightarrow(V)$，若 $J$ 正定则 $(V)\\Leftrightarrow(M)$。\n\n这引入了求解 PDE 的三种思路：\n\n* (D) $\\rightarrow$ 有限差分法 (Finite Difference Method)\n* (M) $\\rightarrow$ Ritz 方法\n* (V) $\\rightarrow$ Galerkin 方法\n* **(最终) 有限元方法 (FEM)**：(Bubnov-) Galerkin 方法 + 分段多项式空间。\n\n### 1.2 抽象变分问题与微商\n\n许多物理问题可以通过能量极小化原理求解，相应的变分问题是：\n\n!!! definition \"抽象变分问题\"\n    \n    $$\n        \\text{求 }u\\in \\mathbb{U},\\quad \\text{使得 } J(u) = \\min_{v\\in \\mathbb{U}} J(v)\n    $$\n    \n    其中 $\\mathbb{U}$ 是 Banach 空间 $\\mathbb{V}$ 的一个非空闭子集，$J:\\mathbb{U}\\to \\mathbb{R}$ 是定义在 $\\mathbb{U}$ 上的能量泛函。特别的，在许多问题中 $\\mathbb{V}$ 是 Hilbert 空间，$\\mathbb{U}$ 是 $\\mathbb{V}$ 的一个闭线性子空间，泛函 $J$ 具有如下形式：\n    \n    $$\n        J(v) = \\frac{1}{2} a(v,v) - f(v)\n    $$\n    \n    其中 $a(\\cdot,\\cdot): \\mathbb{V}\\times \\mathbb{V}\\to \\mathbb{R}$ 是一个双线性形式，$f:\\mathbb{V}\\to \\mathbb{R}$ 是一个连续的线性泛函。\n\n这类问题一般直接求解，或利用变分问题的 Euler-Lagrange 方程进行求解。两种方法都会用到微商的概念。\n\n!!! definition \"Fréchet 微商\"\n    $F$ 称为在 $x\\in \\Omega$ 处 **Fréchet 可微** 的，若存在线性映射 $A:\\mathbb{X}\\to \\mathbb{Y}$，使得对任意的 $\\varepsilon >0$，存在 $\\delta >0$，当 $z\\in \\mathbb{X}$ 满足 $\\|z\\|\\le \\delta$ 时，有\n    \n    $$\n        \\|F(x+z) - F(x) - Az\\|_{\\mathbb{Y}} \\le \\varepsilon \\|z\\|_{\\mathbb{X}}\n    $$\n    \n    这时称 $A$ 为 $F$ 在 $x$ 处的 **Fréchet 微商**，记为 $F'(x)=A$ 或 $\\mathrm{d}F(x)=A$。如果 $F'(x)$ 是零映射，则称 $x$ 为 $F$ 的驻点。\n\n!!! definition \"Gâteaux 微商\"\n    $F$ 称为在 $x\\in \\Omega$ 处沿方向 $z\\in \\mathbb{X}$ 是 **Gâteaux 可微** 的，若以下极限存在：\n    \n    $$\n    \\mathrm{D}F(x;z)=\\lim_{t\\to 0}\\frac{F(x+tz)-F(x)}{t}\n    $$\n    \n    这时称 $\\mathrm{D}F(x;z)$ 为 $F$ 在点 $x$ 处沿方向 $z$ 的 **Gâteaux 微分**。若 $\\mathrm{D}F(x;z)$ 关于 $z$ 是线性的，即存在一个线性映射 $A:\\mathbb{X}\\to \\mathbb{Y}$，使得 $\\mathrm{D}F(x;z)=Az$，则称 $A$ 是 $F$ 在点 $x$ 处的 **Gâteaux 微商**。\n\n若 Fréchet 可微的函数 $F$ 在 $x$ 处取得极小值，则对任意的 $z\\in \\mathbb{X}$，$F(x+tz)$ 作为 $t$ 的函数在 $t=0$ 处也取得极小值，因此有 Euler-Lagrange 方程的弱形式：\n\n$$\nF'(x)z=0, \\forall z\\in \\mathbb{X}\n$$\n\n!!! example \"例\"\n    设 $J=\\frac{1}{2}a(v,v)-f(v)$，且 $a$ 对称，则\n    \n    $$\n    \\lim_{t\\to 0}\\frac{1}{t}(J(u+tv)-J(u)) = a(u,v) - f(v)\n    $$\n    \n    若 ", "has_pdf": false}, {"title": "Notes", "url": "/blog/applied-math/data-science/notes/", theta f(x)+(1-\\theta)f(y)\n    $$\n\n    则称 $f$ 为凸函数。\n\n!!! theorem \"琴生不等式\"\n    设 $X$ 为实值随机变量，$f:\\mathbb{R}\\to\\mathbb{R}$ 为凸函数，且 $\\mathbb{E}|X|<\\infty$。则有\n\n    $$\n    f(\\mathbb{E} X)\\leqslant \\mathbb{E} f(X)\n    $$\n\n!!! definition \"凸共轭\"\n    设 $f:\\mathbb{R}^n\\to\\mathbb{R}\\cup\\{+\\infty\\}$。则 $f$ 的凸共轭 $f^*:\\mathbb{R}^n\\to\\mathbb{R}\\cup\\{+\\infty\\}$ 定义为\n\n    $$\n    f^*(y) = \\sup_{x\\in\\mathbb{R}^n} \\langle y,x\\rangle - f(x)\n    $$\n\n\n---\n\n## 累积量生成函数 (CGF)\n!!! definition \"CGF\"\n    设 $X$ 为实值随机变量，且对于所有 $\\lambda$，$\\mathbb{E} e^{\\lambda X}$ 存在（可能为 $\\infty$）。则 $X$ 的累积量生成函数定义为\n\n    $$\n    \\psi_X(\\lambda) = \\log \\mathbb{E} e^{\\lambda X}\n    $$\n\n!!! lemma \"CGF 模板引理\"\n    设 $X$ 为实值随机变量，且 $\\psi_X(\\lambda)$ 为其 CGF。则对于所有 $t\\in\\mathbb{R}$，都有 \n    $$\\mathbb{P}(X>t)\\leqslant e^{-\\psi_X^*(t)}$$，其中 $\\psi^*(t) = \\sup_{\\lambda\\geqslant 0}\\lambda t - \\psi(\\lambda)$。\n\n??? proof \"证明\"\n    对于任意 $\\lambda\\geqslant 0$，由马尔可夫不等式有\n\n    $$\n    \\begin{align*}\n    \\mathbb{P}(X>t) &= \\mathbb{P}(e^{\\lambda X} > e^{\\lambda t})\\\\\n    &\\leqslant \\frac{\\mathbb{E} e^{\\lambda X}}{e^{\\lambda t}}\\\\\n    &= e^{-\\lambda t + \\psi_X(\\lambda)}\n    \\end{align*}\n    $$\n\n    对上式两边取 $\\inf_{\\lambda\\geqslant 0}$ 即得所需结论。\n\n* 注意：不需要假设 $\\mathbb{E} X=0$\n* “$\\psi$ 的上界 $\\implies \\psi^*$ 的下界 $\\implies$ 尾部概率的上界”\n\n!!! collary \"CGF 模板引理的独立同分布版本\"\n    设 $X_1,\\ldots,X_n$ 为独立同分布的实值随机变量，且 $\\psi_X(\\lambda)$ 为其 CGF。则对于所有 $t\\in\\mathbb{R}$，都有\n\n    $$\\mathbb{P}(X_1+\\cdots+X_n>nt)\\leqslant e^{-(n\\psi)^*(nt)}=e^{-n\\psi^*(t)}$$\n\n---\n\n### CGF 的性质\n\n* 除 0 以外可能为 $\\infty$\n* 总是凸的\n* **练习 1.1**: 直接证明它，即使用凸性的原始定义。\n\n??? proof \"证明\"\n    设 $\\lambda_1,\\lambda_2\\in\\mathbb{R}$，$\\theta\\in[0,1]$。则\n\n    $$\n    \\begin{align*}\n    \\psi_X(\\theta \\lambda_1 + (1-\\theta)\\lambda_2) &= \\log \\mathbb{E} e^{(\\theta \\lambda_1 + (1-\\theta)\\lambda_2) X} \\\\\n    &= \\log \\mathbb{E} \\left( e^{\\lambda_1 X} \\right)^\\theta \\left( e^{\\lambda_2 X} \\right)^{1-\\theta} \\\\\n    &\\leqslant \\log \\left( (\\mathbb{E} e^{\\lambda_1 X})^\\theta (\\mathbb{E} e^{\\lambda_2 X})^{1-\\theta} \\right) \\quad \\text{（由琴生不等式）} \\\\\n    &= \\theta \\log \\mathbb{E} e^{\\lambda_1 X} + (1-\\theta) \\log \\mathbb{E} e^{\\lambda_2 X} \\\\\n    &= \\theta \\psi_X(\\lambda_1) + (1-\\theta) \\psi_X(\\lambda_2)\n    \\end{align*}\n    $$\n\n    因此，$\\psi_X$ 是凸函数。\n\n* **练习 1.2**: 通过证明 $\\psi_X''(\\lambda) = \\text{Var}[Y]$ 来证明，其中 $Y$ 是“指数倾斜”的 $X$：$dF_Y(x)\\propto e^{\\lambda x}dF_X(x)$。\n\n??? proof \"证明\"\n    设 $M_X(\\lambda) = \\mathbb{E} e^{\\lambda X}$，则 $\\psi_X(\\lambda) = \\log M_X(\\lambda)$。计算其一阶和二阶导数：\n\n    $$\n    \\begin{align*}\n    \\psi_X'(\\lambda) &= \\frac{M_X'(\\lambda)}{M_X(\\lambda)} = \\frac{\\mathbb{E}[X e^{\\lambda X}]}{\\mathb", "has_pdf": true}, {"title": "凸分析", "url": "/blog/applied-math/convex-optimization/chapter1/", "preview": "我们只考虑  \\(\\mathbb{R}^n\\)  空间上的优化问题。 所有的向量约定为列向量。  \\(&#x27;\\)  表示转置。  \\(x&#x27;y\\)  为  \\(\\sum_{i=1}^{n}\\)  表示  \\(x\\)  和  \\(y\\)  的内积。  \\(||x||_2 = (x&#x27;x)^{1/2}\\)  为  \\(x\\)  的欧几里得范数。", "date": "2025-11-25", "words": 3564, "categories": ["应用数学", "凸优化"], "tags": ["applied-math", "convex-optimization"], "content": "凸分析 一些符号约定 我们只考虑 $\\mathbb R ^n$ 空间上的优化问题。 所有的向量约定为列向量。 $'$表示转置。 $x'y$ 为 $\\sum i=1 ^ n $ 表示 $x$ 和 $y$ 的内积。 $ x 2 = (x'x)^ 1/2 $ 为 $x$ 的欧几里得范数。 凸集与凸函数 凸集 设 $C \\subseteq \\mathbb R ^n$，如果对于任意 $x,y \\in C$ 和 $\\alpha \\in 0,1 $，都有 $$\\alpha x + (1-\\alpha)y \\in C,$$ 则称 $C$ 是 凸集(convex set) 。 例子： Polyhedron sets ：非空的满足 $$C = \\left\\ x \\Big a' jx \\le b j,j=1,\\cdots,r\\right\\ $$ Cones ：满足对任意的 $x\\in C,\\lambda 0$ 均有 $\\lambda x \\in C$ 的集合。 凸函数 设 $C \\subseteq \\mathbb R ^n$ 是凸集，$f: C \\to \\mathbb R $，如果对于任意 $x,y \\in C$ 和 $\\alpha \\in 0,1 $，都有 $$f(\\alpha x + (1-\\alpha)y) \\le \\alpha f(x) + (1-\\alpha)f(y),$$ 则称 $f$ 是定义在 $C$ 上的 凸函数(convex function) 。 若等号当且仅当 $x=y$ 时成立，则称 $f$ 是 严格凸函数(strictly c 下半连续\n\n我们称 $f$ 在 $x\\in X$ 处是**下半连续的(lower semicontinuous)**，若对于任意 $\\{x_k\\}\\subseteq X$ 满足 $x_k\\to x$ 时，有\n$$\\liminf_{k\\to\\infty} f(x^k) \\ge f(x).$$\n\n**性质：**\n对函数 $f:\\mathbb{R}^n \\to [-\\infty,+\\infty]$，下列命题等价：\n* 对任意 $\\gamma \\in \\mathbb{R}$，集合 $V_\\gamma=\\left\\{x\\in \\mathbb{R}^n\\Big| f(x)\\le \\gamma\\right\\}$ 是闭集；\n* $f$ 在任意 $x\\in \\mathbb{R}^n$ 处是下半连续的；\n* $f$ 是闭的。\n\n**证明：**\n$(1)\\Longrightarrow(2)$：设 $\\{x_k\\}\\subseteq \\mathbb{R}^n$ 且 $x_k\\to x$，则对任意 $\\varepsilon>0$，存在 $N>0$ 使得当 $k>N$ 时，有 $f(x_k)>f(x)-\\varepsilon$。因此，\n$$\\liminf_{k\\to\\infty} f(x_k) \\ge f(x)-\\varepsilon.$$\n由于 $\\varepsilon>0$ 是任意的，故 $\\liminf_{k\\to\\infty} f(x_k) \\ge f(x)$。\n\n$(2)\\Longrightarrow(3)$：设 $\\{(x_k,w_k)\\}\\subseteq \\text{epi}(f)$ 且 $(x_k,w_k)\\to (x,w)$，则 $w_k \\ge f(x_k)$。由下半连续性可知\n$$w = \\lim_{k\\to\\infty} w_k \\ge \\liminf_{k\\to\\infty} f(x_k) \\ge f(x),$$\n因此，$(x,w)\\in \\text{epi}(f)$。\n\n$(3)\\Longrightarrow(1)$：设 $\\{x_k\\}\\subseteq V_\\gamma$ 且 $x_k\\to x$，则 $(x_k,\\gamma)\\in \\text{epi}(f)$。由闭性可知 $(x,\\gamma)\\in \\text{epi}(f)$，即 $f(x)\\le \\gamma$，所以 $x\\in V_\\gamma$。\n\n**性质：**\n设 $f:X\\rightarrow [-\\infty,+\\infty]$，则若 $\\text{dom}(f)$ 是闭集且 $f$ 在 $\\text{dom}(f)$ 上下半连续，则 $f$ 是闭的。\n\n**证明：**\n设 $\\{(x_k,w_k)\\}\\subseteq \\text{epi}(f)$ 且 $(x_k,w_k)\\to (x,w)$，则 $w_k \\ge f(x_k)$。若 $x\\in \\text{dom}(f)$，则由下半连续性可知\n$$w = \\lim_{k\\to\\infty} w_k \\ge \\liminf_{k\\to\\infty} f(x_k) \\ge f(x),$$\n因此，$(x,w)\\in \\text{epi}(f)$。若 $x\\notin \\text{dom}(f)$，则 $f(x)=+\\infty$，显然 $(x,w)\\in \\text{epi}(f)$。\n\n#### Proper\n\n我们称 $f$ 是 **proper** 若 $\\text{dom}(f)\\neq \\emptyset$ 且 $f(x)>-\\infty$ 对任意 $x\\in X$ 成立。我们称 $f$ 是 **improper** 若 $f$ 不是 proper。\n\n**性质：**\n* $g:\\mathbb{R}^n\\rightarrow (-\\infty,+\\infty]$ 由下式给出$$g(x)=\\lambda_1f_1(x)+\\cdots+\\lambda_mf_m(x),$$其中 $\\lambda_i> 0$，若 $f", "has_pdf": false}, {"title": "凸多面体", "url": "/blog/applied-math/convex-optimization/chapter2/", "preview": "一个 超平面(hyperplane) 是形如  \\[H=  $C$ 的闭包和一个分离 $C$ 超平面 $H$，则称单点集 $\\left\\{\\bar{x}\\right\\}$ 是 $C$ 在 $\\bar{x}$ 处的**支撑(supporting)**。\n\n### Supporting Hyperplane Theorem\n\n设 $C$ 是凸集，$\\bar{x}$ 不是 $C$ 的内点，则存在一个超平面经过 $\\bar{x}$ 且支撑 $C$。\n\n**证明：**\n取 $\\left\\{x_k\\right\\}$ 不属于 $\\text{cl}(C)$ 且 $x_k\\rightarrow \\bar{x}$。设 $\\hat{x_k}$ 为 $x_k$ 在 $\\text{cl}(C)$ 上的投影，我们有对任意 $x\\in \\text{cl}(C)$，$$a'_kx\\ge a_k'x_k,\\forall k=0,1,\\cdots$$其中 $a_k=(x_k-\\hat{x_k})/\\left\\|x_k-\\hat{x_k}\\right\\|$。令 $k\\rightarrow \\infty$ 即得。\n\n### Separating Hyperplane Theorem\n\n设 $C_1$ 和 $C_2$ 是 $\\mathbb{R}^n$ 中的非空凸集且 $\\text{ri}(C_1)\\cap \\text{ri}(C_2)=\\emptyset$，则存在一个超平面分离 $C_1$ 和 $C_2$。\n\n**证明：**\n考虑凸集 $$C_1-C_2=\\left\\{x_1 -x_2|x_1\\in C_1,x_2\\in C_2\\right\\}.$$\n由于 $C_1,C_2$ 是不交的，故 $0\\notin \\text{ri}(C_1-C_2)$。由支持超平面定理可知，存在 $0\\neq a\\in \\mathbb{R}^n$ 使得 $$a'x\\ge 0,\\forall x\\in C_1-C_2. $$\n\n### Strict Separation Theorem\n\n设 $C_1$ 和 $C_2$ 是 $\\mathbb{R}^n$ 中的非空闭凸集且 $C_1\\cap C_2=\\emptyset$。若 $C_1$ 是闭的，$C_2$ 是紧的，则存在一个超平面严格分离 $C_1$ 和 $C_2$。\n\n**证明：**\n考虑 $C_1-C_2$，由于 $C_1$ 闭 $C_2$ 紧，$C_1-C_2$ 是闭的。设 $\\bar{x_1}-\\bar{x_2}$ 是 $0$ 在 $C_1-C_2$ 上的投影，则 $\\|\\bar{x_1}-\\bar{x_2}\\|>0$。令 $a=\\bar{x_1}-\\bar{x_2}$，则 $$a'x\\ge \\|a\\|^2,\\forall x\\in C_1-C_2. $$\n\n### Fundamental Characterization\n\n集合 $C$ 的凸包的闭包为所有包含 $C$ 的闭半平面的交。\n\n### Properly 分离\n\n我们称超平面 properly 分离 两个集合 $C_1$ 和 $C_2$，若其分离 $C_1$ 和 $C_2$ 且不完全包含 $C_1$ 或 $C_2$。\n\n### Proper Separation Theorem\n\n设 $C_1$ 和 $C_2$ 是 $\\mathbb{R}^n$ 中的非空闭凸集且 $C_1\\cap C_2=\\emptyset$。则存在一个超平面 properly 分离 $C_1$ 和 $C_2$ 当且仅当 $\\text{ri}(C_1)\\cap \\text{ri}(C_2)=\\emptyset$。\n\n### 非垂直的\n\n一个 $\\mathbb{R}^{n+1}$ 中的超平面伴有法向量 $(\\mu,\\beta)$ 称为**非垂直的(nonvertical)**，若 $\\beta\\neq 0$。\n\n其与第 $n+1$ 维轴交于 $\\xi=(\\mu/\\beta)'\\bar{u}+\\bar{w}$，其中 $(\\bar{u},\\bar{w})$ 是超平面上的任意点。\n\n### Novertical Hyperplane Theorem\n\n设 $C$ 是 $\\mathbb{R}^{n+1}$ 中的非空闭凸集且 $C$ 不包含某个垂直方向的直线，则：\n* $C$ 包含于某个非垂直超平面的一侧，即存在 $\\mu \\in \\mathbb{R}^n,\\beta\\in \\mathbb{R}\\backslash \\{0\\}$ 使得 $$\\mu'u+\\beta w\\ge \\gamma,\\forall (u,w)\\in C.$$\n* 若 $(\\bar{u},\\bar{w})\\notin \\text{cl}(C)$，则存在一个非垂直超平面严格分离 $C$ 和 $(\\bar{u},\\bar{w})$。\n\n**证明：**\n由于 $C$ 不包含任意方向的垂线，故 $\\text{ri}(C)$ 不包含任意方向的垂线，而 $\\text{ri}(C)$ 和 $\\text{cl}(C)$ 有相同的回收锥，故 $\\text{cl}(C)$ 也不包含任意方向的垂线。故我们只考虑 $C$ 是闭的。\n\n$(a)$：$C$ 为所有包含 $C$ 的闭半平面的交，若这些半平面均垂直，则 $C$ 包含某个垂直方向的直线，矛盾。\n\n$(b)$：由支持超平面定理可知，存在一个超平面分离 $C$ 和 $(\\bar{u},\\bar{w})$。若该超平面垂直，则 $C$ 包含某个垂直方向的直线，矛盾。\n\n## 凸包、仿射包和相对内点\n\n给定集合 $X\\subset \\mathbb{R}^n$。\n\n#### 凸组合\n\n$X$ 中元素的一个**凸组合(convex combination)**是形如\n$$\\sum_{i=1}^k \\alpha_i x_i,$$其中 $x_i\\in X$，$\\alpha_i\\ge 0$ 且 $\\sum_{i=1}^k \\alpha_i = 1$ 的向量。\n\n#### 凸包\n\n$X$ 的**凸包(convex hull)**是包含 $X$ 的所有凸集的交集，记为 $\\text{conv}(X)$。\n\n#### 仿射集\n\n一个", "has_pdf": false}, {"title": "凸优化", "url": "/blog/applied-math/convex-optimization/chapter3/", "preview": "对任意  \\(f:\\mathbb{R}^n\\rightarrow [-\\infty,+\\infty]\\)  ，其 共轭凸函数(conjugate convex function) 定义为  \\[f^*(y)=\\sup_{x\\in \\mathbb{R}^n} (x&#x27;y -f(x)), \\forall y\\in \\mathbb{R}^n.\\] ", "date": "2025-11-25", "words": 379, "categories": ["应用数学", "凸优化"], "tags": ["applied-math", "convex-optimization"], "content": "凸优化 共轭函数 共轭凸函数 对任意 $f:\\mathbb R ^n\\rightarrow -\\infty,+\\infty $，其 共轭凸函数(conjugate convex function) 定义为 $$f^ (y)=\\sup x\\in \\mathbb R ^n (x'y -f(x)), \\forall y\\in \\mathbb R ^n. $$ 性质： $f^ $ 是闭且凸的函数。 Conjugacy Theorem 若 $f$ 是闭且proper的凸函数，则 $f^ =f$。 Conjugacy Theorem 设 $f:\\mathbb R ^n\\rightarrow (-\\infty,+\\infty $ ，设 $\\check \\text cl f$ 为其凸闭包，设 $f^ $ 是其共轭凸函数，考虑 $f^ $ 的共轭 $$f^ (x)=\\sup y\\in \\mathbb R ^n (x'y -f^ (y)), \\forall x\\in \\mathbb R ^n. $$ $f(x)\\ge f^ (x),\\forall x\\in \\mathbb R ^n.$ 若 $f$ 是凸的，则 $f,f^ ,f^ $ 中任意一者是 proper 给出 另两者是 proper。 若 $f$ 是闭且 proper 的凸函数，则 $f=f^ $。 若 $\\check \\text cl f(x) -\\infty$ ，则 $\\check \\text cl f=f^ $。 证明： $(a)$：显然。 $(b)$：由定义即得。 $(c)$：设 $g=f^ $，则 $g$ 是闭且 proper 的凸函数且 $f(x)\\ge g(x),\\forall x\\in \\mathbb R ^n$。由支持超平面定理可知，$f$ 的任意支撑超平面也是 $g$ 的支撑超平面，故 $f=g$。 $(d)$：由$(a)$和$(c)$即得。 例子： 对 $\\frac 1 p +\\frac 1 q =1$，$p 1$ 的 $f(x)=\\frac 1 p \\ x\\ ^p$，其共轭函数为 $f^ (y)=\\frac 1 q \\ y\\ ^q$。 $f(x)=\\frac 1 2 x'Qx+a'x+b$，$Q$ 为半正定矩阵，则 $f^ (y)=\\frac 1 2 (y-a)'Q^ -1 (y-a)-b$。 $f(x)=p(A(x-c))+a'x+b$，则 $f^ (y)=q((A')^ -1 (y-a))+c'y+d$，其中 $q$ 是 $p$ 的共轭函数，$d=-(c'a+b)$。 <br <hr <div style=\"display: flex; justify-content: space-between; align-items: center; margin-top: 20px;\" markdow", "source": "# 凸优化\n\n## 共轭函数\n\n### 共轭凸函数\n\n对任意 $f:\\mathbb{R}^n\\rightarrow [-\\infty,+\\infty]$，其**共轭凸函数(conjugate convex function)** 定义为 $$f^*(y)=\\sup_{x\\in \\mathbb{R}^n} (x'y -f(x)), \\forall y\\in \\mathbb{R}^n. $$\n\n**性质：**\n$f^*$ 是闭且凸的函数。\n\n### Conjugacy Theorem\n\n若 $f$ 是闭且proper的凸函数，则 $f^{**}=f$。\n\n### Conjugacy Theorem\n\n设 $f:\\mathbb{R}^n\\rightarrow (-\\infty,+\\infty]$ ，设 $\\check{\\text{cl}}f$ 为其凸闭包，设 $f^*$ 是其共轭凸函数，考虑 $f^*$ 的共轭 $$f^{**}(x)=\\sup_{y\\in \\mathbb{R}^n} (x'y -f^*(y)), \\forall x\\in \\mathbb{R}^n. $$\n* $f(x)\\ge f^{**}(x),\\forall x\\in \\mathbb{R}^n.$\n* 若 $f$ 是凸的，则 $f,f^*,f^{**}$ 中任意一者是 proper 给出 另两者是 proper。\n* 若 $f$ 是闭且 proper 的凸函数，则 $f=f^{**}$。\n* 若 $\\check{\\text{cl}}f(x)>-\\infty$ ，则 $\\check{\\text{cl}}f=f^{**}$。\n\n**证明：**\n$(a)$：显然。\n\n$(b)$：由定义即得。\n\n$(c)$：设 $g=f^{**}$，则 $g$ 是闭且 proper 的凸函数且 $f(x)\\ge g(x),\\forall x\\in \\mathbb{R}^n$。由支持超平面定理可知，$f$ 的任意支撑超平面也是 $g$ 的支撑超平面，故 $f=g$。\n\n$(d)$：由$(a)$和$(c)$即得。\n\n**例子：**\n\n* 对 $\\frac{1}{p}+\\frac{1}{q}=1$，$p>1$ 的 $f(x)=\\frac{1}{p}\\|x\\|^p$，其共轭函数为 $f^*(y)=\\frac{1}{q}\\|y\\|^q$。\n* $f(x)=\\frac{1}{2}x'Qx+a'x+b$，$Q$ 为半正定矩阵，则 $f^*(y)=\\frac{1}{2}(y-a)'Q^{-1}(y-a)-b$。\n* $f(x)=p(A(x-c))+a'x+b$，则 $f^*(y)=q((A')^{-1}(y-a))+c'y+d$，其中 $q$ 是 $p$ 的共轭函数，$d=-(c'a+b)$。\n\n\n<br>\n<hr>\n\n<div style=\"display: flex; justify-content: space-between; align-items: center; margin-top: 20px;\" markdown=\"1\">\n\n[ :octicons-arrow-left-24: 上一章：凸多面体](chapter2.md){ .md-button }\n\n[ 下一章：几何对偶框架 :octicons-arrow-right-24: ](chapter4.md){ .md-button .md-button--primary }\n\n</div>", "has_pdf": false}, {"title": "几何对偶框架", "url": "/blog/applied-math/convex-optimization/chapter4/", "preview": "设  \\(M\\)  是  \\(\\mathbb{R}^{n+1}\\)  的非空子集。 最小公共点问题(minimum common point problem) ：寻找点  \\((x,w)\\in M\\)  使得  \\(w\\)  最小化。", "date": "2025-11-25", "words": 1305, "categories": ["应用数学", "凸优化"], "tags": ["applied-math", "convex-optimization"], "content": "几何对偶框架 最小公共点和最大相交点问题 我们介绍一对基本问题。 最小公共点问题 设 $M$ 是 $\\mathbb R ^ n+1 $ 的非空子集。 最小公共点问题(minimum common point problem) ：寻找点 $(x,w)\\in M$ 使得 $w$ 最小化。 最大相交点问题 设 $M$ 是 $\\mathbb R ^ n+1 $ 的非空子集。 最大相交点问题(maximum intersecting point problem) ：考虑所有包含了 $M$ 的非垂直超平面，寻找其中与第 $n+1$ 维轴交点最大的超平面。 对最小公共问题 $w^ =\\inf\\ w (x,w)\\in M\\ $，对最大相交点问题，我们考虑法向量为 $(\\mu,1)$ 的超平面其相交点 $\\xi$ 满足 $$\\xi\\le w+\\mu'u,\\forall (u,w)\\in M$$从而最大相交点问题可表述为最大化 $\\xi\\le \\inf (u,w)\\in M (w+\\mu'u),\\mu\\in \\mathbb R ^n$，即$$\\text maximize q(\\mu)=\\inf (u,w)\\in M (w+\\mu'u),\\quad \\text subject \\mu\\in \\mathbb R ^n. $$ 容易得到如下的 弱对偶(weak duality) 结果： $$q(\\mu)=\\inf (u,w)\\in M (w+\\mu'u)\\le \\inf (0,w)\\in M w=w^ ,\\forall \\mu\\in \\mathbb R ^n. $$ 我们称 强对偶(strong duality) 成立，若 $q^ =w^ $。 例子： $$M=\\text epi (p)$$其中 $p:\\mathbb R ^n\\rightarrow -\\infty,\\infty $，则 $w^ =p(0)$，且 $$q(\\mu)=\\inf (u,w)\\in \\text epi (p) (w+\\mu'u)=\\inf u\\in \\mathbb R ^n (p(u)+\\mu'u)=-p^ (-\\mu). $$ 进而有 $$q^ =\\sup \\mu\\in \\mathbb R ^n q(\\mu)=\\sup \\mu\\in \\mathbb R ^n \\left\\ 0\\cdot (-\\mu)-p^ (-\\mu)\\right\\ =p^ (0)$$ 例子： 考虑更一般的最小化 $f:\\mathbb R ^n \\rightarrow -\\infty ,\\infty $ 的问题 。设 $F:\\mathbb R ^ n+r \\rightarrow -\\infty ,\\infty $ 为 $$f(x)=F(x,0),\\forall x\\in \\mathbb R ^n. $$ 考虑 扰动函数(perturbati", "source": "# 几何对偶框架\n\n## 最小公共点和最大相交点问题\n我们介绍一对基本问题。\n\n### 最小公共点问题\n\n设 $M$ 是 $\\mathbb{R}^{n+1}$ 的非空子集。**最小公共点问题(minimum common point problem)**：寻找点 $(x,w)\\in M$ 使得 $w$ 最小化。\n\n### 最大相交点问题\n\n设 $M$ 是 $\\mathbb{R}^{n+1}$ 的非空子集。**最大相交点问题(maximum intersecting point problem)**：考虑所有包含了 $M$ 的非垂直超平面，寻找其中与第 $n+1$ 维轴交点最大的超平面。\n\n对最小公共问题 $w^*=\\inf\\{w|(x,w)\\in M\\}$，对最大相交点问题，我们考虑法向量为 $(\\mu,1)$ 的超平面其相交点 $\\xi$ 满足 $$\\xi\\le w+\\mu'u,\\forall (u,w)\\in M$$从而最大相交点问题可表述为最大化 $\\xi\\le \\inf_{(u,w)\\in M} (w+\\mu'u),\\mu\\in \\mathbb{R}^n$，即$$\\text{maximize } q(\\mu)=\\inf_{(u,w)\\in M} (w+\\mu'u),\\quad \\text{subject }\\mu\\in \\mathbb{R}^n. $$\n\n容易得到如下的**弱对偶(weak duality)**结果：\n$$q(\\mu)=\\inf_{(u,w)\\in M} (w+\\mu'u)\\le \\inf_{(0,w)\\in M} w=w^*,\\forall \\mu\\in \\mathbb{R}^n. $$\n我们称**强对偶(strong duality)**成立，若 $q^*=w^*$。\n\n**例子：**\n\n$$M=\\text{epi}(p)$$其中 $p:\\mathbb{R}^n\\rightarrow [-\\infty,\\infty]$，则 $w^*=p(0)$，且 $$q(\\mu)=\\inf_{(u,w)\\in \\text{epi}(p)} (w+\\mu'u)=\\inf_{u\\in \\mathbb{R}^n} (p(u)+\\mu'u)=-p^*(-\\mu). $$\n进而有 $$q^*=\\sup_{\\mu\\in \\mathbb{R}^n} q(\\mu)=\\sup_{\\mu\\in \\mathbb{R}^n}\\left\\{0\\cdot (-\\mu)-p^*(-\\mu)\\right\\}=p^{**}(0)$$\n\n**例子：**\n\n考虑更一般的最小化 $f:\\mathbb{R}^n \\rightarrow [-\\infty ,\\infty]$ 的问题 。设 $F:\\mathbb{R}^{n+r}\\rightarrow [-\\infty ,\\infty]$ 为 $$f(x)=F(x,0),\\forall x\\in \\mathbb{R}^n. $$\n考虑**扰动函数(perturbation function)** $$p(u)=\\inf_{x\\in \\mathbb{R}^n} F(x,u),\\forall u\\in \\mathbb{R}^r. $$且 MC/MC 框架为 $M=\\mathrm{epi}(p)$。\n\n其最小公共值 $$w^*=p(0)=\\inf_{x\\in \\mathbb{R}^n} F(x,0)=\\inf_{x\\in \\mathbb{R}^n} f(x). $$\n其对偶函数为 $$q(\\mu)=\\inf_{u\\in \\mathbb{R}^r} (p(u)+\\mu'u)=\\inf_{(x,u)\\in \\mathbb{R}^{n+r}} (F(x,u)+\\mu'u). $$故 $q(\\mu)=-F^*(0,-\\mu)$，其中 $F^*$ 是 $F$ 的共轭函数，视作 $(x,u)$ 的函数。\n\n我们有 $$q^*=\\sup_{\\mu\\in \\mathbb{R}^r} q(\\mu)=-\\inf_{\\mu \\in \\mathbb{R}^r} F^*(0,-\\mu)=-\\inf_{\\mu \\in \\mathbb{R}^r} F^*(0,\\mu) $$\n且弱对偶性形如：$$w^*=\\inf_{x\\in \\mathbb{R}^n} F(x,0)\\ge =-\\inf_{\\mu \\in \\mathbb{R}^r} F^*(0,\\mu)=q^*. $$\n\n**例子：**\n\n考虑约束优化：最小化 $f:\\mathbb{R}^n\\rightarrow \\mathbb{R}$ 在 $$C=\\left\\{x\\in X\\Big| g(x)\\le 0\\right\\}$$ 其中 $X\\subset \\mathbb{R}^n$，$g:\\mathbb{R}^n\\rightarrow \\mathbb{R}^r$。\n\n考虑**扰动约束集(perturbed constraint set)** $$C_u=\\left\\{x\\in X\\Big| g(x)\\le u\\right\\},\\forall u\\in \\mathbb{R}^r. $$与函数 $$F(x,u)=\\begin{cases}\n    f(x)\\quad &if \\,x\\in C_u\\\\\n    +\\infty &otherwise\\end{cases} $$\n    这满足 $F(x,0)=f(x),\\forall x\\in C$。\n\n**例子：**\n\n考虑扰动函数 $$p(u)=\\inf_{x\\in \\mathbb{R}^n} F(x,u)=\\inf_{x\\in C_u} f(x),\\forall u\\in \\mathbb{R}^r. $$且 MC/MC 框架为 $M=\\mathrm{epi}(p)$。\n\n设 $L(x,\\mu)=f(x)+\\mu'g(x)$ 为 Lagrange 函数，则 $$q(\\mu)=\\inf_{u\\in \\mathbb{R}^r}\\left\\{p(u)+\\mu'u\\right\\}=\\inf_{u\\in \\mathbb{R}^r,x\\in X,g(x)\\le u}\\left\\{f(x)+\\mu'u\\right\\}=\\begin{cases}\n    \\inf_{x\\in X} L(x,\\mu)\\quad &if \\,\\mu\\ge 0\\\\\n    -\\infty &otherwise\n\\end{cases}$$\n\n**例子：**\n\n考虑线性规划问题：最小化 $c'x$ 在 $$C=\\left\\{x\\in \\mathbb{R}^n\\Big| a'_jx\\ge b_j,j=1,\\cdots,r\\right\\}$$其中 $c\\in \\mathbb{R}^n$，$a_j\\in \\mathbb{R}^n$，$b_j\\in \\mathbb{R}$。\n\n对 $\\mu\\ge 0$，对偶函数 $$q(\\mu)=\\inf_{x\\in \\mathbb{R}^n} \\left\\{c'x+\\sum_{j=1}^r \\mu_j(b_j -a'_jx)\\right\\}=\\begin{cases}\n    b'\\mu \\quad &if \\,c=\\sum_{j", "has_pdf": false}, {"title": "凸优化课程作业", "url": "/blog/applied-math/convex-optimization/homework/", "preview": "暂无预览", "date": "2025-11-25", "words": 39, "categories": ["应用数学", "凸优化"], "tags": ["applied-math", "convex-optimization"], "content": "<div style=\"height: 800px; width: 100%;\" <embed src=\"../../../assets/convex-optimization-hw-1.pdf\" type=\"application/pdf\" width=\"100%\" height=\"100%\" </div 点击下载 PDF 完整版 .md-button <div style=\"height: 800px; width: 100%;\" <embed src=\"../../../assets/convex-optimization-hw-2.pdf\" type=\"application/pdf\" width=\"100%\" height=\"100%\" </div 点击下载 PDF 完整版 .md-button <div style=\"height: 800px; width: 100%;\" <embed src=\"../../../assets/convex-optimization-hw-3.pdf\" type=\"application/pdf\" width=\"100%\" height=\"100%\" </div 点击下载 PDF 完整版 .md-button", "source": "<div style=\"height: 800px; width: 100%;\">\n    <embed src=\"../../../assets/convex-optimization-hw-1.pdf\" type=\"application/pdf\" width=\"100%\" height=\"100%\">\n</div>\n  =0. \\end cases $$ 我们考虑一维一阶线性双曲型方程 $$ u:\\mathbb R \\times\\mathbb R ^ + \\rightarrow\\mathbb R ^ p , \\quad u t +Au x =0 $$ 其中 $A=R\\Lambda R^ -1 $，$\\Lambda=\\text diag (\\lambda 1 ,\\dots,\\lambda ", "source": "# 第三章：双曲型方程的有限差分法\n\n* 线性双曲型偏微分方程：输运方程、波动方程、特征线。\n* 线性混合方程：对流扩散方程、拟线性双曲型方程。\n* 双曲守恒律：通量、总变差减小、激波、Godunov 方法、ENO / WENO 格式、黎曼求解器。\n\n## 1. 一阶线性双曲型方程\n\n### 1.1 特征线 (Characteristic lines)\n\n考虑一个向量值函数 $u(x,t):\\mathbb{R}^{n}\\times\\mathbb{R}^{+}\\rightarrow\\mathbb{R}^{p}$ 满足\n\n$$\n\\partial_{t}u+\\sum A_{i}\\partial_{x_{i}}u+Bu=\\psi\n$$\n\n其中 $A_{i}$, $B\\in\\mathbb{R}^{p\\times p}$，$\\psi:\\mathbb{R}^{n}\\times\\mathbb{R}^{+}\\rightarrow\\mathbb{R}^{p}$。\n\n!!! definition \"定义 0.\"\n    如果对于任意 $\\alpha=(\\alpha_{1},\\dots,\\alpha_{p})\\in\\mathbb{R}^{p}\\setminus\\{0\\}$，$A=\\sum_{i=1}^{p}\\alpha_{i}A_{i}$ 是实可对角化的，则称该 PDE 为双曲型的。\n    \n    此外，如果 $A$ 具有互异的实特征值，则称该 PDE 为严格双曲型的。\n\n对于二阶方程\n\n$$\n\\partial_{t}^{2}u+2\\sum_{i=1}^{n}a_{i}\\partial_{t}\\partial_{x_{i}}u+b_{0}\\partial_{t}u-\\sum_{i,j=1}^{n}a_{ij}\\partial_{x_{i}}\\partial_{x_{j}}u+\\sum_{i=1}^{n}b_{i}\\partial_{x_{i}}u+cu=\\psi.\n$$\n\n令 $V=u$，$V_{0}=\\partial_{t}u$，$V_{i}=\\partial_{x_{i}}u$ ($i=1,\\dots,n$)，则\n\n$$\n\\begin{cases}\n\\partial_{t}V-V_{0}=0\\\\\\\\\n\\partial_{t}V_{0}+2\\sum_{i=1}^{n}a_{i}\\partial_{x_{i}}V_{0}-\\sum_{i,j=1}^{n}a_{ij}\\partial_{x_{j}}V_{i}+\\sum_{i=1}^{n}b_{i}V_{i}+cV=\\psi,\\\\\\\\\n\\partial_{t}V_{j}-\\partial_{x_{j}}V_{0}=0.\n\\end{cases}\n$$\n\n我们考虑一维一阶线性双曲型方程\n\n$$\nu:\\mathbb{R}\\times\\mathbb{R}^{+}\\rightarrow\\mathbb{R}^{p}, \\quad u_{t}+Au_{x}=0\n$$\n\n其中 $A=R\\Lambda R^{-1}$，$\\Lambda=\\text{diag}(\\lambda_{1},\\dots,\\lambda_{p})$，$\\lambda_{1}\\le\\dots\\le\\lambda_{p}$。令 $w=R^{-1}u$，则\n\n$$\nw_{t}+\\Lambda w_{x}=0 \\Rightarrow \\partial_{t}w_{i}+\\lambda_{i}\\partial_{x_{i}}w_{i}=0.\n$$\n\n其特征线为 $\\frac{dx_{i}}{\\lambda_{i}}=dt \\Rightarrow x_{i}=\\lambda_{i}t+C$。我们可以发现\n\n$$\n\\frac{d}{dt}w_{i}(x_{i}(t), t) = \\partial_{t}w_{i}(x(t), t) + \\partial_{x}w_{i}(x(t), t) x'(t) = 0.\n$$\n\n所以 $w_{i}(x_{i}(t),t)$ 是常数。因此对于任意 $x, t$，有 $w_{i}(x,t)=w_{i}(x-\\lambda_{i}t,0)$。假设 $R=(\\xi^{1},\\dots,\\xi^{p})$，$R^{-1}=(\\eta^{1},\\dots,\\eta^{p})^T$，则 $w_{i}=\\eta^{i}u$。我们称 $w_{i}$ 为特征 $(\\lambda_{i},\\xi^{i})$ 的黎曼不变量 (Riemann invariant)。那么\n\n$$\nu(x,t)=Rw(x,t)=\\sum\\xi^{i}w_{i}(x,t)=\\sum\\xi^{i}w_{i}(x-\\lambda_{i}t,0)=\\sum_{i=1}^{p}\\xi^{i}\\eta^{i}u_{0}(x-\\lambda_{i}t).\n$$\n\n!!! definition \"定义 1.\"\n    对于区域 $\\Omega\\subseteq\\mathbb{R}\\times\\mathbb{R}^{+}$，其**依赖域 (dependence domain)** 定义为\n\n    $$\n    D(\\Omega):=\\{y\\in\\mathbb{R} \\mid \\exists\\lambda_{i},(x,t)\\in\\Omega \\text{ s.t. } y=x-\\lambda_{i}t\\};\n    $$\n\n    其**影响域 (influence domain)** 定义为\n\n    $$\n    I(\\Omega)=\\{(x,t)\\in\\mathbb{R}\\times\\mathbb{R}^{+} \\mid \\exists\\lambda_{i},(x^{\\prime},t^{\\prime})\\in\\Omega, t \\ge t' \\text{ s.t. } x=x^{\\prime}-\\lambda_{i}(t-t^{\\prime})\\};\n    $$\n\n    其**决定域 (decision domain)** 定义为\n\n    $$\n    K(\\Omega) = \\{(x, t) \\in \\mathbb{R} \\times \\mathbb{R}^{+} \\mid \\forall \\lambda_i, (x', t') \\in \\Omega, t' \\le t \\text{ s.t. } x=x'-\\lambda_i(t-t')\\}.\n    $$\n\n    这里 $R^{-1}=(\\eta^{1}, \\dots, \\eta^{p})^T$。\n\n!!! example \"例 1.\"\n\n    1.  $\\Omega=\\{(x_{0},t_{0})\\}$，$\\lambda_{1}=1$，$\\lambda_{2}=-1$。则 $D(\\Omega)=\\{x_{0}-t_{0},x_{0}+t_{0}\\}$，$I(\\Omega) = \\{(x, t) \\mid x = x_0 \\pm(t-t_0), t \\ge t_0\\}$，$K(\\Omega)=\\Omega$。\n    2.  $\\Omega=[0,1]\\times[0", "has_pdf": false}, {"title": "第二章：抛物型方程的有限差分法", "url": "/blog/applied-math/numerical-pde/chapter2/", "preview": "我们考虑带有初值和 Dirichlet 边界条件的一维热方程：", "date": "2025-11-23", "words": 4165, "categories": ["应用数学", "PDE 数值解"], "tags": ["applied-math", "numerical-pde"], "content": "第二章：抛物型方程的有限差分法 1. 模型问题 我们考虑带有初值和 Dirichlet 边界条件的一维热方程： $$ \\begin cases u t = u xx ,\\\\\\\\ u(x, 0) = u 0(x), \\quad x \\in 0, 1 ,\\\\\\\\ u(0,t) = u(1,t) = 0, \\quad t 0. \\end cases $$ 其解析解为： $$ u(x,t)=\\sum k=1 ^ \\infty a k e^ -k^ 2 \\pi^ 2 t \\sin(k\\pi x) $$ 其中 $a k = 2 \\int 0^1 u 0(x) \\sin(k\\pi x) \\mathrm d x$。 我们引入时空网格：令 $h = \\frac 1 N ,x j = jh, j=0,\\dots,N; \\tau=\\Delta t, t m =m\\tau, m=0,1,\\dots$。这就构成了一个网格函数 $U=\\ U j ^ m \\ $。 1.1 显式格式 令 $$ \\Delta +t u(x,t)=u(x,t+\\tau)-u(x,t) $$ $$ \\delta x ^ 2 u(x,t)=u(x+h,t)-2u(x,t)+u(x-h,t) $$ 于是我们得到离散方程： $$ \\begin cases \\frac U j ^ m+1 -U j ^ m \\tau =\\frac U j+1 ^ m -2U j ^ m +U j-1 ^ m h^ 2 \\\\\\\\ U j ^ 0 =u 0 (x j ), \\quad j=0,\\dots,N\\\\\\\\ U 0 ^ m =U N ^ m =0, \\quad m=1,2,\\dots \\end cases $$ 有限体积法 (FVM) 推导： 令 $\\Omega$ 为矩形区域 $ x j - \\frac 1 2 h, x j + \\frac 1 2 h \\times t m, t m+1 $。利用 $\\iint \\Omega (u t -u xx )dxdt=0$，我们有： $$ \\int x j -\\frac 1 2 h ^ x j +\\frac 1 2 h (u(x,t m+1 )-u(x,t m ))dx=\\int t m ^ t m+1 (u x (x j +\\frac 1 2 h,t)-u x (x j -\\frac 1 2 h,t))dt $$ 然后： $$ LHS \\approx h(u(x j ,t m+1 )-u(x j ,t m )) $$ $$ RHS \\approx \\tau(u x (x j +\\frac 1 2 h,t m )-u x (x j -\\frac 1 2 h,t m )) \\approx \\frac \\tau h (u(x j+1 ,t m )-2u(x j ,t m )+u(x j-1 ,t", "source": "# 第二章：抛物型方程的有限差分法\n\n## 1. 模型问题\n\n我们考虑带有初值和 Dirichlet 边界条件的一维热方程：\n\n$$\n\\begin{cases}\nu_t = u_{xx},\\\\\\\\\nu(x, 0) = u_0(x), \\quad x \\in [0, 1],\\\\\\\\\nu(0,t) = u(1,t) = 0, \\quad t > 0.\n\\end{cases}\n$$\n\n其解析解为：\n\n$$\nu(x,t)=\\sum_{k=1}^{\\infty}a_{k}e^{-k^{2}\\pi^{2}t}\\sin(k\\pi x)\n$$\n\n其中 $a_k = 2 \\int_0^1 u_0(x) \\sin(k\\pi x) \\mathrm{d}x$。\n\n我们引入时空网格：令 $h = \\frac{1}{N},x_j = jh,  j=0,\\dots,N; \\tau=\\Delta t,  t_{m}=m\\tau, m=0,1,\\dots$。这就构成了一个网格函数 $U=\\{U_{j}^{m}\\}$。\n\n### 1.1 显式格式\n\n令\n\n$$\n\\Delta_{+t}u(x,t)=u(x,t+\\tau)-u(x,t)\n$$\n\n$$\n\\delta_{x}^{2}u(x,t)=u(x+h,t)-2u(x,t)+u(x-h,t)\n$$\n\n于是我们得到离散方程：\n\n$$\n\\begin{cases}\n\\frac{U_{j}^{m+1}-U_{j}^{m}}{\\tau}=\\frac{U_{j+1}^{m}-2U_{j}^{m}+U_{j-1}^{m}}{h^{2}}\\\\\\\\\nU_{j}^{0}=u_{0}(x_{j}), \\quad j=0,\\dots,N\\\\\\\\\nU_{0}^{m}=U_{N}^{m}=0, \\quad m=1,2,\\dots\n\\end{cases}\n$$\n\n**有限体积法 (FVM) 推导：**\n\n令 $\\Omega$ 为矩形区域 $[x_j - \\frac{1}{2}h, x_j + \\frac{1}{2}h] \\times [t_m, t_{m+1}]$。利用 $\\iint_{\\Omega}(u_{t}-u_{xx})dxdt=0$，我们有：\n\n$$\n\\int_{x_{j}-\\frac{1}{2}h}^{x_{j}+\\frac{1}{2}h}(u(x,t_{m+1})-u(x,t_{m}))dx=\\int_{t_{m}}^{t_{m+1}}(u_{x}(x_{j}+\\frac{1}{2}h,t)-u_{x}(x_{j}-\\frac{1}{2}h,t))dt\n$$\n\n然后：\n\n$$\nLHS \\approx h(u(x_{j},t_{m+1})-u(x_{j},t_{m}))\n$$\n\n$$\nRHS \\approx \\tau(u_{x}(x_{j}+\\frac{1}{2}h,t_{m})-u_{x}(x_{j}-\\frac{1}{2}h,t_{m})) \\approx \\frac{\\tau}{h}(u(x_{j+1},t_{m})-2u(x_{j},t_{m})+u(x_{j-1},t_{m}))\n$$\n\n于是我们再次得到了上述离散方程。\n\n局部截断误差 $T$ 可以通过泰勒公式计算：\n\n$$\nT=(\\frac{\\Delta_{+t}}{\\tau}-\\frac{\\delta_{x}^{2}}{h^{2}})u - (\\frac{\\partial}{\\partial t}-\\frac{\\partial^{2}}{\\partial x^{2}})u\n$$\n\n$$\nT = \\frac{1}{2}\\tau u_{tt} - \\frac{1}{12}h^{2}u_{xxxx} + O(\\tau^{2}+h^{4}) = \\frac{1}{2}\\tau u_{tt}(x,\\eta)-\\frac{1}{12}h^{2}u_{xxxx}(\\xi,t)\n$$\n\n而真实误差\n\n$$\ne=U-u,e_{j}^{m}=U_{j}^{m}-u(x_{j},t_{m})\n$$\n\n**1. $L^{\\infty}$-稳定性:**\n\n令 $\\Omega_{t_{max}}=(0,1)\\times(0,t_{max})$。我们考虑范数：\n\n$$\n||e||_{\\infty}:=||e||_{L^{\\infty}(\\Omega_{t_{max}})} = \\max \\{|e_{j}^{m}| : 0 \\le jh \\le 1, 0 \\le m\\tau \\le t_{max} \\}\n$$\n\n若对于某个与 $h$ 无关的常数 $C$，满足 $||e||_{\\infty}\\le C||T||_{\\infty}$，则称该差分格式具有 $L^{\\infty}$-稳定性。\n\n令 $U^{m}=(U_{1}^{m},\\dots,U_{N-1}^{m})^T$。则 $U^{m+1}=BU^{m}$，其中：\n\n$$\nB = \\begin{pmatrix}\n1-2\\mu & \\mu & & \\\\\\\\\n\\mu & 1-2\\mu & \\ddots & \\\\\\\\\n& \\ddots & \\ddots & \\mu \\\\\\\\\n& & \\mu & 1-2\\mu\n\\end{pmatrix}\n$$\n\n这里 $\\mu=\\frac{\\tau}{h^{2}}$。若 $1-2\\mu \\ge 0 \\Rightarrow 0 \\le \\mu \\le \\frac{1}{2}$，我们有 $B$ 的元素非负且 $\\sum_{j=1}^{N}B_{ij}\\le1$，即 $B$ 是一个行次随机矩阵 (row sub-stochastic matrix)。所以 $U_{j}^{m+1}$ 是 $U^{m}$ 的凸组合。我们可以得到：\n\n$$\n||U^{m}||_{\\infty} \\le ||U^{m-1}||_{\\infty} \\le \\dots \\le ||U^{0}||_{\\infty}\n$$\n\n由 $U_{j}^{m+1}=(1-2\\mu)U_{j}^{m}+\\mu U_{j-1}^{m}+\\mu U_{j+1}^{m}$，我们有：\n\n$$\ne_{j}^{m+1}=(1-2\\mu)e_{j}^{m}+\\mu e_{j-1}^{m}+\\mu e_{j+1}^{m}-\\tau T_{j}^{m}\n$$\n\n$$\n|e_{j}^{m+1}| \\le \\max_{0\\le j\\le N}|e_{j}^{m}| + \\tau \\max_{1\\le j\\le N-1}|T_{j}^{m}| \\Rightarrow ||e^{m+1}||_{\\infty} \\le ||e^{m}||_{\\infty}+\\tau||T^{m}||_{\\infty}\n$$\n\n由于 $||e^{0}||_{\\infty}=0$，我们得到：\n\n$$\n||e^{m}||_{\\infty} \\le \\tau\\sum_{l=0}^{m-1}||T^{l}||_{\\infty} \\le t_{max}||T||_{\\infty}\n$$\n\n所以 $||e||_{\\infty} \\le t_{max}||T||_{\\infty}$。我们有以下", "has_pdf": false}, {"title": "Chapter1", "url": "/blog/applied-math/numerical-pde/chapter1/", "preview": "首先我们给出推广的定义。考虑高维 PDE", "date": "2025-11-21", "words": 4137, "categories": ["应用数学", "PDE 数值解"], "tags": ["applied-math", "numerical-pde"], "content": "首先我们给出推广的定义。考虑高维 PDE $$ -\\mathcal L u=f,\\quad \\mathcal L =\\sum k=1 ^ 2m \\sum i 1,\\cdots,i k=1 ^n a i 1\\cdots i k (x)\\frac \\partial ^k \\partial x i 1 \\cdots \\partial x i k +\\cdots +a 0 $$ 我们称其为椭圆型的，若 $$ \\forall x\\in \\Omega,\\forall \\xi \\in \\mathbb R ^n\\setminus \\ 0\\ ,\\sum i 1\\cdots i 2m =1 ^n a i 1\\cdots i 2m (x)\\xi i 1 \\cdots \\xi i 2m \\ge \\alpha(x)\\sum i=1 ^n \\xi i^ 2m $$ 其中 $\\alpha(x) 0$。若 $\\inf x\\in \\Omega \\alpha(x) 0$，则称其为一致严格椭圆型。对 $n=2$ 的情形，该定义等价于 $A\\succ 0$。 对 $p\\ge 1$，向量 $a\\in \\mathbb R ^n$ 的 $p-$范数定义为 $\\ a\\ p=\\left(\\sum i=1 ^n a i ^p\\right)^\\frac 1 p $。对矩阵 $A\\in \\mathbb R ^ n\\times m $，其 $p-$范数定义为 $$ \\ A\\ p=\\max \\left\\ \\ Ax\\ p\\Big x\\in \\mathbb R ^m,\\ x\\ p=1\\right\\ $$ $A$ 的 Schatten 范数定义为： $$ \\ A\\ S p =\\left \\text Tr \\left(\\left(\\sqrt A^TA \\right)^p\\right)\\right ^\\frac 1 p =\\left \\sum i s i^p\\right ^\\frac 1 p $$ 其中 $s i$ 为 $A$ 的奇异值。 我们有 $\\ A\\ S \\infty =\\ A\\ 2,\\ A\\ S 2 =\\ A\\ F$. 1.模型问题 对于一般的 2 阶椭圆方程 $$ -\\mathcal L u=f,\\quad \\mathcal L =\\sum i,j=1 ^n a ij (x)\\frac \\partial^2 \\partial x i\\partial x j +\\sum i=1 ^n b i(x)\\frac \\partial \\partial x i +c(x) $$ 我们考虑三种不同的边界条件： $$ \\begin cases \\text Dirichlet : u x\\in \\partial \\Omega =g\\\\ \\text Neumann : \\frac \\partial u \\partial n x\\in ", "source": "首先我们给出推广的定义。考虑高维 PDE\n\n$$\n-\\mathcal{L}u=f,\\quad \\mathcal{L}=\\sum_{k=1}^{2m}\\sum_{i_1,\\cdots,i_k=1}^n a_{i_1\\cdots i_k}(x)\\frac{\\partial ^k}{\\partial x_{i_1}\\cdots \\partial x_{i_k}}+\\cdots +a_0\n$$\n\n!!! abstract \"定义\"\n    我们称其为椭圆型的，若\n    $$\n    \\forall x\\in \\Omega,\\forall \\xi \\in \\mathbb{R}^n\\setminus \\{0\\},\\sum_{i_1\\cdots i_{2m}=1}^n a_{i_1\\cdots i_{2m}}(x)\\xi_{i_1}\\cdots \\xi_{i_{2m}}\\ge \\alpha(x)\\sum_{i=1}^n \\xi_i^{2m}\n    $$\n    其中 $\\alpha(x)>0$。若 $\\inf_{x\\in \\Omega} \\alpha(x)>0$，则称其为一致严格椭圆型。对 $n=2$ 的情形，该定义等价于 $A\\succ 0$。\n\n!!! abstract \"定义\"\n    对 $p\\ge 1$，向量 $a\\in \\mathbb{R}^n$ 的 $p-$范数定义为 $\\|a\\|_p=\\left(\\sum_{i=1}^n |a_i|^p\\right)^\\frac{1}{p}$。对矩阵 $A\\in \\mathbb{R}^{n\\times m}$，其 $p-$范数定义为\n\n    $$\n    \\|A\\|_p=\\max \\left\\{\\|Ax\\|_p\\Big| x\\in \\mathbb{R}^m,\\|x\\|_p=1\\right\\}\n    $$\n\n    $A$ 的 Schatten 范数定义为：\n\n    $$\n    \\|A\\|_{S_p}=\\left[\\text{Tr}\\left(\\left(\\sqrt{A^TA}\\right)^p\\right)\\right]^\\frac{1}{p}=\\left[\\sum_i s_i^p\\right]^\\frac{1}{p}\n    $$\n\n    其中 $s_i$ 为 $A$ 的奇异值。\n\n!!! remark \"注\"\n    我们有 $\\|A\\|_{S_\\infty}=\\|A\\|_2,\\|A\\|_{S_2}=\\|A\\|_F$.\n\n## 1.模型问题\n\n对于一般的 2 阶椭圆方程\n\n$$\n-\\mathcal{L}u=f,\\quad \\mathcal{L}=\\sum_{i,j=1}^n a_{ij}(x)\\frac{\\partial^2}{\\partial x_i\\partial x_j}+\\sum_{i=1}^n b_i(x)\\frac{\\partial }{\\partial x_i}+c(x)\n$$\n\n我们考虑三种不同的边界条件：\n\n$$\n\\begin{cases}\n    \\text{Dirichlet}: u|_{x\\in \\partial \\Omega}=g\\\\\n    \\text{Neumann}: \\frac{\\partial u}{\\partial n}|_{x\\in \\partial \\Omega}=g,n \\text{ 为 }\\partial\\Omega \\text{ 的法向量}\\\\\n    \\text{Robin}: (\\frac{\\partial u}{\\partial n}+\\alpha u)|_{x\\in \\partial \\Omega}=g,\\alpha>0.\n\\end{cases}\n$$\n\n对于 Neumann 边界或周期性边界，差分矩阵通常具有特定的形式 $\\left( \\begin{matrix}\n\t1&\t\t-1&\t\t&\t\t\\\\\n\t-1&\t\t2&\t\t-1&\t\t\\\\\n\t&\t\t\\ddots&\t\t\\ddots&\t\t-1\\\\\n\t&\t\t&\t\t-1&\t\t1\\\\\n\\end{matrix} \\right)$\n或\n$\\left( \\begin{matrix}\n\t2&\t\t-1&\t\t&\t\t-1\\\\\n\t-1&\t\t2&\t\t-1&\t\t\\\\\n\t&\t\t\\ddots&\t\t\\ddots&\t\t-1\\\\\n\t-1&\t\t&\t\t-1&\t\t2\\\\\n\\end{matrix} \\right)$\n。这些矩阵是奇异的，因此解不唯一！必须添加额外条件。这可能会破坏系数矩阵的性质。因此，我们主要讨论 Dirichlet 边界。\n\n我们求解的模型问题是带有 Dirichlet 边界的 Poisson 方程：\n\n$$-\\Delta u(x,y)=f, \\quad x\\in\\Omega=(0,1)\\times(0,1)$$\n\n### 1.1 有限差分法 (Finite Difference Method)\n\n通过有限差分，我们令 $\\Delta x = \\Delta y = h$，网格点为 $x_i=ih, y_j=jh$。\n索引集合定义为：\n\n* $J=\\{ (i,j)\\Big| (x_i,y_j)\\in \\bar{\\Omega}\\}$\n* $J_\\Omega = \\{(i, j) \\mid (x_i, y_j) \\in \\Omega\\}$\n* $J_{\\partial\\Omega} = J_D=\\{(i, j) \\mid (x_i, y_j) \\in \\partial\\Omega\\}$\n\n**5点差分格式**：令近似解 $U:J\\rightarrow\\mathbb{R}$ 为网格集 $J$ 上的函数。\n根据泰勒公式，我们定义离散算子 $L_h U_{ij}$：\n\n$$L_h U_{ij} = \\frac{U_{i+1,j}-2U_{i,j}+U_{i-1,j}}{h^2}+\\frac{U_{i,j+1}-2U_{i,j}+U_{i,j-1}}{h^2}=\\frac{U_{i+1,j}+U_{i-1,j}+U_{i,j+1}+U_{i,j-1}-4U_{ij}}{h^{2}}$$\n\n由泰勒展开：\n\n$$\\frac{u(x_{i+1},y_{j})-2u(x_{i},y_{j})+u(x_{i-1},y_{j})}{h^2}-u_{xx}(x_i,y_j)=\\frac{h^2}{24}(u_{xxxx}(\\xi_1,y_j)+u_{xxxx}(\\xi_2,y_j))$$\n\n$$\\frac{u(x_{i},y_{j+1})-2u(x_{i},y_{j})+u(x_{i},y_{j-1})}{h^2}-u_{yy}(x_i,y_j)=\\frac{h^2}{24}(u_{yyyy}(x_i,\\eta_1)+u_{yyyy}(x_i,\\eta_2))$$\n\n故\n\n$$L_{h}u(x_{i},y_{j})-\\Delta u(x_{i},y_{j})=\\frac{h^{2}}{12}(u_{xxxx}(\\xi,y_{j})+u_{yyyy}(x_{i},\\eta))$$\n\n令 $U$ 为向量 $[U_{ij}]_{i,j=1}^{N-1}$，$F$ 为向量 $[f(x_{i},y_{j", "has_pdf": false}, {"title": "Chapter0", "url": "/blog/applied-math/numerical-pde/chapter0/", "preview": "我们考虑一般形式的二阶PDE：", "date": "2025-11-20", "words": 233, "categories": ["应用数学", "PDE 数值解"], "tags": ["applied-math", "numerical-pde"], "content": "二阶PDE的分类 我们考虑一般形式的二阶PDE： $$ \\sum i,j=1 ^ n a ij (x)u x ix j +\\sum i=1 ^ n b i(x)u x i +c(x)u=f(x) $$ 其中 $u=u(x 1,\\cdots,x n)$ 是未知解，$a ij ,b i,c,f$ 为 $x=(x 1,\\cdots,x n)$ 的已知函数，且 $a ij =a ji $。设 $A= a ij ^n i,j=1 $，则 PDE 通过 $A$ 分为如下几类： 若 $A$ 的特征值符号为 $\\ +,+,\\cdots,+\\ $ 或 $\\ -,-,\\cdots,-\\ $，则称为 椭圆型(elliptic) PDE。 若 $A$ 的特征值符号为 $\\ +,+,\\cdots,+,0\\ $ 或 $\\ -,-,\\cdots,-,0\\ $，则称为 抛物型(parabolic) PDE。 若 $A$ 的特征值符号为 $\\ +,+,\\cdots,+,-\\ $ 或 $\\ -,-,\\cdots,-,+\\ $，则称为 双曲型(hyperbolic) PDE。 考虑 $n=2$ 与 $u=u(x,y)$，则 PDE 可写成 $$au xx +2bu xy +cu yy +du x+eu y+fu=g $$我们有 $$ \\ A\\ =ac-b^2=\\begin cases 0 \\quad &\\text elliptic \\\\ =0 &\\text parabolic \\\\ <0 &\\text hyperbolic \\end cases $$ 为了简化书写，我们定义如下记号： 对 $f:\\mathbb R ^n\\rightarrow \\mathbb R $，定义 $\\nabla f=\\text grad f=\\left(\\frac \\partial f \\partial x 1 ,\\cdots,\\frac \\partial f \\partial x n \\right)^T$ 对 $F:\\mathbb R ^n\\rightarrow \\mathbb R ^n$，定义 $\\nabla \\cdot F=\\text div F=\\sum i=1 ^n \\frac \\partial F i \\partial x i $ 对 $f:\\mathbb R ^n\\rightarrow \\mathbb R $，定义 $\\Delta f =\\nabla \\cdot \\nabla f=\\sum i=1 ^n \\frac \\partial^2 f \\partial x i^2 $ 考虑带边界条件的一般形式 $$ \\begin cases \\mathcal L u=f, \\quad x \\in \\Omega \\\\\\ u=g, \\quad x \\in \\partial \\Omega \\end cases $$ 其中 ", "source": "### 二阶PDE的分类\n\n我们考虑一般形式的二阶PDE：\n\n$$\n\\sum_{i,j=1}^{n}a_{ij}(x)u_{x_ix_j}+\\sum_{i=1}^{n}b_i(x)u_{x_i}+c(x)u=f(x)\n$$\n\n其中 $u=u(x_1,\\cdots,x_n)$ 是未知解，$a_{ij},b_i,c,f$ 为 $x=(x_1,\\cdots,x_n)$ 的已知函数，且 $a_{ij}=a_{ji}$。设 $A=[a_{ij}]^n_{i,j=1}$，则 PDE 通过 $A$ 分为如下几类：\n\n!!! abstract \"定义\"\n\n    * 若 $A$ 的特征值符号为 $\\{+,+,\\cdots,+\\}$ 或 $\\{-,-,\\cdots,-\\}$，则称为 **椭圆型(elliptic)** PDE。\n    * 若 $A$ 的特征值符号为 $\\{+,+,\\cdots,+,0\\}$ 或 $\\{-,-,\\cdots,-,0\\}$，则称为 **抛物型(parabolic)** PDE。\n    * 若 $A$ 的特征值符号为 $\\{+,+,\\cdots,+,-\\}$ 或 $\\{-,-,\\cdots,-,+\\}$，则称为 **双曲型(hyperbolic)** PDE。\n\n考虑 $n=2$ 与 $u=u(x,y)$，则 PDE 可写成\n\n$$au_{xx}+2bu_{xy}+cu_{yy}+du_x+eu_y+fu=g\n$$我们有\n\n$$\n\\|A\\|=ac-b^2=\\begin{cases}\n>0 \\quad &\\text{elliptic}\\\\\n=0 &\\text{parabolic}\\\\\n<0 &\\text{hyperbolic}\n\\end{cases}\n$$\n\n为了简化书写，我们定义如下记号：\n\n!!! abstract \"定义\"\n    * 对 $f:\\mathbb{R}^n\\rightarrow \\mathbb{R}$，定义 $\\nabla f=\\text{grad} f=\\left(\\frac{\\partial f}{\\partial x_1},\\cdots,\\frac{\\partial f}{\\partial x_n}\\right)^T$\n    * 对 $F:\\mathbb{R}^n\\rightarrow \\mathbb{R}^n$，定义 $\\nabla \\cdot F=\\text{div} F=\\sum_{i=1}^n \\frac{\\partial F_i}{\\partial x_i}$\n    * 对 $f:\\mathbb{R}^n\\rightarrow \\mathbb{R}$，定义 $\\Delta f =\\nabla \\cdot \\nabla f=\\sum_{i=1}^n \\frac{\\partial^2 f}{\\partial x_i^2}$\n\n!!! example \"Elliptic\"\n    考虑带边界条件的一般形式\n    $$\n    \\begin{cases}\n    \\mathcal{L}u=f, \\quad x \\in \\Omega \\\\\\\n    u=g, \\quad x \\in \\partial \\Omega\n    \\end{cases}\n    $$\n\n    其中 $\\mathcal{L}$ 是椭圆型算子。进一步的例子有 $\\Delta u=0,x\\in \\Omega$(Laplace 方程)，$\\Delta u=f,x\\in \\Omega$(Poisson 方程)。\n    \n    \n\n!!! example \"Parabolic\"\n    考虑带边界条件的一般形式\n    \n    $$\n    \\begin{cases}\n    u_t=\\mathcal{L}u+f,\\\\\n    u|_{t=0}=u_0,\\\\\n    u|_{x\\in \\partial \\Omega}=g\n    \\end{cases}\n    $$\n\n    其中 $\\mathcal{L}$ 是椭圆型算子。进一步的例子有 $u_t=\\beta\\Delta u+f$(热方程)。\n\n!!! example \"Hyperbolic\"\n    考虑带边界条件的一般形式\n\n    $$\n    \\begin{cases}\n    u_{tt}=\\mathcal{L}u+f,\\\\\n    u|_{t=0}=u_0,u_t|_{t=0}=\\hat{u}_0,\\\\\n    u|_{x\\in \\partial \\Omega}=g\n    \\end{cases}\n    $$\n\n    其中 $\\mathcal{L}$ 是椭圆型算子。进一步的例子有 $u_{tt}=c^2\\Delta u+f$(波动方程)。\n\n下面我们介绍另一种分类方法。\n\n设 $\\vec{u}(t,x):\\mathbb{R}\\times \\mathbb{R}^m$ 且 $\\vec{u}_t+A\\vec{u}_x=\\vec{F},A\\in \\mathbb{R}^{m\\times m}$。\n\n!!! abstract \"定义\"\n\n    * 若 $A$ 无实特征值，则称为 **椭圆型(elliptic)** PDE。\n    * 若 $A$ 有 $m$ 个互不相同的实特征向量和 $m$ 个实特征值，即可对角化，则称为 **双曲型( hyperbolic)** PDE。\n    * 若 $A$ 有 $m$ 个互不相同的实特征值，则称为 **严格双曲型(strictly hyperbolic)** PDE。\n\n事实上我们可以从物理角度考虑，视 $u(x,t)$ 为密度函数，由如下方式改变 $u$:\n\n$$\\begin{cases}\n\\text{flux: }F,\\\\\\\n\\text{source: }G,\n\\end{cases}\n$$则 $u_t+F_x=G$。于是有如下三种有物理意义的例子：\n\n!!! example \"例子\"\n    \n    * Advection：若 $F=au$，$G=0$，则 $u_t+au_x=0$。\n    * Diffusion：若 $F=-\\beta u_x$，$G=0$，则 $u_t=\\beta u_{xx}$。\n    * Steady：若 $F=-\\beta u_x$，$G\\neq 0$，$u_t\\rightarrow 0(t\\rightarrow \\infty)$，则 $-\\beta u_{xx}=G$。\n\n### Fourier 分析\n\n回忆，我们有\n\n!!! success \"命题\"\n\n    * 对 $e^{i\\xi x}$，有 $\\frac{\\mathrm{d} }{\\mathrm{d} x}e^{i\\xi x}=i\\xi e^{i\\xi x}$。\n    * 定义 $D_hV_j:=\\frac{1}{2h}(V_{j+1}-V_{j-1})$ 是定义在 $\\{V_j\\}$ 上的算子。对 $\\omega_j=e^{ijh\\xi}$，$D_h\\omega_j=\\frac{1}{2h}(\\omega_{j+1}-\\omega_{j-1})=\\frac{1}{h}\\sin(", "has_pdf": false}, {"title": "代数2-H笔记", "url": "/blog/algebra/algebra-2h-notes/", "preview": "暂无预览", "date": "2025-11-19", "words": 13, "categories": ["代数"], "tags": ["algebra", "algebra-2h-notes"], "content": "<div style=\"height: 800px; width: 100%;\" <embed src=\"../../assets/algebra-2h-notes.pdf\" type=\"application/pdf\" width=\"100%\" height=\"100%\" </div 点击下载 PDF 完整版 .md-button", "source": "<div style=\"height: 800px; width: 100%;\">\n    <embed src=\"../../assets/algebra-2h-notes.pdf\" type=\"application/pdf\" width=\"100%\" height=\"100%\">\n</div>\n\n[点击下载 PDF 完整版](../../assets/algebra-2h-notes.pdf){ .md-button }", "has_pdf": true}, {"title": "交换代数", "url": "/blog/algebra/commutative-algebra/", "preview": "暂无预览", "date": "2025-11-19", "words": 13, "categories": ["代数"], "tags": ["algebra", "commutative-algebra"], "content": "<div style=\"height: 800px; width: 100%;\" <embed src=\"../../assets/commutative-algebra-notes.pdf\" type=\"application/pdf\" width=\"100%\" height=\"100%\" </div 点击下载 PDF 完整版 .md-button", "source": "<div style=\"height: 800px; width: 100%;\">\n    <embed src=\"../../assets/commutative-algebra-notes.pdf\" type=\"application/pdf\" width=\"100%\" height=\"100%\">\n</div>\n\n[点击下载 PDF 完整版](../../assets/commutative-algebra-notes.pdf){ .md-button }", "has_pdf": true}, {"title": "表示论", "url": "/blog/algebra/representation-theory/", "preview": "暂无预览", "date": "2025-11-19", "words": 12, "categories": ["代数"], "tags": ["algebra", "representation-theory"], "content": "<div style=\"height: 800px; width: 100%;\" <embed src=\"../../assets/representation-theory.pdf\" type=\"application/pdf\" width=\"100%\" height=\"100%\" </div 点击下载 PDF 完整版 .md-button", "source": "<div style=\"height: 800px; width: 100%;\">\n    <embed src=\"../../assets/representation-theory.pdf\" type=\"application/pdf\" width=\"100%\" height=\"100
